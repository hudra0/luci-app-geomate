            selBar.radius.min = '0.001';
            selBar.radius.max = '20000';
            selBar.radius.step = 'any';
            selBar.radius.setAttribute('inputmode', 'decimal');
            selBar.radius.title = 'Radius in km';
            L.DomUtil.create('span', '', field).textContent = 'km';
            L.DomEvent.on(selBar.radius, 'input', onRadiusInput);
            L.DomEvent.on(selBar.radius, 'keydown', function(e) {
                if (e.key === 'Enter') {
                    L.DomEvent.preventDefault(e);
                    endSelection(true);
                }
            });

            selBar.center = L.DomUtil.create('span', 'gm-sel-center', box);
            selBar.center.title = 'Latitude, longitude';
            // Known servers in the circle and in all circles of the filter (updateCount)
            selBar.count = L.DomUtil.create('span', 'gm-sel-count', box);

            actions = L.DomUtil.create('span', 'gm-sel-actions', box);
            barButton(actions, 'Done', 'gm-bar-btn--primary', function() { endSelection(true); },
                'Apply the change');
            barButton(actions, 'Cancel', '', function() { endSelection(false); }, 'Discard the change (Esc)');
            selBar.del = L.DomUtil.create('span', 'gm-sel-delete', actions);

            L.DomEvent.disableClickPropagation(box);
            L.DomEvent.disableScrollPropagation(box);
        }

        function showSelectionBar() {
            selBar.name.textContent = filterLabel(selection.layer.gm);
            renderDeleteButton(false);
            updateCount();
            selBar.box.hidden = false;
            layoutBars();
        }

        function hideSelectionBar() {
            selBar.box.hidden = true;
            layoutBars();
        }

        // Radius and centre in the bar; the field keeps what the user is typing
        function updateSelectionBar() {
            var layer = selection.layer, c = layer.getLatLng().wrap();
            if (document.activeElement !== selBar.radius) {
                selBar.radius.value = kmValue(layer.getRadius());
                selBar.radius.removeAttribute('aria-invalid');
            }
            selBar.center.textContent = c.lat.toFixed(4) + ', ' + c.lng.toFixed(4);
            scheduleCount();
        }

        // The radius field applies at once; values outside 1 m .. 20000 km are marked, not applied
        function onRadiusInput() {
            var s = selection, m = Math.round(selBar.radius.valueAsNumber * 1000);
            if (!s) return;
            if (!(m >= 1 && m <= 20000000)) {
                selBar.radius.setAttribute('aria-invalid', 'true');
                return;
            }
            selBar.radius.removeAttribute('aria-invalid');
            s.layer.setRadius(m);
            // New handles at the new edge; their color comes from the container
            if (s.layer.editing.enabled()) s.layer.editing.updateMarkers();
            updateEditVisuals(s.layer);
        }

        /**
         * Delete in two steps: the first click asks "Delete circle? Yes / No",
         * which falls back to Delete after 5 s.
         * @param {boolean} armed - Show the question instead of the Delete button.
         */
        function renderDeleteButton(armed) {
            var s = selection, box = selBar.del, hadFocus = box.contains(document.activeElement), no;
            if (!s) return;
            clearTimeout(s.deleteTimer);
            s.armed = armed;
            box.textContent = '';
            if (!armed) {
                no = barButton(box, 'Delete', 'gm-bar-btn--danger', function() { renderDeleteButton(true); },
                    'Delete this circle');
            } else {
                L.DomUtil.create('span', '', box).textContent = 'Delete circle?';
                barButton(box, 'Yes', 'gm-bar-btn--danger-solid', requestDelete);
                no = barButton(box, 'No', '', function() { renderDeleteButton(false); });
                s.deleteTimer = setTimeout(function() {
                    if (selection === s) renderDeleteButton(false);
                }, 5000);
            }
            // Keyboard users stay in the bar, on the harmless button
            if (hadFocus) no.focus();
        }

        /**
         * Yes in the bar. The circle keeps the geometry UCI has and stays on the map, faded,
         * until the parent removes it (regionRemoved) or keeps it (regionRejected); for the
         * last circle of a filter the parent first asks what happens to the filter.
         */
        function requestDelete() {
            var layer = selection && selection.layer;
            if (!layer) return;
            endSelection(false);
            layer.gm.deleting = true;
            applyState(layer);
            reportDelete(layer);
        }

        // Click on the map: the selected circle keeps its changes, like Done. A handle pressed
        // without dragging also reaches the map as a click; it keeps the selection.
        function onMapClick(e) {
            var t = e.originalEvent && e.originalEvent.target;
            if (t && t.closest && t.closest('.gm-handle')) return;
            if (mode === 'edit') endSelection(true);
        }

        // Circles of a filter that the parent has confirmed, also hidden ones
        function eachCircle(sid, fn) {
            Object.keys(circles).forEach(function(token) {
                var layer = circles[token];
                if (layer.gm.sid === sid && !layer.gm.pending) fn(layer);
            });
        }

        function filterBySid(sid) {
            return (filters || []).filter(function(f) { return f.sid === sid; })[0] || null;
        }

        /**
         * Shows or hides the circles of a filter (eye in the legend). Hidden circles leave
         * drawnItems, so Fit all skips them; a selected one keeps its changes first.
         * @param {string} sid - The UCI section of the filter.
         * @param {boolean} visible - Show the circles.
         */
        function setFilterVisible(sid, visible) {
            if (visible) delete hiddenSids[sid]; else hiddenSids[sid] = true;
            eachCircle(sid, function(layer) {
                if (visible) {
                    drawnItems.addLayer(layer);
                } else {
                    if (selection && selection.layer === layer) endSelection(true);
                    drawnItems.removeLayer(layer);
                }
            });
            // Shown circles come back on top of the others
            if (visible) sortCircles();
            renderLegendFilters();
        }

        // Zooms to the circles of a filter (magnifier in the legend); hidden ones show again.
        // Returns false when the filter has no circle
        function fitFilter(sid) {
            var bounds = null;
            if (hiddenSids[sid]) setFilterVisible(sid, true);
            eachCircle(sid, function(layer) {
                var b = layer.getLatLng().toBounds(layer.getRadius() * 2);
                bounds = bounds ? bounds.extend(b) : b;
            });
            if (bounds) map.fitBounds(bounds, { padding: FIT_PADDING, maxZoom: 16 });
            return !!bounds;
        }

        function serverState(sid) {
            return servers[sid] || (servers[sid] = { data: null, error: false, loading: false, at: 0, shown: false, layer: null, timer: null });
        }

        /**
         * Asks the parent for the known servers of a filter, unless they are on the way or were
         * loaded less than SERVERS_MAX_AGE ago. Older data stays in use until the answer.
         * @param {string} sid - The UCI section of the filter.
         */
        function requestServers(sid) {
            var s = serverState(sid);
            if (s.loading || (s.data && Date.now() - s.at < SERVERS_MAX_AGE)) return;
            s.loading = true;
            s.timer = setTimeout(function() {
                if (!s.loading) return;
                if (s.shown && !s.data) showToast('Could not load the known servers. Reload the page.');
                onServers({ sid: sid, error: true });
            }, SERVERS_TIMEOUT);
            post('loadKnownServers', { sid: sid });
        }

        /**
         * The parent's answer: { sid, total, approx, missing, points } or { sid, error }. An error
         * keeps no data and turns the dots off; the parent has said why. Dots for a filter
         * without known servers turn off with a note.
         * @param {Object} d - The knownServers message data.
         */
        function onServers(d) {
            var s = servers[d.sid], f = filterBySid(d.sid);
            if (!s) return;
            clearTimeout(s.timer);
            s.loading = false;
            if (d.error || !Array.isArray(d.points)) {
                s.data = null;
                s.error = true;
                s.shown = false;
            } else {
                s.error = false;
                s.at = Date.now();
                s.data = {
                    total: Number(d.total) || 0,
                    approx: d.approx === true,
                    missing: d.missing === true,
                    points: d.points,
                    latlngs: d.points.map(function(p) { return L.latLng(p[0], p[1]); })
                };
                if (s.shown && !s.data.points.length) {
                    s.shown = false;
                    showToast('No known servers for ' + ((f && f.name) || d.sid) + ' yet.');
                }
            }
            drawServers(d.sid);
            renderLegendFilters();
            if (selection && selection.layer.gm.sid === d.sid) scheduleCount();
        }

        // Dot radius in pixels: 3 for one server, 2 more per factor 10, at most 12
        function serverRadius(n) {
            return Math.min(12, 3 + 2 * Math.log10(n));
        }

        /**
         * Shows the known servers of a filter as dots in its color, or removes them. The dots
         * take no clicks: their pane has pointer-events none and lies below the circles, so a
         * click reaches the circle or the map.
         * @param {string} sid - The UCI section of the filter.
         */
        function drawServers(sid) {
            var s = servers[sid], f = filterBySid(sid), color;
            if (!s) return;
            if (s.layer) {
                map.removeLayer(s.layer);
                s.layer = null;
            }
            if (!s.shown || !s.data || !f) return;
            color = f.color || DEFAULT_COLOR;
            s.layer = L.layerGroup(s.data.points.map(function(p, i) {
                return L.circleMarker(s.data.latlngs[i], {
                    renderer: serverRenderer, pane: 'gmServers', interactive: false,
                    radius: serverRadius(p[2]), weight: 1, color: '#ffffff', opacity: 0.9,
                    fillColor: color, fillOpacity: 0.85
                });
            })).addTo(map);
        }

        // Server button in the legend: dots on or off; the first time loads them
        function toggleServers(sid) {
            var s = serverState(sid);
            s.shown = !s.shown;
            if (s.shown) requestServers(sid);
            drawServers(sid);
            renderLegendFilters();
        }

        // After setFilters and updateFilter: dots of removed filters go, the others take the
        // filter color again
        function refreshServers() {
            Object.keys(servers).forEach(function(sid) {
                if (filterBySid(sid)) {
                    drawServers(sid);
                    return;
                }
                clearTimeout(servers[sid].timer);
                if (servers[sid].layer) map.removeLayer(servers[sid].layer);
                delete servers[sid];
            });
        }

        function formatCount(n) {
            return n.toLocaleString('en-US');
        }

        // The counter in the selection bar follows a moved or resized circle at most once a frame
        function scheduleCount() {
            if (!countFrame) countFrame = requestAnimationFrame(function() {
                countFrame = 0;
                updateCount();
            });
        }

        /**
         * Counter in the selection bar: the known servers of the filter inside the selected
         * circle, and inside any of the filter's circles (the firewall allows the union) of all
         * known servers of the filter. Distances with map.distance (Haversine, R = 6371000 m, as
         * in the backend).
         */
        function updateCount() {
            var layer = selection && selection.layer, h = selBar.box.offsetHeight, d;
            if (!layer) return;
            d = (servers[layer.gm.sid] || {}).data;
            selBar.count.textContent = countText(layer);
            selBar.count.title = (d && d.approx) ? 'Positions rounded to about 1 km' : '';
            // The text can wrap the bar to one more line: the bottom controls move up with it
            if (!selBar.box.hidden && selBar.box.offsetHeight !== h) layoutBars();
        }

        // Text of the counter for the selected circle (updateCount)
        function countText(layer) {
            var s = servers[layer.gm.sid], d = s && s.data, others = [], inCircle = 0, inFilter = 0;
            if (!d) return (s && s.error) ? 'Known servers unknown' : (s && s.loading) ? 'Counting known servers…' : '';
            if (!d.total) return 'No known servers yet';
            eachCircle(layer.gm.sid, function(c) {
                if (c !== layer && !c.gm.deleting) others.push(c);
            });
            d.latlngs.forEach(function(ll, i) {
                var n = d.points[i][2];
                if (map.distance(layer.getLatLng(), ll) <= layer.getRadius()) {
                    inCircle += n;
                    inFilter += n;
                } else if (others.some(function(c) { return map.distance(c.getLatLng(), ll) <= c.getRadius(); })) {
                    inFilter += n;
                }
            });
            return formatCount(inCircle) + ' in circle · ' + formatCount(inFilter) + ' / ' +
                formatCount(d.total) + ' in this filter';
        }

        function iconButton(parent, icon, label, key, fn) {
            var b = L.DomUtil.create('button', 'gm-icon-btn', parent);
            b.type = 'button';
            b.title = label;
            b.setAttribute('aria-label', label);
            b.setAttribute('data-key', key);
            L.DomUtil.create('i', 'fa-solid ' + icon, b).setAttribute('aria-hidden', 'true');
            onTap(b, fn);
            return b;
        }

        // Filter list of the legend: color, name, circle count, state, known servers while shown,
        // eye, magnifier and the server button. The server button works without circles too
        function renderLegendFilters() {
            var ul, counts = {}, focused = null;
            if (!legend || !filters) return;
            ul = legend.filters;
            if (ul.contains(document.activeElement)) focused = document.activeElement.getAttribute('data-key');

            Object.keys(circles).forEach(function(token) {
                var gm = circles[token].gm;
                if (gm.sid && !gm.pending) counts[gm.sid] = (counts[gm.sid] || 0) + 1;
            });

            ul.textContent = '';
            if (!filters.length)
                L.DomUtil.create('li', 'gm-legend-empty', ul).textContent = 'No filters yet.';

            filters.forEach(function(f) {
                var li = L.DomUtil.create('li', 'gm-legend-filter', ul),
                    n = counts[f.sid] || 0, hidden = !!hiddenSids[f.sid], name = f.name || f.sid,
                    color = f.color || DEFAULT_COLOR, sv = servers[f.sid] || {}, dot, text, meta, eye, fit, srv;

                if (hidden) L.DomUtil.addClass(li, 'gm-legend-filter--hidden');
                dot = L.DomUtil.create('span', 'gm-legend-dot' + (f.enabled ? '' : ' gm-legend-dot--disabled'), li);
                dot.style.borderColor = color;
                dot.style.background = color;
                text = L.DomUtil.create('span', 'gm-legend-fname', li);
                L.DomUtil.create('span', 'gm-legend-name', text).textContent = name;
                meta = L.DomUtil.create('span', 'gm-legend-meta', text);
                L.DomUtil.create('span', '', meta).textContent =
                    (n === 1 ? '1 circle' : n + ' circles') + (f.enabled ? '' : ' (disabled)') +
                    (sv.shown && sv.data ? ' · ' + formatCount(sv.data.total) + (sv.data.total === 1 ? ' server' : ' servers') : '') +
                    (sv.error ? ' · servers unknown' : '');
                eye = iconButton(li, hidden ? 'fa-eye-slash' : 'fa-eye',
                    (hidden ? 'Show ' : 'Hide ') + name, f.sid + ' eye',
                    function() { setFilterVisible(f.sid, hidden); });
                eye.setAttribute('aria-pressed', hidden ? 'false' : 'true');
                fit = iconButton(li, 'fa-magnifying-glass', 'Zoom to ' + name, f.sid + ' fit',
                    function() { fitFilter(f.sid); });
                eye.disabled = fit.disabled = !n;
                srv = iconButton(li, (sv.shown && sv.loading) ? 'fa-spinner fa-spin' : 'fa-server',
                    (sv.shown ? 'Hide known servers of ' : 'Show known servers of ') + name, f.sid + ' servers',
                    function() { toggleServers(f.sid); });
                srv.setAttribute('aria-pressed', sv.shown ? 'true' : 'false');
                if (sv.shown) L.DomUtil.addClass(srv, 'gm-icon-btn--on');
            });

            if (focused) {
                Array.prototype.forEach.call(ul.querySelectorAll('button'), function(b) {
                    if (b.getAttribute('data-key') === focused) b.focus();
                });
            }
        }

        // One row of the legend: a swatch and a text; returns the swatch
        function legendItem(parent, text) {
            var row = L.DomUtil.create('div', 'gm-legend-item', parent),
                swatch = L.DomUtil.create('span', 'gm-legend-swatch', row);
            L.DomUtil.create('span', '', row).textContent = text;
            return swatch;
        }

        // Open unless the visitor closed it; on narrow maps and phones closed by default
        function legendStartsOpen() {
            var v = null;
            try { v = localStorage.getItem(LEGEND_KEY); } catch (e) {}
            if (v === 'open' || v === 'closed') return v === 'open';
            return !(map.getSize().x < 900 || L.Browser.mobile);
        }

        function setLegendOpen(open, remember) {
            legend.body.hidden = !open;
            legend.toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            legend.toggle.title = open ? 'Hide the legend' : 'Show the legend';
            legend.chevron.className = 'fa-solid gm-legend-chevron ' + (open ? 'fa-chevron-down' : 'fa-chevron-up');
            if (remember) {
                try { localStorage.setItem(LEGEND_KEY, open ? 'open' : 'closed'); } catch (e) {}
            }
        }

        /**
         * An open legend closes while a circle is drawn or selected: it covers the corner where
         * the resize handle often ends up. It opens again afterwards, unless the user toggled it
         * meanwhile; the stored preference stays as it is.
         * @param {boolean} on - Drawing or editing starts (true) or ends (false).
         */
        function holdLegend(on) {
            if (!legend) return;
            if (on && !legend.held && !legend.body.hidden) {
                legend.held = true;
                setLegendOpen(false, false);
            } else if (!on && legend.held) {
                legend.held = false;
                setLegendOpen(true, false);
            }
        }

        var GmLegend = L.Control.extend({
            options: { position: 'bottomright' },
            onAdd: function() {
                var box = L.DomUtil.create('div', 'gm-legend'),
                    body = L.DomUtil.create('div', 'gm-legend-body', box),
                    toggle = L.DomUtil.create('button', 'gm-legend-toggle', box);

                legend = { body: body, toggle: toggle };
                body.id = 'gm-legend-body';

                L.DomUtil.create('h3', '', body).textContent = 'Filters';
                legend.filters = L.DomUtil.create('ul', 'gm-legend-filters', body);

                L.DomUtil.create('h3', '', body).textContent = 'Circles';
                [
                    ['enabled', 'Enabled'],
                    ['disabled', 'Disabled'],
                    ['selected', 'Selected']
                ].forEach(function(s) {
                    var swatch = legendItem(body, s[1]);
                    L.DomUtil.create('span', 'gm-legend-ring gm-legend-ring--' + s[0], swatch);
                });
                // Dots of the server button in the filter list, in the filter color
                L.DomUtil.create('span', 'gm-legend-server', legendItem(body, 'Known servers (bigger: more)'));

                L.DomUtil.create('h3', '', body).textContent = 'Connections';
                [
                    ['fa-check-circle', 'green', 'Allowed'],
                    ['fa-exclamation-triangle', 'red', 'Blocked'],
                    ['fa-user', 'blue', 'Whitelisted']
                ].forEach(function(m) {
                    var i = L.DomUtil.create('i', 'fa ' + m[0], legendItem(body, m[2]));
                    i.style.color = m[1];
                    i.setAttribute('aria-hidden', 'true');
                });
                [
                    ['rgba(0, 128, 0, 0.6)', 'Several allowed'],
                    ['rgba(255, 0, 0, 0.6)', 'Several blocked'],
                    ['rgba(0, 0, 255, 0.6)', 'Several whitelisted'],
                    ['rgba(255, 165, 0, 0.6)', 'Mixed']
                ].forEach(function(c) {
                    L.DomUtil.create('span', 'gm-legend-cluster', legendItem(body, c[1])).style.background = c[0];
                });

                L.DomUtil.create('h3', '', body).textContent = 'Map';
                var darkSwitch = L.DomUtil.create('label', 'gm-legend-switch', body);
                legend.darkTiles = L.DomUtil.create('input', '', darkSwitch);
                legend.darkTiles.type = 'checkbox';
                L.DomUtil.create('span', '', darkSwitch).textContent = 'Dark map tiles';
                L.DomEvent.on(legend.darkTiles, 'change', function() { setDarkTiles(legend.darkTiles.checked, true); });

                toggle.type = 'button';
                toggle.setAttribute('aria-controls', body.id);
                L.DomUtil.create('i', 'fa-solid fa-circle-info', toggle).setAttribute('aria-hidden', 'true');
                L.DomUtil.create('span', '', toggle).textContent = 'Legend';
                legend.chevron = L.DomUtil.create('i', '', toggle);
                legend.chevron.setAttribute('aria-hidden', 'true');
                onTap(toggle, function() {
                    legend.held = false;
                    setLegendOpen(body.hidden, true);
                });

                L.DomEvent.disableClickPropagation(box);
                L.DomEvent.disableScrollPropagation(box);
                return box;
            }
        });

        /**
         * Initializes the map and its components.
         */
        function initMap() {
            home = loadHome();
            setDarkTiles(storedDarkTiles(), false);

            map = L.map('map', {
                center: (home || DEFAULT_VIEW).center,
                zoom: (home || DEFAULT_VIEW).zoom,
                drawControlTooltips: false,
                minZoom: 2,
                maxBounds: [[-90, -180], [90, 180]],
                maxBoundsViscosity: 1.0
            });

            // Add OpenStreetMap tiles to the map
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                noWrap: true,
                bounds: [[-90, -180], [90, 180]]
            }).addTo(map);

            // Known servers: a canvas in a pane of their own below the circles (overlayPane, 400),
            // which takes no pointer events, so circle clicks and map clicks still arrive
            map.createPane('gmServers');
            map.getPane('gmServers').style.zIndex = 350;
            map.getPane('gmServers').style.pointerEvents = 'none';
            serverRenderer = L.canvas({ pane: 'gmServers' });

            // The lowest zoom first: the MarkerCluster group takes it when it is added
            updateMinZoom();
            map.addLayer(markerClusters);

            // Map toolbar: Draw circle (with its menu), Fit all, Home, Set home, Fullscreen
            new GmToolbar().addTo(map);
            createDrawMenu();
            updateToolbar();

            modeBar = L.DomUtil.create('div', 'gm-mode-bar', map.getContainer());
            modeBar.hidden = true;
            modeBar.setAttribute('role', 'status');
            L.DomEvent.disableClickPropagation(modeBar);
            L.DomEvent.disableScrollPropagation(modeBar);
            // The bar wraps on narrow maps
            map.on('resize', layoutBars);
            map.on('resize', onMapResize);
            map.on('resize', function() { if (!drawMenu.hidden) placeDrawMenu(); });
            // Any input on the map keeps its view from now on: no more start view fitting
            ['pointerdown', 'mousedown', 'touchstart', 'wheel', 'keydown'].forEach(function(type) {
                map.getContainer().addEventListener(type, function() { refitUntil = 0; }, { capture: true, passive: true });
            });

            createSelectionBar();

            // Escape closes the draw menu, ends drawing, the delete question and the editing of
            // a circle, then closes a marker popup, then fullscreen; registered once, before
            // Leaflet's keyboard handler, which would close the popup first
            var popupOpen = false;
            map.on('popupopen', function() { popupOpen = true; });
            map.on('popupclose', function() { popupOpen = false; });
            L.DomEvent.on(document, 'keydown', function(e) {
                if (e.key !== 'Escape') return;
                if (!drawMenu.hidden) closeDrawMenu(true);
                else if (mode === 'draw') cancelDraw();
                else if (selection && selection.armed) renderDeleteButton(false);
                else if (mode === 'edit') endSelection(false);
                else if (popupOpen) map.closePopup();
                else if (fullscreen) toggleFullscreen();
            });

            drawnItems = new L.FeatureGroup();
            map.addLayer(drawnItems);

            // Drawing through the map toolbar; editing and deleting per circle (selectCircle)
            map.on(L.Draw.Event.CREATED, onDrawCreated);
            map.on('draw:drawstart', onDrawStart);
            map.on('draw:drawstop', onDrawStop);
            map.on('gm:drawradius', function(e) {
                setModeExtra('Radius ' + formatDistance(e.radius));
                showPill(e.latlng, formatDistance(e.radius));
            });
            map.on('draw:editmove draw:editresize', function(e) { updateEditVisuals(e.layer); });
            map.on('click', onMapClick);
            // Labels of circles that are small on screen hide
            map.on('zoomend', function() {
                Object.keys(circles).forEach(function(token) { showLabel(circles[token]); });
            });

            // Legend: filters with eye and magnifier, circle states, markers
            new GmLegend().addTo(map);
            setLegendOpen(legendStartsOpen(), false);
            legend.darkTiles.checked = L.DomUtil.hasClass(document.documentElement, 'gm-dark-tiles');
            renderLegendFilters();

            // Notify parent frame that the map is ready
            post('mapReady');
        }

        /**
         * Builds the region string of a circle as UCI stores it.
         * @param {Object} layer - The circle layer.
         * @returns {string} - circle:<lat>:<lon>:<radius in meters>
         */
        function regionString(layer) {
            var center = layer.getLatLng().wrap();
            return 'circle:' + center.lat.toFixed(8) + ':' + center.lng.toFixed(8) + ':' + Math.round(layer.getRadius());
        }

        /**
         * Moves a circle drawn or dragged past the antimeridian back into -180..180,
         * where its region string puts it on the next load.
         * @param {Object} layer - The circle layer.
         */
        function wrapCenter(layer) {
            var center = layer.getLatLng(), wrapped = center.wrap();
            if (wrapped.lng !== center.lng) layer.setLatLng(wrapped);
        }

        /**
         * Parses a region string.
         * @param {string} region - The region string from UCI.
         * @returns {Object|null} - { lat, lng, radius } or null if it is not a valid circle.
         */
        function parseRegion(region) {
            var p = String(region).split(':');
            if (p.length !== 4 || p[0] !== 'circle' || p.slice(1).some(function(x) { return !x.trim(); }))
                return null;
            var lat = Number(p[1]), lng = Number(p[2]), radius = Number(p[3]);
            if (!Number.isFinite(lat) || !Number.isFinite(lng) || !Number.isFinite(radius) ||
                Math.abs(lat) > 90 || Math.abs(lng) > 180 || radius <= 0)
                return null;
            return { lat: lat, lng: lng, radius: radius };
        }

        /**
         * Sets style, classes and label of a circle from its layer.gm state: enabled; disabled
         * (faded: thin, pale, desaturated); applying, i.e. a change waits for the parent's answer
         * (dashed, also when disabled); new (waits for the parent); deleting; selected (thicker,
         * shadow) and hover (one pixel thicker, the label also on a small circle).
         * @param {Object} layer - The circle layer.
         */
        function applyState(layer) {
            var gm = layer.gm, color = gm.color || DEFAULT_COLOR, style;

            // weight and opacity also reset what the draw handler's shapeOptions set
            if (gm.pending) {
                style = { weight: 3, opacity: 1, fillOpacity: 0.1, dashArray: '6,6' };
            } else if (gm.deleting) {
                style = { weight: 2, opacity: 0.5, fillOpacity: 0.04, dashArray: '2,6' };
            } else {
                style = gm.enabled ? { weight: 3, opacity: 1, fillOpacity: 0.22 } : { weight: 1.5, opacity: 0.45, fillOpacity: 0.05 };
                style.dashArray = (gm.inflight > 0) ? '10,6' : null;
            }
            if (gm.selected) L.extend(style, { weight: 4, opacity: 1, fillOpacity: 0.15 });
            else if (gm.hover) style.weight += 1;
            style.color = style.fillColor = color;

            layer.setStyle(style);
            applyClasses(layer);
            updateLabel(layer);
        }

        /**
         * State classes on the circle's SVG path. setStyle() cannot set them: Leaflet reads
         * options.className only when it creates the path, and it creates a new path every time
         * the circle is added to the map again ('add' calls this again).
         * @param {Object} layer - The circle layer.
         */
        function applyClasses(layer) {
            var el = layer.getElement(), gm = layer.gm;
            var set = function(name, on) { L.DomUtil[on ? 'addClass' : 'removeClass'](el, name); };
            if (!el) return;
            set('gm-circle', true);
            set('gm-circle--disabled', !gm.pending && !gm.enabled);
            set('gm-circle--selected', !!gm.selected);
        }

        /**
         * Permanent label in the centre: the filter name only, dimmed for a disabled filter. The
         * legend explains the circle states; the selection bar and the pill show the radius.
         * The label element is built once and changed in place.
         * @param {Object} layer - The circle layer.
         */
        function updateLabel(layer) {
            var gm = layer.gm, lb = gm.label, text, changed;

            if (!lb) {
                lb = gm.label = { box: document.createElement('span') };
                lb.box.className = 'gm-label-box';
                layer.bindTooltip(lb.box, { permanent: true, direction: 'center', className: 'gm-label', opacity: 1 });
            }

            text = gm.pending ? (gm.name || 'New filter') : (gm.name || gm.sid);
            changed = lb.box.textContent !== text;

            lb.box.style.borderLeftColor = gm.color || DEFAULT_COLOR;
            lb.box.textContent = text;
            L.DomUtil[!gm.pending && !gm.enabled ? 'addClass' : 'removeClass'](lb.box, 'gm-label-box--disabled');
            showLabel(layer, changed);
        }

        /**
         * Hides the label of a circle that is small on screen (radius below 30 px) unless the
         * pointer is over it, selected (its centre holds the move handle) or not on the map.
         * Hover reaches here through applyState(); showing the label centers it again.
         * @param {Object} layer - The circle layer.
         * @param {boolean} [changed] - The text changed: center the label again.
         */
        function showLabel(layer, changed) {
            var lb = layer.gm.label, tooltip = layer.getTooltip(), hide;
            if (!lb) return;
            hide = !!layer.gm.selected || !layer._map || (screenRadius(layer) < 30 && !layer.gm.hover);
            if (lb.box.hidden === hide && !changed) return;
            lb.box.hidden = hide;
            // The tooltip centers itself by its size, which the text and hiding change
            if (!hide && tooltip && tooltip.isOpen()) tooltip.update();
        }

        function onCircleHover(e) {
            this.gm.hover = (e.type === 'mouseover');
            applyState(this);
        }

        function onCircleAdd() {
            applyClasses(this);
            showLabel(this, true);
        }

        /**
         * Gives a circle its identity and its event handlers, and shows its state.
         * @param {Object} layer - The circle layer.
         * @param {Object} gm - layer.gm without the token.
         */
        function trackCircle(layer, gm) {
            gm.token = tokenPrefix + L.stamp(layer);
            layer.gm = gm;
            circles[gm.token] = layer;
            // Before bindTooltip: the label is sized before the tooltip opens on 'add'
            layer.on({ click: onCircleClick, mouseover: onCircleHover, mouseout: onCircleHover, add: onCircleAdd });
            applyState(layer);
        }

        /**
         * Adds a region of a filter to the map, unless the legend hides the filter.
         * @param {Object} filter - { sid, name, color, enabled } from the parent.
         * @param {string} region - The region string from UCI.
         */
        function addRegion(filter, region) {
            var c = parseRegion(region), layer;
            if (!c) {
                post('regionInvalid', { sid: filter.sid, region: region });
                return;
            }

            layer = L.circle([c.lat, c.lng], { radius: c.radius });
            trackCircle(layer, {
                sid: filter.sid,
                name: filter.name,
                color: filter.color,
                enabled: !!filter.enabled,
                region: region,
                stored: region,
                inflight: 0
            });
            if (!hiddenSids[filter.sid]) drawnItems.addLayer(layer);
        }

        /**
         * Replaces all filters and regions with the ones the parent sent: at the start, and
         * after Undo or a failed change, when the map shows the configuration again.
         * @param {Object} data - { filters: [{ sid, name, color, enabled, regions }] }
         */
        function setFilters(data) {
            endSelection(false);
            drawnItems.clearLayers();
            circles = {};
            filters = [];
            (data.filters || []).forEach(function(filter) {
                if (!filter || !filter.sid) return;
                filters.push({ sid: filter.sid, name: filter.name, color: filter.color, enabled: !!filter.enabled });
                (filter.regions || []).forEach(function(region) {
                    addRegion(filter, region);
                });
            });
            refreshServers();
            renderLegendFilters();

            sortCircles();
            // Draw circle waits for the filter list
            refreshDrawMenu();
            updateToolbar();

            // Start view: the focus filter, else the saved home view, else all regions. Fitted
            // once (a second fit right after an animated one is lost). The iframe may have changed
            // its size since the map measured it, and may still do so while the page settles
            if (!viewFitted) {
                viewFitted = true;
                map.invalidateSize();
                fitStartView();
                refitUntil = Date.now() + 5000;
            }
        }

        /**
         * Updates a filter and the state of every circle of it.
         * @param {string} sid - The UCI section of the filter.
         * @param {Object} changes - Fields to merge into the filter and into layer.gm.
         */
        function updateFilter(sid, changes) {
            var f = filterBySid(sid);
            // A filter the modal has just created
            if (!f && filters && changes.name !== undefined) {
                f = { sid: sid, name: '', color: undefined, enabled: false };
                filters.push(f);
            }
            if (f) L.extend(f, changes);

            Object.keys(circles).forEach(function(token) {
                var layer = circles[token];
                if (layer.gm.sid === sid) {
                    L.extend(layer.gm, changes);
                    applyState(layer);
                }
            });

            if (selection && selection.layer.gm.sid === sid) {
                map.getContainer().style.setProperty('--gm-handle-color', selection.layer.gm.color || DEFAULT_COLOR);
                selBar.name.textContent = filterLabel(selection.layer.gm);
            }
            // An enabled or disabled filter moves its circles in the stacking order
            sortCircles();
            // Dots in a changed filter color
            if (servers[sid]) drawServers(sid);
            renderLegendFilters();
            refreshDrawMenu();
        }

        function forget(token) {
            var layer = circles[token];
            delete circles[token];
            if (layer) {
                if (selection && selection.layer === layer) endSelection(false);
                if (drawnItems.hasLayer(layer)) drawnItems.removeLayer(layer);
            }
            renderLegendFilters();
        }

        /**
         * A new circle stays pending until the parent answers with regionSaved,
         * regionDiscarded or regionRejected. It shows the color of the filter it was drawn for.
         * @param {Object} event - The draw event object.
         */
        function onDrawCreated(event) {
            var layer = event.layer, target = drawingFor || {};
            // A click without a drag gives a circle that UCI cannot store (radius 0 m)
            if (Math.round(layer.getRadius()) < 1) {
                showToast('Drag to draw a circle.');
                return;
            }
            wrapCenter(layer);
            trackCircle(layer, {
                sid: null,
                name: target.isNew ? '' : (target.name || ''),
                color: target.color,
                region: regionString(layer),
                pending: true
            });
            drawnItems.addLayer(layer);
            sortCircles();
            // sid null: a new filter, the parent asks for its name
            post('regionDrawn', { token: layer.gm.token, region: layer.gm.region, sid: target.isNew ? null : (target.sid || null) });
        }

        /**
         * Reports a moved or resized circle with the string the parent knows it by.
         * Optimistic: a second edit before the answer names the new string.
         * @param {Object} layer - The circle layer.
         */
        function reportEdit(layer) {
            var gm = layer.gm, oldRegion = gm.region, region;
            wrapCenter(layer);
            region = regionString(layer);
            if (region === oldRegion) return;

            gm.region = region;
            gm.inflight++;
            post('regionEdited', { token: gm.token, sid: gm.sid, oldRegion: oldRegion, region: region });
        }

        /**
         * Reports a deleted circle. It stays on the map until the parent answers.
         * @param {Object} layer - The circle layer.
         */
        function reportDelete(layer) {
            var gm = layer.gm;
            gm.inflight++;
            post('regionDeleted', { token: gm.token, sid: gm.sid, oldRegion: gm.region });
        }

        /**
         * Answers of the parent to regionDrawn, regionEdited and regionDeleted.
         * @param {string} type - The message type.
         * @param {Object} d - The message data, always with a token.
         */
        function onRegionAnswer(type, d) {
            var layer = circles[d.token], gm = layer && layer.gm, c;
            if (!gm) return;

            if (gm.pending) {
                if (type !== 'regionSaved') {
                    forget(d.token);
                } else {
                    // A new circle cannot be selected before this answer, so it is unchanged
                    L.extend(gm, { sid: d.sid, region: d.region, stored: d.region, inflight: 0, pending: false });
                    updateFilter(d.sid, { name: d.name, color: d.color, enabled: !!d.enabled });
                    // The user has just drawn for this filter: show its circles
                    if (hiddenSids[d.sid]) setFilterVisible(d.sid, true);
                }
            } else {
                gm.inflight--;
                if (type === 'regionRemoved') {
                    forget(d.token);
                } else if (type === 'regionSaved') {
                    gm.stored = d.region;
                    updateFilter(d.sid, { name: d.name, color: d.color, enabled: !!d.enabled });
                } else if (gm.deleting) {
                    // regionRejected after a delete: the circle stays
                    gm.deleting = false;
                }

                // With every answer in, the circle shows what UCI holds
                if (!gm.inflight && circles[d.token] && gm.region !== gm.stored) {
                    if (selection && selection.layer === layer) endSelection(false);
                    gm.region = gm.stored;
                    c = parseRegion(gm.stored);
                    if (c) {
                        layer.setLatLng([c.lat, c.lng]);
                        layer.setRadius(c.radius);
                        sortCircles();
                    }
                }
                // No longer dashed once the last answer is in
                if (circles[d.token]) applyState(layer);
            }

            if (type === 'regionRejected' && d.reason) showToast(d.reason);
        }

        /*
         * Messages between view.js (parent) and this map, { type, data }, same origin only.
         * map -> parent:
         *   mapReady          -
         *   drawState         { drawing }                      a drawing started or ended
         *   regionDrawn       { token, region, sid }           sid null: "New filter…" in the draw menu
         *   regionEdited      { token, sid, oldRegion, region }
         *   regionDeleted     { token, sid, oldRegion }
         *   regionInvalid     { sid, region }
         *   toastAction       { name, sid, id }                button in a toast: undo, enableFilter
         *   fullscreen        { on }                           fullscreen button or Escape asks for it
         *   loadKnownServers  { sid }                          server button in the legend, or a circle selected
         * parent -> map:
         *   theme             { dark, bg, fg, border, accent, accentFg, danger, dangerFg, success }
         *   fullscreen        { on }                           the state the view has set
         *   setReadonly       { readonly }                     no drawing or editing tools when true
         *   setFilters        { filters: [{ sid, name, color, enabled, regions }] }
         *   fitFilter         { sid }                          start view: the circles of this filter, once, before the first setFilters
         *   cancelDraw        -                                Escape outside the map
         *   filterChanged     { sid, name, color, enabled }    e.g. after Enable in a toast
         *   regionSaved       { token, sid, name, color, enabled, region }   sent once applied
         *   regionRemoved, regionDiscarded { token }; regionRejected { token, reason }
         *   toast             { text, actions: [{ label, name, sid, id }] }
         *   updateConnections [connection]
         *   knownServers      { sid, total, approx, missing, points: [[lat, lon, n]] } or { sid, error }
         */
        window.addEventListener('message', function(event) {
            if (event.origin !== location.origin || event.source !== window.parent || !event.data) return;

            var type = event.data.type, data = event.data.data;
            if (type === 'setFilters') {
                setFilters(data || {});
            } else if (type === 'fitFilter' && data && data.sid) {
                focusSid = String(data.sid);
                if (viewFitted) fitStartView();  // late: the start view has been fitted already
            } else if (type === 'updateConnections') {
                updateConnections(data || []);
            } else if (type === 'knownServers' && data && data.sid) {
                onServers(data);
            } else if (type === 'theme' && data) {
                setTheme(data);
            } else if (type === 'fullscreen' && data) {
                setFullscreenState(data.on === true);
            } else if (type === 'setReadonly') {
                setReadonly(!data || data.readonly !== false);
            } else if (type === 'cancelDraw') {
                cancelDraw();
            } else if (type === 'filterChanged' && data && data.sid) {
                updateFilter(data.sid, { name: data.name, color: data.color, enabled: !!data.enabled });
            } else if (type === 'toast' && data && data.text) {
                showToast(String(data.text), (Array.isArray(data.actions) ? data.actions : []).filter(function(a) {
                    return a && a.name && a.label;
                }).map(function(a) {
                    return { label: String(a.label), name: String(a.name), sid: a.sid, id: a.id };
                }));
            } else if (/^region(Saved|Removed|Discarded|Rejected)$/.test(type) && data) {
                onRegionAnswer(type, data);
            }
        }, false);

        // Initialize the map on page load
        initMap();
    </script>
</body>
</html>
