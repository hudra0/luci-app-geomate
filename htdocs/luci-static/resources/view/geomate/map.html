<!DOCTYPE html>
<html>
<head>
    <title>Geomate Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Leaflet.markercluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <style>
        html, body { margin: 0; }
        #map { height: 100vh; width: 100%; }

        /* Colors of the map's own controls; the theme handover (phase 3) overrides them */
        :root {
            --gm-bg: #ffffff;
            --gm-fg: #1f2328;
            --gm-hover: #eef1f4;
            --gm-disabled-bg: #f4f4f4;
            --gm-disabled-fg: #a0a6ad;
            --gm-accent: #1a6fd1;
            --gm-accent-fg: #ffffff;
            --gm-font: 600 13px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }

        /* Map toolbar: labelled buttons in two groups (drawing, view) */
        .gm-toolbar { display: flex; flex-direction: column; gap: 10px; }
        .leaflet-bar.gm-toolbar-group { background: var(--gm-bg); }
        .leaflet-bar a.gm-btn,
        .leaflet-touch .leaflet-bar a.gm-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            box-sizing: border-box;
            width: auto;
            min-width: 36px;
            height: 36px;
            padding: 0 12px 0 10px;
            line-height: 1.2;
            font: var(--gm-font);
            text-align: left;
            white-space: nowrap;
            color: var(--gm-fg);
            background: var(--gm-bg);
        }
        .gm-btn i { width: 16px; font-size: 15px; text-align: center; }
        .gm-btn--draw i { color: var(--gm-target, var(--gm-accent)); }
        .leaflet-bar a.gm-btn:hover { background: var(--gm-hover); color: var(--gm-fg); }
        .leaflet-bar a.gm-btn:focus { outline: none; }
        .leaflet-bar a.gm-btn:focus-visible { outline: 2px solid var(--gm-accent); outline-offset: -3px; }
        .leaflet-bar a.gm-btn.gm-btn--active,
        .leaflet-bar a.gm-btn.gm-btn--active:hover { background: var(--gm-accent); color: var(--gm-accent-fg); }
        .leaflet-bar a.gm-btn.gm-btn--active i { color: inherit; }
        .leaflet-bar a.gm-btn.leaflet-disabled,
        .leaflet-bar a.gm-btn.leaflet-disabled:hover { background: var(--gm-disabled-bg); color: var(--gm-disabled-fg); cursor: not-allowed; }
        .leaflet-bar a.gm-btn.leaflet-disabled i { color: inherit; }
        @media (pointer: coarse) {
            .leaflet-bar a.gm-btn,
            .leaflet-touch .leaflet-bar a.gm-btn { min-width: 44px; height: 44px; font-size: 14px; }
        }
        /* Narrow maps: icons only, the title attribute keeps the label */
        @media (max-width: 639px) {
            .gm-btn-label { display: none; }
            .leaflet-bar a.gm-btn,
            .leaflet-touch .leaflet-bar a.gm-btn { width: 36px; padding: 0; justify-content: center; }
        }
        @media (max-width: 639px) and (pointer: coarse) {
            .leaflet-bar a.gm-btn,
            .leaflet-touch .leaflet-bar a.gm-btn { width: 44px; }
        }

        /* Mode bar: a fixed strip on top of the map while drawing, setting home or editing */
        .gm-mode-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1001;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 6px 12px;
            box-sizing: border-box;
            min-height: 40px;
            padding: 6px 12px;
            font: var(--gm-font);
            color: var(--gm-accent-fg);
            background: var(--gm-accent);
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
            cursor: default;
        }
        .gm-mode-bar[hidden] { display: none; }
        .gm-mode-swatch { flex: none; width: 12px; height: 12px; margin-right: -6px; border: 2px solid var(--gm-accent-fg); border-radius: 50%; }
        .gm-mode-extra:empty { display: none; }
        .gm-mode-extra { font-variant-numeric: tabular-nums; }
        .gm-mode-bar button {
            min-height: 28px;
            padding: 3px 14px;
            font: inherit;
            color: inherit;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 4px;
            cursor: pointer;
        }
        .gm-mode-bar button:hover { background: rgba(255, 255, 255, 0.18); }
        .gm-mode-bar button:focus-visible { outline: 2px solid var(--gm-accent-fg); outline-offset: 2px; }
        @media (pointer: coarse) {
            .gm-mode-bar button { min-height: 40px; }
        }

        .custom-div-icon i {
            font-size: 20px;
        }

        /* Custom Cluster Icons */
        .marker-cluster {
            background-color: rgba(0, 0, 0, 0.3); /* Transparency */
            border-radius: 50%;
            color: white;
            display: flex; /* Flexbox for centering */
            align-items: center; /* Vertical centering */
            justify-content: center; /* Horizontal centering */
            font-weight: bold;
            font-size: 14px;
            line-height: 1;
            width: 40px; /* Width */
            height: 40px; /* Height */
        }
        .marker-cluster-allowed {
            background-color: rgba(0, 128, 0, 0.6); /* Green with higher transparency */
        }
        .marker-cluster-blocked {
            background-color: rgba(255, 0, 0, 0.6); /* Red with higher transparency */
        }
        .marker-cluster-mixed {
            background-color: rgba(255, 165, 0, 0.6); /* Orange with higher transparency */
        }
        .marker-cluster-allowed-ip {
            background-color: rgba(0, 0, 255, 0.6); /* Blue with higher transparency */
        }        

        /* Remove the icons within the clusters */
        .marker-cluster i {
            display: none;
        }

        /* Ensure that no additional margins or paddings are present */
        .marker-cluster div {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* Custom Legend Control */
        .legend-control {
            background: white;
            padding: 10px;
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
            max-width: 250px;
        }
        .legend-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .legend-content {
            font-size: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        .legend-icon {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .legend-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 8px;
        }

        /* Short messages from the parent, e.g. why a change was not staged */
        #gm-toast {
            display: none;
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1002;
            max-width: 80%;
            padding: 6px 12px;
            background: white;
            color: #333;
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
            font: 13px/1.4 sans-serif;
            pointer-events: none;   /* text only: clicks and drags reach the map and its controls */
        }
        #gm-toast .gm-toast-action {
            pointer-events: auto;   /* except its action button */
            margin-left: 8px;
            min-height: 28px;
            padding: 3px 12px;
            font: var(--gm-font);
            color: var(--gm-accent-fg);
            background: var(--gm-accent);
            border: 0;
            border-radius: 4px;
            cursor: pointer;
        }
        #gm-toast .gm-toast-action:focus-visible { outline: 2px solid var(--gm-fg); outline-offset: 2px; }
        @media (pointer: coarse) {
            #gm-toast .gm-toast-action { min-height: 40px; }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="gm-toast" role="status"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script>
        'use strict';

        var map, drawnItems;
        var drawControl = null; // edit and delete toolbar, on the map only while the parent allows changes
        var readonly = true;    // until the parent says otherwise (setReadonly)
        var HOME_KEY = 'geomate-map-home';
        var home = { center: [51.505, -0.09], zoom: 4 };
        var toolbar = null;     // buttons of the map toolbar
        var modeBar = null;     // strip on top of the map that explains the current mode
        var mode = null;        // null, 'draw', 'home', 'edit' or 'delete'
        var drawTarget = null;  // filter Draw circle draws for (selectFilter); null disables Draw
        var drawHandler = null; // the running L.Draw.Circle
        var drawingFor = null;  // drawTarget when the running drawing started
        var viewFitted = false; // the start view has been fitted to the regions

        /*
         * Region identity lives in layer.gm, never in layer.options: Leaflet.draw saves and
         * restores layer.options around every edit session.
         * gm = { token, sid, name, color, enabled, region, stored, inflight, staged, pending }
         * stored is the string the parent last confirmed for UCI; region is the newest string the
         * map reported, which the next action names. The parent matches regions on the string
         * alone and answers the actions in the order they were sent; inflight counts the open ones.
         */
        var circles = {}; // token -> layer, kept until the parent has answered for it
        // Tokens differ between iframe loads, so a late answer never hits a circle of a new map
        var tokenPrefix = Math.random().toString(36).slice(2, 10) + '-';
        var toastTimer = null;

        // Define specialized icons for different marker types
        var blockedDivIcon = L.divIcon({
            html: '<i class="fa fa-exclamation-triangle" style="color: red;"></i>',
            iconSize: [25, 25],
            className: 'custom-div-icon'
        });

        var allowedConnectionIcon = L.divIcon({
            html: '<i class="fa fa-check-circle" style="color: green;"></i>',
            iconSize: [25, 25],
            className: 'custom-div-icon'
        });

        var allowedIPIcon = L.divIcon({
            html: '<i class="fa fa-user" style="color: blue;"></i>',
            iconSize: [25, 25],
            className: 'custom-div-icon'
        });

        var connectionMarkers = {};

        // Initialize MarkerCluster group with customized iconCreateFunction
        var markerClusters = L.markerClusterGroup({
            iconCreateFunction: function(cluster) {
                var markers = cluster.getAllChildMarkers();
                var allowed = 0;
                var blocked = 0;
                var allowedIPs = 0;

                markers.forEach(function(marker) {
                    if (marker.options.icon === allowedConnectionIcon) {
                        allowed += 1;
                    } else if (marker.options.icon === blockedDivIcon) {
                        blocked += 1;
                    } else if (marker.options.icon === allowedIPIcon) {
                        allowedIPs += 1;
                    }
                });

                var size = markers.length;
                var className = '';
                var html = '';

                if (allowed > 0 && blocked === 0 && allowedIPs === 0) {
                    className = 'marker-cluster marker-cluster-allowed';
                    html = size;
                } else if (blocked > 0 && allowed === 0 && allowedIPs === 0) {
                    className = 'marker-cluster marker-cluster-blocked';
                    html = size;
                } else if (allowedIPs > 0 && allowed === 0 && blocked === 0) {
                    className = 'marker-cluster marker-cluster-allowed-ip'; // Use the new class for Allowed IP Clusters
                    html = size;
                } else {
                    className = 'marker-cluster marker-cluster-mixed';
                    html = size;
                }

                return new L.DivIcon({
                    html: '<div>' + html + '</div>',
                    className: className,
                    iconSize: L.point(40, 40) // Adjusted size to 40x40
                });
            }
        });

        function post(type, data) {
            window.parent.postMessage({ type: type, data: data }, location.origin);
        }

        /**
         * Shows a short message on top of the map.
         * @param {string} text - The message, shown as text.
         * @param {Object} [action] - { label, name, sid }: a button that sends toastAction { name, sid }.
         */
        function showToast(text, action) {
            var el = document.getElementById('gm-toast'), button;
            var hide = function() { el.style.display = 'none'; };

            el.textContent = text;
            if (action) {
                button = L.DomUtil.create('button', 'gm-toast-action', el);
                button.type = 'button';
                button.textContent = action.label;
                onTap(button, function() {
                    hide();
                    post('toastAction', { name: action.name, sid: action.sid });
                });
            }
            el.style.display = 'block';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(hide, action ? 15000 : 6000);
        }

        /**
         * Runs fn on a click (mouse, touch or keyboard) on el, which then goes no further.
         * While Leaflet.draw draws, it cancels every touchstart of the page, so a touch gives
         * no click event; touchend acts then. Not tested on touch devices yet.
         */
        function onTap(el, fn) {
            L.DomEvent.on(el, 'click', function(e) {
                L.DomEvent.stop(e);
                fn();
            });
            L.DomEvent.on(el, 'touchend', function(e) {
                if (drawHandler) {
                    L.DomEvent.stop(e);
                    fn();
                }
            });
        }

        // Popup content as text nodes: filter names never run as markup
        function popupContent(lines) {
            var div = document.createElement('div');
            lines.forEach(function(line, i) {
                if (i) div.appendChild(document.createElement('br'));
                div.appendChild(document.createTextNode(line));
            });
            return div;
        }

        /**
         * Updates the map with the latest connection data.
         * @param {Array} connections - An array of connection objects.
         */
        function updateConnections(connections) {
            // Remove old connection markers from the cluster group
            markerClusters.clearLayers();
            connectionMarkers = {};

            connections.forEach(function(conn) {
                if (!conn || !conn.geo) {
                    return;
                }

                var geo = conn.geo;
                var ip = conn.dst;
                var allowed = conn.allowed;
                var filterName = conn.filter_name;
                var isAllowedIP = conn.is_allowed_ip;

                if (geo.lat && geo.lon && !Array.isArray(geo.lat) && !Array.isArray(geo.lon)) {
                    var marker;
                    // Whitelisted IPs (allowed_ip) arrive here with is_allowed_ip
                    if (isAllowedIP) {
                        marker = L.marker([geo.lat, geo.lon], { icon: allowedIPIcon });
                        marker.bindPopup(popupContent(['Allowed IP: ' + ip, 'Filter: ' + filterName]));
                    } else if (allowed) {
                        marker = L.marker([geo.lat, geo.lon], { icon: allowedConnectionIcon });
                        marker.bindPopup(popupContent(['IP: ' + ip, 'Status: Allowed', 'Filter: ' + filterName]));
                    } else {
                        marker = L.marker([geo.lat, geo.lon], { icon: blockedDivIcon });
                        marker.bindPopup(popupContent(['IP: ' + ip, 'Status: Blocked', 'Filter: ' + filterName]));
                    }

                    markerClusters.addLayer(marker);
                    connectionMarkers[ip] = marker;
                }
            });
        }

        /**
         * Shows or hides the drawing and editing tools. Without write access the parent
         * stages nothing, so the map offers no tools.
         * @param {boolean} value - True when the user may not change regions.
         */
        function setReadonly(value) {
            readonly = value;
            if (readonly) {
                cancelDraw();
                if (drawControl._map) map.removeControl(drawControl);
            } else if (!drawControl._map) {
                map.addControl(drawControl);
            }
            updateToolbar();
        }

        // Home view: { center: [lat, lng], zoom }; the older map stored only [lat, lng] (zoom 4)
        function loadHome() {
            var isLatLng = function(v) {
                return Array.isArray(v) && v.length === 2 && Number.isFinite(v[0]) && Number.isFinite(v[1]) &&
                    Math.abs(v[0]) <= 90 && Math.abs(v[1]) <= 180;
            };
            try {
                var v = JSON.parse(localStorage.getItem(HOME_KEY) || 'null');
                if (v && isLatLng(v.center) && Number.isFinite(v.zoom)) return { center: v.center, zoom: v.zoom };
                v = JSON.parse(localStorage.getItem('homePosition') || 'null');
                if (isLatLng(v)) return { center: v, zoom: 4 };
            } catch (e) {}
            return home;
        }

        function goHome() {
            map.setView(home.center, home.zoom);
        }

        /**
         * Zooms to all regions, or to the home view when there are none.
         * @param {boolean} [quiet] - No note when there is no region (start view).
         */
        function fitAll(quiet) {
            var bounds = drawnItems.getBounds();
            if (bounds.isValid()) {
                map.fitBounds(bounds.pad(0.15), { maxZoom: 10 });
            } else {
                goHome();
                if (!quiet) showToast('No regions yet: showing the home view.');
            }
        }

        /**
         * Shows the mode bar with a text and buttons, and moves the top controls below it.
         * @param {string} text - What the user can do now.
         * @param {Array} buttons - [[label, fn], ...]
         * @param {string} [color] - Filter color, shown as a dot before the text.
         */
        function showModeBar(text, buttons, color) {
            modeBar.textContent = '';
            if (color) L.DomUtil.create('span', 'gm-mode-swatch', modeBar).style.background = color;
            L.DomUtil.create('span', 'gm-mode-text', modeBar).textContent = text;
            L.DomUtil.create('span', 'gm-mode-extra', modeBar);
            buttons.forEach(function(b) {
                var el = L.DomUtil.create('button', '', modeBar);
                el.type = 'button';
                el.textContent = b[0];
                onTap(el, b[1]);
            });
            modeBar.hidden = false;
            layoutModeBar();
        }

        function hideModeBar() {
            modeBar.hidden = true;
            layoutModeBar();
        }

        // Extra text in the mode bar, e.g. the radius while drawing
        function setModeExtra(text) {
            var el = modeBar.querySelector('.gm-mode-extra');
            if (el) el.textContent = text;
        }

        function layoutModeBar() {
            var h = modeBar.hidden ? 0 : modeBar.offsetHeight;
            map.getContainer().querySelectorAll('.leaflet-top').forEach(function(el) {
                el.style.top = h ? h + 'px' : '';
            });
            document.getElementById('gm-toast').style.top = (h + 10) + 'px';
        }

        /**
         * Formats a radius for the mode bar: meters below 1 km, one decimal below 10 km.
         * @param {number} m - Radius in meters.
         */
        function formatDistance(m) {
            if (m < 1000) return Math.round(m) + ' m';
            if (m < 10000) return (m / 1000).toFixed(1) + ' km';
            return Math.round(m / 1000) + ' km';
        }

        function setPressed(el, on) {
            L.DomUtil[on ? 'addClass' : 'removeClass'](el, 'gm-btn--active');
            el.setAttribute('aria-pressed', on ? 'true' : 'false');
        }

        function targetName(target) {
            return target.isNew ? 'a new filter' : (target.name || target.sid);
        }

        // State, titles and visibility of the toolbar buttons
        function updateToolbar() {
            var a = toolbar.draw, editing = mode === 'edit' || mode === 'delete',
                disabled = !drawTarget || editing;

            toolbar.drawGroup.style.display = readonly ? 'none' : '';
            L.DomUtil[disabled ? 'addClass' : 'removeClass'](a, 'leaflet-disabled');
            a.setAttribute('aria-disabled', disabled ? 'true' : 'false');
            a.style.setProperty('--gm-target', drawTarget && drawTarget.color || '');
            a.title = editing ? 'Finish editing first: Save or Cancel next to the edit buttons' :
                !drawTarget ? 'Choose a filter above the map to draw a circle' :
                mode === 'draw' ? 'Stop drawing (Esc)' :
                'Draw a circle for ' + targetName(drawTarget);
            setPressed(a, mode === 'draw');
            setPressed(toolbar.setHome, mode === 'home');
        }

        /**
         * Labelled toolbar button: icon plus text, the text hides on narrow maps.
         * A disabled button tells why in a toast.
         */
        function toolbarButton(group, icon, label, title, fn, className) {
            var a = L.DomUtil.create('a', 'gm-btn' + (className ? ' ' + className : ''), group);
            a.href = '#';
            a.title = title;
            a.setAttribute('role', 'button');
            a.setAttribute('aria-label', label);
            L.DomUtil.create('i', 'fa-solid ' + icon, a).setAttribute('aria-hidden', 'true');
            L.DomUtil.create('span', 'gm-btn-label', a).textContent = label;
            onTap(a, function() {
                if (L.DomUtil.hasClass(a, 'leaflet-disabled')) {
                    showToast(a.title + '.');
                } else {
                    fn();
                }
            });
            // Space works like on a button; Enter clicks the link anyway
            L.DomEvent.on(a, 'keydown', function(e) {
                if (e.key === ' ') {
                    L.DomEvent.preventDefault(e);
                    a.click();
                }
            });
            return a;
        }

        var GmToolbar = L.Control.extend({
            options: { position: 'topleft' },
            onAdd: function() {
                var box = L.DomUtil.create('div', 'gm-toolbar');
                var drawGroup = L.DomUtil.create('div', 'leaflet-bar gm-toolbar-group', box);
                var viewGroup = L.DomUtil.create('div', 'leaflet-bar gm-toolbar-group', box);

                toolbar = {
                    drawGroup: drawGroup,
                    draw: toolbarButton(drawGroup, 'fa-circle-plus', 'Draw circle', '', toggleDraw, 'gm-btn--draw'),
                    fit: toolbarButton(viewGroup, 'fa-expand', 'Fit all', 'Zoom to all regions', function() { fitAll(false); }),
                    home: toolbarButton(viewGroup, 'fa-house', 'Home', 'Go to the home view', goHome),
                    setHome: toolbarButton(viewGroup, 'fa-location-dot', 'Set home',
                        'Set the home view: click the map at the zoom you want', toggleSetHome)
                };
                L.DomEvent.disableClickPropagation(box);
                L.DomEvent.disableScrollPropagation(box);
                return box;
            }
        });

        // Leaflet.draw circle handler that reports the radius while the user drags
        var GmDrawCircle = L.Draw.Circle.extend({
            _drawShape: function(latlng) {
                L.Draw.Circle.prototype._drawShape.call(this, latlng);
                this._map.fire('gm:drawradius', { radius: this._shape.getRadius() });
            }
        });

        /**
         * Starts drawing a circle for a filter.
         * @param {Object} [target] - { sid, name, color, isNew } from startDraw; default drawTarget.
         */
        function startDraw(target) {
            if (readonly) return;
            if (target) selectFilter(target);
            if (!drawTarget) {
                showToast('Choose a filter above the map first.');
                return;
            }
            if (mode === 'edit' || mode === 'delete') {
                showToast('Finish editing first: Save or Cancel next to the edit buttons.');
                return;
            }
            if (mode === 'home') stopSetHome();
            if (drawHandler) return;

            var color = drawTarget.color || '#666666';
            drawingFor = drawTarget;
            drawHandler = new GmDrawCircle(map, {
                shapeOptions: { color: color, fillColor: color, weight: 2, opacity: 1, dashArray: '6,6', fillOpacity: 0.12 },
                showRadius: true
            });
            drawHandler.enable();
        }

        function cancelDraw() {
            if (!drawHandler) return;
            map.fire('draw:canceled', { layerType: 'circle' });
            drawHandler.disable();
        }

        function toggleDraw() {
            if (mode === 'draw') {
                cancelDraw();
            } else {
                startDraw();
            }
        }

        function onDrawStart() {
            mode = 'draw';
            showModeBar('Drawing a circle for ' + targetName(drawingFor) + ': click and drag · Esc cancels',
                [['Cancel', cancelDraw]], drawingFor.color);
            updateToolbar();
            post('drawState', { drawing: true });
        }

        // Also after a finished drawing: Leaflet.draw fires draw:created before it stops
        function onDrawStop() {
            drawHandler = null;
            drawingFor = null;
            if (mode === 'draw') {
                mode = null;
                hideModeBar();
            }
            updateToolbar();
            post('drawState', { drawing: false });
        }

        /**
         * Sets the filter Draw circle draws for. A different filter ends a running drawing.
         * @param {Object|null} target - { sid, name, color, enabled, isNew } or null.
         */
        function selectFilter(target) {
            var next = target && (target.sid || target.isNew) ? target : null;
            var same = next && drawTarget && next.sid === drawTarget.sid && !!next.isNew === !!drawTarget.isNew;
            drawTarget = next;
            if (!same) cancelDraw();
            updateToolbar();
        }

        function toggleSetHome() {
            if (mode === 'home') {
                stopSetHome();
                return;
            }
            if (mode === 'edit' || mode === 'delete') {
                showToast('Finish editing first: Save or Cancel next to the edit buttons.');
                return;
            }
            cancelDraw();
            mode = 'home';
            L.DomUtil.addClass(map.getContainer(), 'leaflet-crosshair');
            map.on('click', onSetHomeClick);
            showModeBar('Click the map to make it the home view at the current zoom · Esc cancels',
                [['Cancel', stopSetHome]]);
            updateToolbar();
        }

        function stopSetHome() {
            if (mode !== 'home') return;
            map.off('click', onSetHomeClick);
            L.DomUtil.removeClass(map.getContainer(), 'leaflet-crosshair');
            mode = null;
            hideModeBar();
            updateToolbar();
        }

        function onSetHomeClick(e) {
            var center = e.latlng.wrap();
            home = { center: [center.lat, center.lng], zoom: map.getZoom() };
            try {
                localStorage.setItem(HOME_KEY, JSON.stringify(home));
            } catch (err) {
                showToast('The home view could not be saved in this browser; it lasts until the page reloads.');
            }
            stopSetHome();
            goHome();
        }

        // The edit and delete toolbar of Leaflet.draw explains itself in the mode bar
        function onEditStart(e) {
            cancelDraw();
            stopSetHome();
            mode = (e.type === 'draw:deletestart') ? 'delete' : 'edit';
            showModeBar(mode === 'edit'
                ? 'Editing regions: drag the centre handle to move a circle, the edge handle to resize it · Save or Cancel next to the edit buttons'
                : 'Deleting regions: click the circles to remove · Save or Cancel next to the edit buttons', []);
            updateToolbar();
        }

        function onEditStop() {
            mode = null;
            hideModeBar();
            updateToolbar();
        }

        /**
         * Initializes the map and its components.
         */
        function initMap() {
            home = loadHome();

            map = L.map('map', {
                center: home.center,
                zoom: home.zoom,
                drawControlTooltips: false,
                minZoom: 2,
                maxBounds: [[-90, -180], [90, 180]],
                maxBoundsViscosity: 1.0
            });

            // Add OpenStreetMap tiles to the map
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                noWrap: true,
                bounds: [[-90, -180], [90, 180]]
            }).addTo(map);

            // Add the MarkerCluster group to the map
            map.addLayer(markerClusters);

            // Map toolbar: Draw circle, Fit all, Home, Set home
            new GmToolbar().addTo(map);
            updateToolbar();

            modeBar = L.DomUtil.create('div', 'gm-mode-bar', map.getContainer());
            modeBar.hidden = true;
            modeBar.setAttribute('role', 'status');
            L.DomEvent.disableClickPropagation(modeBar);
            L.DomEvent.disableScrollPropagation(modeBar);
            // The bar wraps on narrow maps
            map.on('resize', layoutModeBar);

            // Escape ends drawing and Set home; registered once
            L.DomEvent.on(document, 'keydown', function(e) {
                if (e.key !== 'Escape') return;
                if (mode === 'draw') cancelDraw();
                else if (mode === 'home') stopSetHome();
            });

            drawnItems = new L.FeatureGroup();
            map.addLayer(drawnItems);

            // No "Clear All" in the delete toolbar: it removed every circle of every filter at once
            L.EditToolbar.Delete.prototype.removeAllLayers = null;

            // Edit and delete toolbar until per-circle editing replaces it; the map toolbar draws.
            // setReadonly adds it once the parent allows changes
            drawControl = new L.Control.Draw({
                edit: { featureGroup: drawnItems },
                draw: false
            });

            // Event listeners for drawing actions
            map.on(L.Draw.Event.CREATED, onDrawCreated);
            map.on(L.Draw.Event.EDITED, onDrawEdited);
            map.on(L.Draw.Event.DELETED, onDrawDeleted);
            map.on('draw:drawstart', onDrawStart);
            map.on('draw:drawstop', onDrawStop);
            map.on('draw:editstart draw:deletestart', onEditStart);
            map.on('draw:editstop draw:deletestop', onEditStop);
            map.on('gm:drawradius', function(e) { setModeExtra('r = ' + formatDistance(e.radius)); });

            // Add legend control
            var legendControl = L.control({ position: 'bottomright' });
            legendControl.onAdd = function (map) {
                var div = L.DomUtil.create('div', 'legend-control');
                var content = `
                    <div class="legend-header">
                        <strong>Legend</strong>
                        <span class="toggle-legend" style="cursor:pointer;">▼</span>
                    </div>
                    <div class="legend-content">
                        <div class="legend-item">
                            <div class="legend-icon"><i class="fa fa-check-circle" style="color: green;"></i></div>
                            <span>Allowed Connection (within region)</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-icon"><i class="fa fa-exclamation-triangle" style="color: red;"></i></div>
                            <span>Blocked Connection (outside region)</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-icon"><i class="fa fa-user" style="color: blue;"></i></div>
                            <span>Whitelisted IP</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-circle" style="background-color: rgba(0, 128, 0, 0.6);"></div>
                            <span>Multiple Allowed Connections</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-circle" style="background-color: rgba(255, 0, 0, 0.6);"></div>
                            <span>Multiple Blocked Connections</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-circle" style="background-color: rgba(0, 0, 255, 0.6);"></div>
                            <span>Multiple Whitelisted IPs</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-circle" style="background-color: rgba(255, 165, 0, 0.6);"></div>
                            <span>Mixed Connection Types</span>
                        </div>
                    </div>
                `;
                div.innerHTML = content;

                // Add click handler for legend toggle
                setTimeout(() => {
                    var header = div.querySelector('.legend-header');
                    var content = div.querySelector('.legend-content');
                    var toggle = div.querySelector('.toggle-legend');
                    
                    header.addEventListener('click', function() {
                        if (content.style.display === 'none') {
                            content.style.display = 'block';
                            toggle.innerHTML = '▼';
                        } else {
                            content.style.display = 'none';
                            toggle.innerHTML = '▶';
                        }
                    });
                }, 0);

                return div;
            };
            legendControl.addTo(map);

            // Notify parent frame that the map is ready
            post('mapReady');
        }

        /**
         * Builds the region string of a circle as UCI stores it.
         * @param {Object} layer - The circle layer.
         * @returns {string} - circle:<lat>:<lon>:<radius in meters>
         */
        function regionString(layer) {
            var center = layer.getLatLng().wrap();
            return 'circle:' + center.lat.toFixed(8) + ':' + center.lng.toFixed(8) + ':' + Math.round(layer.getRadius());
        }

        /**
         * Moves a circle drawn or dragged past the antimeridian back into -180..180,
         * where its region string puts it on the next load.
         * @param {Object} layer - The circle layer.
         */
        function wrapCenter(layer) {
            var center = layer.getLatLng(), wrapped = center.wrap();
            if (wrapped.lng !== center.lng) layer.setLatLng(wrapped);
        }

        /**
         * Parses a region string.
         * @param {string} region - The region string from UCI.
         * @returns {Object|null} - { lat, lng, radius } or null if it is not a valid circle.
         */
        function parseRegion(region) {
            var p = String(region).split(':');
            if (p.length !== 4 || p[0] !== 'circle' || p.slice(1).some(function(x) { return !x.trim(); }))
                return null;
            var lat = Number(p[1]), lng = Number(p[2]), radius = Number(p[3]);
            if (!Number.isFinite(lat) || !Number.isFinite(lng) || !Number.isFinite(radius) ||
                Math.abs(lat) > 90 || Math.abs(lng) > 180 || radius <= 0)
                return null;
            return { lat: lat, lng: lng, radius: radius };
        }

        /**
         * Sets style and tooltip of a circle from its layer.gm state.
         * @param {Object} layer - The circle layer.
         */
        function applyLook(layer) {
            var gm = layer.gm, color = gm.color, tags = [];
            var label = document.createElement('span');

            // weight and opacity also reset what the draw handler's shapeOptions set
            if (gm.pending) {
                color = color || '#666666';
                layer.setStyle({ color: color, fillColor: color, weight: 3, opacity: 1, fillOpacity: 0.1, dashArray: '6 6' });
                label.textContent = gm.name ? gm.name + ' (new region)' : 'New circle';
            } else {
                // Disabled filters: dashed and faint
                layer.setStyle({
                    color: color,
                    fillColor: color,
                    weight: 3,
                    opacity: 1,
                    fillOpacity: gm.enabled ? 0.3 : 0.06,
                    dashArray: gm.enabled ? null : '4 8'
                });
                if (!gm.enabled) tags.push('disabled');
                if (gm.staged) tags.push('unsaved');
                label.textContent = (gm.name || gm.sid) + (tags.length ? ' (' + tags.join(', ') + ')' : '');
            }

            if (layer.getTooltip()) {
                layer.setTooltipContent(label);
            } else {
                layer.bindTooltip(label);
            }
        }

        /**
         * Adds a region of a filter to the map.
         * @param {Object} filter - { sid, name, color, enabled } from the parent.
         * @param {string} region - The region string from UCI.
         * @param {boolean} staged - The filter has staged changes.
         */
        function addRegion(filter, region, staged) {
            var c = parseRegion(region);
            if (!c) {
                post('regionInvalid', { sid: filter.sid, region: region });
                return;
            }

            var layer = L.circle([c.lat, c.lng], { radius: c.radius });
            layer.gm = {
                token: tokenPrefix + L.stamp(layer),
                sid: filter.sid,
                name: filter.name,
                color: filter.color,
                enabled: !!filter.enabled,
                region: region,
                stored: region,
                inflight: 0,
                staged: staged
            };
            circles[layer.gm.token] = layer;
            applyLook(layer);
            drawnItems.addLayer(layer);
        }

        /**
         * Replaces all regions with the filters the parent sent.
         * @param {Object} data - { filters: [{ sid, name, color, enabled, regions }], stagedSids }
         */
        function setFilters(data) {
            var staged = {};
            (data.stagedSids || []).forEach(function(sid) { staged[sid] = true; });

            drawnItems.clearLayers();
            circles = {};
            (data.filters || []).forEach(function(filter) {
                (filter.regions || []).forEach(function(region) {
                    addRegion(filter, region, !!staged[filter.sid]);
                });
            });

            // Start view: all regions, or the home view without any
            if (!viewFitted) {
                viewFitted = true;
                fitAll(true);
            }
        }

        /**
         * Updates the state of every circle of a filter.
         * @param {string} sid - The UCI section of the filter.
         * @param {Object} changes - Fields to merge into layer.gm.
         */
        function updateFilter(sid, changes) {
            Object.keys(circles).forEach(function(token) {
                var layer = circles[token];
                if (layer.gm.sid === sid) {
                    L.extend(layer.gm, changes);
                    applyLook(layer);
                }
            });
        }

        function forget(token) {
            var layer = circles[token];
            delete circles[token];
            if (layer && drawnItems.hasLayer(layer)) drawnItems.removeLayer(layer);
        }

        /**
         * A new circle stays pending until the parent answers with regionSaved,
         * regionDiscarded or regionRejected. It shows the color of the filter it was drawn for.
         * @param {Object} event - The draw event object.
         */
        function onDrawCreated(event) {
            var layer = event.layer, target = drawingFor || {};
            // A click without a drag gives a circle that UCI cannot store (radius 0 m)
            if (Math.round(layer.getRadius()) < 1) {
                showToast('Drag to draw a circle.');
                return;
            }
            wrapCenter(layer);
            layer.gm = {
                token: tokenPrefix + L.stamp(layer),
                sid: null,
                name: target.isNew ? '' : (target.name || ''),
                color: target.color,
                region: regionString(layer),
                pending: true
            };
            circles[layer.gm.token] = layer;
            applyLook(layer);
            drawnItems.addLayer(layer);
            // sid null: a new filter, the parent asks for its name
            post('regionDrawn', { token: layer.gm.token, region: layer.gm.region, sid: target.isNew ? null : (target.sid || null) });
        }

        /**
         * Reports a moved or resized circle with the string the parent knows it by.
         * Optimistic: a second edit before the answer names the new string.
         * @param {Object} layer - The circle layer.
         */
        function reportEdit(layer) {
            var gm = layer.gm, oldRegion = gm.region, region;
            wrapCenter(layer);
            region = regionString(layer);
            if (region === oldRegion) return;

            gm.region = region;
            gm.inflight++;
            post('regionEdited', { token: gm.token, sid: gm.sid, oldRegion: oldRegion, region: region });
        }

        /**
         * Reports a deleted circle. Leaflet.draw has already removed it from drawnItems;
         * circles keeps it so a rejected delete can put it back.
         * @param {Object} layer - The circle layer.
         */
        function reportDelete(layer) {
            var gm = layer.gm;
            gm.inflight++;
            post('regionDeleted', { token: gm.token, sid: gm.sid, oldRegion: gm.region });
        }

        // A pending circle belongs to the open filter dialog; regionSaved reports its changes
        function onDrawEdited(event) {
            event.layers.eachLayer(function(layer) {
                if (layer.gm && !layer.gm.pending) reportEdit(layer);
            });
        }

        function onDrawDeleted(event) {
            event.layers.eachLayer(function(layer) {
                if (layer.gm && !layer.gm.pending) reportDelete(layer);
            });
        }

        /**
         * Answers of the parent to regionDrawn, regionEdited and regionDeleted.
         * @param {string} type - The message type.
         * @param {Object} d - The message data, always with a token.
         */
        function onRegionAnswer(type, d) {
            var layer = circles[d.token], gm = layer && layer.gm, c;
            if (!gm) return;

            if (gm.pending) {
                if (type !== 'regionSaved') {
                    forget(d.token);
                } else {
                    L.extend(gm, { sid: d.sid, region: d.region, stored: d.region, inflight: 0, pending: false });
                    updateFilter(d.sid, { name: d.name, color: d.color, enabled: !!d.enabled, staged: true });
                    // Moved or deleted while the parent was staging it
                    if (drawnItems.hasLayer(layer)) {
                        reportEdit(layer);
                    } else {
                        reportDelete(layer);
                    }
                }
            } else {
                gm.inflight--;
                if (type === 'regionRemoved') {
                    forget(d.token);
                    updateFilter(gm.sid, { staged: true });
                } else if (type === 'regionSaved') {
                    gm.stored = d.region;
                    updateFilter(d.sid, { name: d.name, color: d.color, enabled: !!d.enabled, staged: true });
                } else if (!drawnItems.hasLayer(layer)) {
                    // regionRejected after a delete: back on the map
                    drawnItems.addLayer(layer);
                }

                // With every answer in, the circle shows what UCI holds
                if (!gm.inflight && circles[d.token] && gm.region !== gm.stored) {
                    gm.region = gm.stored;
                    c = parseRegion(gm.stored);
                    if (c) {
                        layer.setLatLng([c.lat, c.lng]);
                        layer.setRadius(c.radius);
                    }
                }
            }

            if (type === 'regionRejected' && d.reason) showToast(d.reason);
        }

        /*
         * Messages between view.js (parent) and this map, { type, data }, same origin only.
         * map -> parent:
         *   mapReady          -
         *   drawState         { drawing }                      a drawing started or ended
         *   regionDrawn       { token, region, sid }           sid null: for a new filter
         *   regionEdited      { token, sid, oldRegion, region }
         *   regionDeleted     { token, sid, oldRegion }
         *   regionInvalid     { sid, region }
         *   toastAction       { name, sid }                    button in a toast, e.g. enableFilter
         * parent -> map:
         *   setReadonly       { readonly }                     no drawing or editing tools when true
         *   setFilters        { filters: [{ sid, name, color, enabled, regions }], stagedSids }
         *   selectFilter      { sid, name, color, enabled, isNew } or null: what Draw circle draws for
         *   startDraw         like selectFilter, then draw     ("Draw circle" above the map)
         *   cancelDraw        -
         *   fitAll            -
         *   filterChanged     { sid, name, color, enabled }    e.g. after "Enable filter"
         *   regionSaved       { token, sid, name, color, enabled, region }
         *   regionRemoved, regionDiscarded { token }; regionRejected { token, reason }
         *   toast             { text, action: { label, name, sid } }
         *   updateConnections [connection]
         */
        window.addEventListener('message', function(event) {
            if (event.origin !== location.origin || event.source !== window.parent || !event.data) return;

            var type = event.data.type, data = event.data.data;
            if (type === 'setFilters') {
                setFilters(data || {});
            } else if (type === 'updateConnections') {
                updateConnections(data || []);
            } else if (type === 'setReadonly') {
                setReadonly(!data || data.readonly !== false);
            } else if (type === 'selectFilter') {
                selectFilter(data || null);
            } else if (type === 'startDraw') {
                startDraw(data || null);
            } else if (type === 'cancelDraw') {
                cancelDraw();
            } else if (type === 'fitAll') {
                fitAll(false);
            } else if (type === 'filterChanged' && data && data.sid) {
                updateFilter(data.sid, { name: data.name, color: data.color, enabled: !!data.enabled, staged: true });
            } else if (type === 'toast' && data && data.text) {
                var action = data.action;
                showToast(String(data.text), (action && action.name && action.label)
                    ? { label: String(action.label), name: String(action.name), sid: action.sid } : null);
            } else if (/^region(Saved|Removed|Discarded|Rejected)$/.test(type) && data) {
                onRegionAnswer(type, data);
            }
        }, false);

        // Initialize the map on page load
        initMap();
    </script>
</body>
</html>
