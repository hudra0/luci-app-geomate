<!DOCTYPE html>
<html>
<head>
    <title>Geomate Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Leaflet.markercluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <style>
        #map { height: 100vh; width: 100%; }
        .home-buttons-container {
            display: flex;
        }
        .home-button {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            text-decoration: none;
            text-align: center;
            line-height: 30px;
            background: white;
            width: 30px;
            height: 30px;
        }
        .set-home-button {
            border-top-left-radius: 4px;
            border-bottom-left-radius: 4px;
            border-right: 1px solid #ccc;
        }
        .go-home-button {
            border-top-right-radius: 4px;
            border-bottom-right-radius: 4px;
        }
        .home-button:hover {
            background: #f4f4f4;
        }
        .set-home-cursor,
        .set-home-cursor * {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 100 100"><text y=".9em" font-size="90">📍</text></svg>') 20 20, auto !important;
        }
        .custom-div-icon i {
            font-size: 20px;
        }

        /* Custom Cluster Icons */
        .marker-cluster {
            background-color: rgba(0, 0, 0, 0.3); /* Transparency */
            border-radius: 50%;
            color: white;
            display: flex; /* Flexbox for centering */
            align-items: center; /* Vertical centering */
            justify-content: center; /* Horizontal centering */
            font-weight: bold;
            font-size: 14px;
            line-height: 1;
            width: 40px; /* Width */
            height: 40px; /* Height */
        }
        .marker-cluster-allowed {
            background-color: rgba(0, 128, 0, 0.6); /* Green with higher transparency */
        }
        .marker-cluster-blocked {
            background-color: rgba(255, 0, 0, 0.6); /* Red with higher transparency */
        }
        .marker-cluster-mixed {
            background-color: rgba(255, 165, 0, 0.6); /* Orange with higher transparency */
        }
        .marker-cluster-allowed-ip {
            background-color: rgba(0, 0, 255, 0.6); /* Blue with higher transparency */
        }        

        /* Remove the icons within the clusters */
        .marker-cluster i {
            display: none;
        }

        /* Ensure that no additional margins or paddings are present */
        .marker-cluster div {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* Custom Legend Control */
        .legend-control {
            background: white;
            padding: 10px;
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
            max-width: 250px;
        }
        .legend-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .legend-content {
            font-size: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        .legend-icon {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .legend-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 8px;
        }

        /* Short messages from the parent, e.g. why a change was not staged */
        #gm-toast {
            display: none;
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            max-width: 80%;
            padding: 6px 12px;
            background: white;
            color: #333;
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
            font: 13px/1.4 sans-serif;
            pointer-events: none;   /* text only: clicks and drags reach the map and its controls */
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="gm-toast" role="status"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script>
        'use strict';

        var map, drawnItems;
        var allowedIPMarkers = {}; // New layer for Allowed IPs
        var homePosition = [51.505, -0.09];

        /*
         * Region identity lives in layer.gm, never in layer.options: Leaflet.draw saves and
         * restores layer.options around every edit session.
         * gm = { token, sid, name, color, enabled, region, stored, inflight, staged, pending }
         * stored is the string the parent last confirmed for UCI; region is the newest string the
         * map reported, which the next action names. The parent matches regions on the string
         * alone and answers the actions in the order they were sent; inflight counts the open ones.
         */
        var circles = {}; // token -> layer, kept until the parent has answered for it
        // Tokens differ between iframe loads, so a late answer never hits a circle of a new map
        var tokenPrefix = Math.random().toString(36).slice(2, 10) + '-';
        var toastTimer = null;

        // Define specialized icons for different marker types
        var blockedDivIcon = L.divIcon({
            html: '<i class="fa fa-exclamation-triangle" style="color: red;"></i>',
            iconSize: [25, 25],
            className: 'custom-div-icon'
        });

        var allowedConnectionIcon = L.divIcon({
            html: '<i class="fa fa-check-circle" style="color: green;"></i>',
            iconSize: [25, 25],
            className: 'custom-div-icon'
        });

        var allowedIPIcon = L.divIcon({
            html: '<i class="fa fa-user" style="color: blue;"></i>',
            iconSize: [25, 25],
            className: 'custom-div-icon'
        });

        var connectionMarkers = {};
        var activeConnectionIPs = {}; // Set of active connection IPs

        // Initialize MarkerCluster group with customized iconCreateFunction
        var markerClusters = L.markerClusterGroup({
            iconCreateFunction: function(cluster) {
                var markers = cluster.getAllChildMarkers();
                var allowed = 0;
                var blocked = 0;
                var allowedIPs = 0;

                markers.forEach(function(marker) {
                    if (marker.options.icon === allowedConnectionIcon) {
                        allowed += 1;
                    } else if (marker.options.icon === blockedDivIcon) {
                        blocked += 1;
                    } else if (marker.options.icon === allowedIPIcon) {
                        allowedIPs += 1;
                    }
                });

                var size = markers.length;
                var className = '';
                var html = '';

                if (allowed > 0 && blocked === 0 && allowedIPs === 0) {
                    className = 'marker-cluster marker-cluster-allowed';
                    html = size;
                } else if (blocked > 0 && allowed === 0 && allowedIPs === 0) {
                    className = 'marker-cluster marker-cluster-blocked';
                    html = size;
                } else if (allowedIPs > 0 && allowed === 0 && blocked === 0) {
                    className = 'marker-cluster marker-cluster-allowed-ip'; // Use the new class for Allowed IP Clusters
                    html = size;
                } else {
                    className = 'marker-cluster marker-cluster-mixed';
                    html = size;
                }

                return new L.DivIcon({
                    html: '<div>' + html + '</div>',
                    className: className,
                    iconSize: L.point(40, 40) // Adjusted size to 40x40
                });
            }
        });

        function post(type, data) {
            window.parent.postMessage({ type: type, data: data }, location.origin);
        }

        function showToast(text) {
            var el = document.getElementById('gm-toast');
            el.textContent = text;
            el.style.display = 'block';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function() { el.style.display = 'none'; }, 6000);
        }

        // Popup content as text nodes: filter names never run as markup
        function popupContent(lines) {
            var div = document.createElement('div');
            lines.forEach(function(line, i) {
                if (i) div.appendChild(document.createElement('br'));
                div.appendChild(document.createTextNode(line));
            });
            return div;
        }

        /**
         * Updates the map with the latest connection data.
         * @param {Array} connections - An array of connection objects.
         */
        function updateConnections(connections) {
            // Remove old connection markers from the cluster group
            markerClusters.clearLayers();
            connectionMarkers = {};
            activeConnectionIPs = {};

            connections.forEach(function(conn) {
                if (!conn || !conn.geo) {
                    return;
                }

                var geo = conn.geo;
                var ip = conn.dst;
                var allowed = conn.allowed;
                var filterName = conn.filter_name;
                var isAllowedIP = conn.is_allowed_ip;

                if (geo.lat && geo.lon && !Array.isArray(geo.lat) && !Array.isArray(geo.lon)) {
                    activeConnectionIPs[ip] = true;

                    var marker;
                    if (isAllowedIP) {
                        marker = L.marker([geo.lat, geo.lon], { icon: allowedIPIcon });
                        marker.bindPopup(popupContent(['Allowed IP: ' + ip, 'Filter: ' + filterName]));
                        allowedIPMarkers[ip] = marker;
                    } else if (allowed) {
                        marker = L.marker([geo.lat, geo.lon], { icon: allowedConnectionIcon });
                        marker.bindPopup(popupContent(['IP: ' + ip, 'Status: Allowed', 'Filter: ' + filterName]));
                    } else {
                        marker = L.marker([geo.lat, geo.lon], { icon: blockedDivIcon });
                        marker.bindPopup(popupContent(['IP: ' + ip, 'Status: Blocked', 'Filter: ' + filterName]));
                    }

                    markerClusters.addLayer(marker);
                    connectionMarkers[ip] = marker;
                }
            });
        }

        /**
         * Updates the UI with the list of allowed IPs.
         * @param {Array} allowedIPsData - An array of allowed IP objects.
         */
        function updateAllowedIPsUI(allowedIPsData) {
            // Remove old Allowed IP markers from the cluster group
            for (var ip in allowedIPMarkers) {
                markerClusters.removeLayer(allowedIPMarkers[ip]);
                delete allowedIPMarkers[ip];
            }

            // Add new Allowed IP markers only if the IP has an active connection
            allowedIPsData.forEach(function(entry) {
                var geo = entry.geo;
                var ip = entry.ip;
                var filter = entry.filter;

                if (geo && geo.lat && geo.lon && activeConnectionIPs[ip]) { // Add only for active connections
                    if (!allowedIPMarkers[ip]) { // Add only if not already present
                        var marker = L.marker([geo.lat, geo.lon], { icon: allowedIPIcon });
                        marker.bindPopup(popupContent(['Allowed IP: ' + ip, 'Filter: ' + filter]));
                        markerClusters.addLayer(marker);
                        allowedIPMarkers[ip] = marker;
                    }
                } else {
                    // If the IP is no longer active but still on the allowlist
                    if (allowedIPMarkers[ip]) {
                        markerClusters.removeLayer(allowedIPMarkers[ip]);
                        delete allowedIPMarkers[ip];
                    }
                }
            });
        }

        /**
         * Initializes the map and its components.
         */
        function initMap() {
            // Load the saved home position, if available
            var savedPosition = localStorage.getItem('homePosition');
            if (savedPosition) {
                homePosition = JSON.parse(savedPosition);
            }

            map = L.map('map', {
                center: homePosition,
                zoom: 4,
                minZoom: 2,
                maxBounds: [[-90, -180], [90, 180]],
                maxBoundsViscosity: 1.0
            });

            // Add OpenStreetMap tiles to the map
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                noWrap: true,
                bounds: [[-90, -180], [90, 180]]
            }).addTo(map);

            // Add the MarkerCluster group to the map
            map.addLayer(markerClusters);

            // Define custom control for Home Buttons
            L.Control.HomeButtons = L.Control.extend({
                onAdd: function(map) {
                    var container = L.DomUtil.create('div', 'leaflet-bar leaflet-control home-buttons-container');
                    
                    var setHomeButton = L.DomUtil.create('a', 'home-button set-home-button', container);
                    setHomeButton.innerHTML = '📍';
                    setHomeButton.href = '#';
                    setHomeButton.title = 'Set home position';

                    var goHomeButton = L.DomUtil.create('a', 'home-button go-home-button', container);
                    goHomeButton.innerHTML = '🏠';
                    goHomeButton.href = '#';
                    goHomeButton.title = 'Go to home position';
                    
                    L.DomEvent.disableClickPropagation(container);
                    
                    L.DomEvent.on(setHomeButton, 'click', function(e) {
                        L.DomEvent.stop(e);
                        setHomeButton.style.backgroundColor = '#ffff00';
                        map.getContainer().classList.add('set-home-cursor');
                        map.once('click', onMapClick);
                    });
                    
                    L.DomEvent.on(goHomeButton, 'click', function(e) {
                        L.DomEvent.stop(e);
                        if (homePosition) {
                            map.setView(homePosition, 4);
                        }
                    });
                    
                    return container;
                }
            });
            
            // Add Home Buttons control to the map
            new L.Control.HomeButtons({ position: 'topleft' }).addTo(map);

            drawnItems = new L.FeatureGroup();
            map.addLayer(drawnItems);

            // No "Clear All" in the delete toolbar: it removed every circle of every filter at once
            L.EditToolbar.Delete.prototype.removeAllLayers = null;

            // Initialize drawing controls
            var drawControl = new L.Control.Draw({
                edit: { featureGroup: drawnItems },
                draw: {
                    polygon: false,
                    polyline: false,
                    rectangle: false,
                    circle: true,
                    marker: false,
                    circlemarker: false
                }
            });
            map.addControl(drawControl);

            // Event listeners for drawing actions
            map.on(L.Draw.Event.CREATED, onDrawCreated);
            map.on(L.Draw.Event.EDITED, onDrawEdited);
            map.on(L.Draw.Event.DELETED, onDrawDeleted);

            // Add legend control
            var legendControl = L.control({ position: 'bottomright' });
            legendControl.onAdd = function (map) {
                var div = L.DomUtil.create('div', 'legend-control');
                var content = `
                    <div class="legend-header">
                        <strong>Legend</strong>
                        <span class="toggle-legend" style="cursor:pointer;">▼</span>
                    </div>
                    <div class="legend-content">
                        <div class="legend-item">
                            <div class="legend-icon"><i class="fa fa-check-circle" style="color: green;"></i></div>
                            <span>Allowed Connection (within region)</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-icon"><i class="fa fa-exclamation-triangle" style="color: red;"></i></div>
                            <span>Blocked Connection (outside region)</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-icon"><i class="fa fa-user" style="color: blue;"></i></div>
                            <span>Whitelisted IP</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-circle" style="background-color: rgba(0, 128, 0, 0.6);"></div>
                            <span>Multiple Allowed Connections</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-circle" style="background-color: rgba(255, 0, 0, 0.6);"></div>
                            <span>Multiple Blocked Connections</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-circle" style="background-color: rgba(0, 0, 255, 0.6);"></div>
                            <span>Multiple Whitelisted IPs</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-circle" style="background-color: rgba(255, 165, 0, 0.6);"></div>
                            <span>Mixed Connection Types</span>
                        </div>
                    </div>
                `;
                div.innerHTML = content;

                // Add click handler for legend toggle
                setTimeout(() => {
                    var header = div.querySelector('.legend-header');
                    var content = div.querySelector('.legend-content');
                    var toggle = div.querySelector('.toggle-legend');
                    
                    header.addEventListener('click', function() {
                        if (content.style.display === 'none') {
                            content.style.display = 'block';
                            toggle.innerHTML = '▼';
                        } else {
                            content.style.display = 'none';
                            toggle.innerHTML = '▶';
                        }
                    });
                }, 0);

                return div;
            };
            legendControl.addTo(map);

            // Notify parent frame that the map is ready
            post('mapReady');
            
            if (homePosition) {
                map.setView(homePosition, 4);
            }
        }

        /**
         * Handles the map click event when setting a new home position.
         * @param {Object} e - The event object containing latlng.
         */
        function onMapClick(e) {
            homePosition = [e.latlng.lat, e.latlng.lng];
            localStorage.setItem('homePosition', JSON.stringify(homePosition));
            map.setView(homePosition, 4);
            document.querySelector('.set-home-button').style.backgroundColor = '';
            map.getContainer().classList.remove('set-home-cursor');
        }

        /**
         * Builds the region string of a circle as UCI stores it.
         * @param {Object} layer - The circle layer.
         * @returns {string} - circle:<lat>:<lon>:<radius in meters>
         */
        function regionString(layer) {
            var center = layer.getLatLng().wrap();
            return 'circle:' + center.lat.toFixed(8) + ':' + center.lng.toFixed(8) + ':' + Math.round(layer.getRadius());
        }

        /**
         * Moves a circle drawn or dragged past the antimeridian back into -180..180,
         * where its region string puts it on the next load.
         * @param {Object} layer - The circle layer.
         */
        function wrapCenter(layer) {
            var center = layer.getLatLng(), wrapped = center.wrap();
            if (wrapped.lng !== center.lng) layer.setLatLng(wrapped);
        }

        /**
         * Parses a region string.
         * @param {string} region - The region string from UCI.
         * @returns {Object|null} - { lat, lng, radius } or null if it is not a valid circle.
         */
        function parseRegion(region) {
            var p = String(region).split(':');
            if (p.length !== 4 || p[0] !== 'circle' || p.slice(1).some(function(x) { return !x.trim(); }))
                return null;
            var lat = Number(p[1]), lng = Number(p[2]), radius = Number(p[3]);
            if (!Number.isFinite(lat) || !Number.isFinite(lng) || !Number.isFinite(radius) ||
                Math.abs(lat) > 90 || Math.abs(lng) > 180 || radius <= 0)
                return null;
            return { lat: lat, lng: lng, radius: radius };
        }

        /**
         * Sets style and tooltip of a circle from its layer.gm state.
         * @param {Object} layer - The circle layer.
         */
        function applyLook(layer) {
            var gm = layer.gm, color = gm.color, tags = [];
            var label = document.createElement('span');

            if (gm.pending) {
                layer.setStyle({ color: '#666666', fillColor: '#666666', fillOpacity: 0.1, dashArray: '6 6' });
                label.textContent = 'New circle';
            } else {
                // Disabled filters: dashed and faint
                layer.setStyle({
                    color: color,
                    fillColor: color,
                    fillOpacity: gm.enabled ? 0.3 : 0.06,
                    dashArray: gm.enabled ? null : '4 8'
                });
                if (!gm.enabled) tags.push('disabled');
                if (gm.staged) tags.push('unsaved');
                label.textContent = (gm.name || gm.sid) + (tags.length ? ' (' + tags.join(', ') + ')' : '');
            }

            if (layer.getTooltip()) {
                layer.setTooltipContent(label);
            } else {
                layer.bindTooltip(label);
            }
        }

        /**
         * Adds a region of a filter to the map.
         * @param {Object} filter - { sid, name, color, enabled } from the parent.
         * @param {string} region - The region string from UCI.
         * @param {boolean} staged - The filter has staged changes.
         */
        function addRegion(filter, region, staged) {
            var c = parseRegion(region);
            if (!c) {
                post('regionInvalid', { sid: filter.sid, region: region });
                return;
            }

            var layer = L.circle([c.lat, c.lng], { radius: c.radius });
            layer.gm = {
                token: tokenPrefix + L.stamp(layer),
                sid: filter.sid,
                name: filter.name,
                color: filter.color,
                enabled: !!filter.enabled,
                region: region,
                stored: region,
                inflight: 0,
                staged: staged
            };
            circles[layer.gm.token] = layer;
            applyLook(layer);
            drawnItems.addLayer(layer);
        }

        /**
         * Replaces all regions with the filters the parent sent.
         * @param {Object} data - { filters: [{ sid, name, color, enabled, regions }], stagedSids }
         */
        function setFilters(data) {
            var staged = {};
            (data.stagedSids || []).forEach(function(sid) { staged[sid] = true; });

            drawnItems.clearLayers();
            circles = {};
            (data.filters || []).forEach(function(filter) {
                (filter.regions || []).forEach(function(region) {
                    addRegion(filter, region, !!staged[filter.sid]);
                });
            });
        }

        /**
         * Updates the state of every circle of a filter.
         * @param {string} sid - The UCI section of the filter.
         * @param {Object} changes - Fields to merge into layer.gm.
         */
        function updateFilter(sid, changes) {
            Object.keys(circles).forEach(function(token) {
                var layer = circles[token];
                if (layer.gm.sid === sid) {
                    L.extend(layer.gm, changes);
                    applyLook(layer);
                }
            });
        }

        function forget(token) {
            var layer = circles[token];
            delete circles[token];
            if (layer && drawnItems.hasLayer(layer)) drawnItems.removeLayer(layer);
        }

        /**
         * A new circle stays pending until the parent answers with regionSaved,
         * regionDiscarded or regionRejected.
         * @param {Object} event - The draw event object.
         */
        function onDrawCreated(event) {
            var layer = event.layer;
            // A click without a drag gives a circle that UCI cannot store (radius 0 m)
            if (Math.round(layer.getRadius()) < 1) {
                showToast('Drag to draw a circle.');
                return;
            }
            wrapCenter(layer);
            layer.gm = { token: tokenPrefix + L.stamp(layer), sid: null, name: '', region: regionString(layer), pending: true };
            circles[layer.gm.token] = layer;
            applyLook(layer);
            drawnItems.addLayer(layer);
            post('regionDrawn', { token: layer.gm.token, region: layer.gm.region });
        }

        /**
         * Reports a moved or resized circle with the string the parent knows it by.
         * Optimistic: a second edit before the answer names the new string.
         * @param {Object} layer - The circle layer.
         */
        function reportEdit(layer) {
            var gm = layer.gm, oldRegion = gm.region, region;
            wrapCenter(layer);
            region = regionString(layer);
            if (region === oldRegion) return;

            gm.region = region;
            gm.inflight++;
            post('regionEdited', { token: gm.token, sid: gm.sid, oldRegion: oldRegion, region: region });
        }

        /**
         * Reports a deleted circle. Leaflet.draw has already removed it from drawnItems;
         * circles keeps it so a rejected delete can put it back.
         * @param {Object} layer - The circle layer.
         */
        function reportDelete(layer) {
            var gm = layer.gm;
            gm.inflight++;
            post('regionDeleted', { token: gm.token, sid: gm.sid, oldRegion: gm.region });
        }

        // A pending circle belongs to the open filter dialog; regionSaved reports its changes
        function onDrawEdited(event) {
            event.layers.eachLayer(function(layer) {
                if (layer.gm && !layer.gm.pending) reportEdit(layer);
            });
        }

        function onDrawDeleted(event) {
            event.layers.eachLayer(function(layer) {
                if (layer.gm && !layer.gm.pending) reportDelete(layer);
            });
        }

        /**
         * Answers of the parent to regionDrawn, regionEdited and regionDeleted.
         * @param {string} type - The message type.
         * @param {Object} d - The message data, always with a token.
         */
        function onRegionAnswer(type, d) {
            var layer = circles[d.token], gm = layer && layer.gm, c;
            if (!gm) return;

            if (gm.pending) {
                if (type !== 'regionSaved') {
                    forget(d.token);
                } else {
                    L.extend(gm, { sid: d.sid, region: d.region, stored: d.region, inflight: 0, pending: false });
                    updateFilter(d.sid, { name: d.name, color: d.color, enabled: !!d.enabled, staged: true });
                    // Moved or deleted while the parent was staging it
                    if (drawnItems.hasLayer(layer)) {
                        reportEdit(layer);
                    } else {
                        reportDelete(layer);
                    }
                }
            } else {
                gm.inflight--;
                if (type === 'regionRemoved') {
                    forget(d.token);
                    updateFilter(gm.sid, { staged: true });
                } else if (type === 'regionSaved') {
                    gm.stored = d.region;
                    updateFilter(d.sid, { name: d.name, color: d.color, enabled: !!d.enabled, staged: true });
                } else if (!drawnItems.hasLayer(layer)) {
                    // regionRejected after a delete: back on the map
                    drawnItems.addLayer(layer);
                }

                // With every answer in, the circle shows what UCI holds
                if (!gm.inflight && circles[d.token] && gm.region !== gm.stored) {
                    gm.region = gm.stored;
                    c = parseRegion(gm.stored);
                    if (c) {
                        layer.setLatLng([c.lat, c.lng]);
                        layer.setRadius(c.radius);
                    }
                }
            }

            if (type === 'regionRejected' && d.reason) showToast(d.reason);
        }

        // Listener for messages from the parent frame; nobody else may talk to the map
        window.addEventListener('message', function(event) {
            if (event.origin !== location.origin || event.source !== window.parent || !event.data) return;

            var type = event.data.type, data = event.data.data;
            if (type === 'setFilters') {
                setFilters(data || {});
            } else if (type === 'updateConnections') {
                updateConnections(data || []);
            } else if (type === 'updateAllowedIPs') {
                updateAllowedIPsUI(data || []);
            } else if (type === 'toast' && data && data.text) {
                showToast(String(data.text));
            } else if (/^region(Saved|Removed|Discarded|Rejected)$/.test(type) && data) {
                onRegionAnswer(type, data);
            }
        }, false);

        // Initialize the map on page load
        initMap();
    </script>
</body>
</html>
