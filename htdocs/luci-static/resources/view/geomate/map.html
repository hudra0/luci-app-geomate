    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #101820; }
        /* Fill the frame exactly. 100vh can be a fraction of a pixel off at non-100% browser zoom, which left a dark strip. */
        #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #101820; }
        /* Leaflet 1.9 blends map tiles additively ("plus-lighter"). Where neighbouring tiles overlap by a pixel (see the
           seam fix in the script), that adds them together and draws a bright line, so use normal blending instead. */
        .leaflet-container img.leaflet-tile { mix-blend-mode: normal !important; }
        .leaflet-control-zoom a, .leaflet-bar a { background-color:#17232d!important;color:#eaf1f5!important;border-color:#30414d!important; }
        .leaflet-bar a:hover { background-color:#263944!important;color:#7db3ff!important; }
        .leaflet-popup-content-wrapper,.leaflet-popup-tip { background:#17232d;color:#eaf1f5; }
        .leaflet-popup-content { color:#eaf1f5; }
        .leaflet-draw-toolbar a,.leaflet-draw-actions a { background-color:#17232d!important;color:#eaf1f5!important;border-color:#30414d!important; }
        .leaflet-tooltip { background:#17232d;color:#eaf1f5;border:1px solid #30414d; }
        .leaflet-tooltip:before { border-top-color:#30414d; }
        /* Our map credits (Leaflet + the map source), bottom right, always shown in full (wraps instead of being cut off) */
        .leaflet-control-attribution.geomate-credit { background:rgba(16,24,32,.78)!important; color:#9eafb9!important; font:10px/1.4 sans-serif!important;
            padding:2px 6px!important; margin:0 !important; border-radius:4px 0 0 0; width:max-content; max-width:min(760px, calc(100vw - 20px)) !important;
            white-space:normal!important; overflow:visible!important; text-overflow:clip!important; text-align:right; box-sizing:border-box; }
        .leaflet-control-attribution.geomate-credit a { color:#7db3ff!important; text-decoration:none; }
        .leaflet-control-attribution.geomate-credit .gl-google { font-weight:700; color:#eaf1f5; letter-spacing:.02em; }
        /* With a key that uses the Maps JavaScript API, Google puts its own credit line ("Map data ©2026 Google · Terms") in the
           bottom-right corner: ours sits directly above it, so both are fully visible and neither covers the other */
        .gm-js .leaflet-bottom.leaflet-right .leaflet-control-attribution.geomate-credit { position:absolute !important; right:0 !important;
            bottom:16px !important; border-radius:4px 0 0 0; z-index:1001; }
        @media (max-width: 640px) {

        .custom-div-icon i {
            font-size: 20px;
        }

        /* Custom Cluster Icons */
        .marker-cluster {
            background-color: rgba(0, 0, 0, 0.3); /* Transparency */
            border-radius: 50%;
            color: white;
            display: flex; /* Flexbox for centering */
            align-items: center; /* Vertical centering */
            justify-content: center; /* Horizontal centering */
            font-weight: bold;
            font-size: 14px;
            line-height: 1;
            width: 40px; /* Width */
            height: 40px; /* Height */
        }
        .marker-cluster-allowed {
            background-color: rgba(0, 128, 0, 0.6); /* Green with higher transparency */
        }
        .marker-cluster-blocked {
            background-color: rgba(255, 0, 0, 0.6); /* Red with higher transparency */
        }
        .marker-cluster-mixed {
            background-color: rgba(255, 165, 0, 0.6); /* Orange with higher transparency */
        }
        .marker-cluster-allowed-ip {
            background-color: rgba(0, 0, 255, 0.6); /* Blue with higher transparency */
        }        

        /* Remove the icons within the clusters */
        .marker-cluster i {
            display: none;
        }

        /* Ensure that no additional margins or paddings are present */
        .marker-cluster div {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* Custom Legend Control */
        .legend-control {
            background: rgba(23,35,45,.96); color:#eaf1f5; padding:12px;
            border:1px solid #30414d; border-radius:8px;
            box-shadow:0 8px 24px rgba(0,0,0,.35); max-width:250px;
        }
        .legend-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .legend-content {
            font-size: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        .legend-icon {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .legend-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 8px;
        }

        /* Place names can be switched off by zoom level (see updateLabelVisibility) */
        .labels-off .geomate-labels { display:none !important; }
        /* Google map pieces (Maps JavaScript API mode): drawn 1px larger so neighbours overlap, which hides the hairline
           square outlines between them at in-between zoom levels (same fix as the Esri tiles get) */
        .geomate-gm .leaflet-tile { overflow:visible !important; }
        .geomate-gm .leaflet-tile img { width:257px !important; height:257px !important; max-width:none !important; }
        /* Colour variants (dark grey, light grey, futuristic) are tinted in JavaScript, see TINTS */
        /* Futuristic: HUD grid, scan lines, vignette and a slow scanning band over the map (never blocks the mouse) */
        .leaflet-container.fx-futuristic::after {
            content: ''; position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 450; pointer-events: none;
            background:
                radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,10,24,.6) 100%),
                repeating-linear-gradient(0deg, rgba(90,225,255,.035) 0, rgba(90,225,255,.035) 1px, transparent 1px, transparent 3px),
                linear-gradient(rgba(60,200,255,.08) 1px, transparent 1px) 0 0 / 64px 64px,
                linear-gradient(90deg, rgba(60,200,255,.08) 1px, transparent 1px) 0 0 / 64px 64px;
        }
        .leaflet-container.fx-futuristic::before, .leaflet-container.fx-tactical::before {
            content: ''; position: absolute; left: 0; right: 0; top: -140px; height: 140px; z-index: 451; pointer-events: none;
            background: linear-gradient(to bottom, rgba(63,224,255,0), rgba(63,224,255,.09), rgba(63,224,255,0));

<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <!-- Optional: OverlappingMarkerSpiderfier -->
    <!-- <script src="https://unpkg.com/overlapping-marker-spiderfier-leaflet@1.0.3/oms.min.js"></script> -->
    <script>
        'use strict';

        var map, drawnItems;
        var regions = {};
        var allowedIPMarkers = {}; // New layer for Allowed IPs
        var allowedIPs = []; // New list to track allowed IPs
        var homePosition = [51.505, -0.09];
        var isSettingHome = false;
        var homeZipPanel = null;
        var legendControl = null;
        var homeSearchMode = 'zip';
        var pendingHome = null;     // location found by a search, not yet applied as home
        var pendingMarker = null;
        var pendingLabel = '';
        var homeMarker = null;
        var suggestTimer = null;
        var suggestToken = 0;

        // Define specialized icons for different marker types
        var blockedDivIcon = L.divIcon({
            html: '<i class="fa fa-exclamation-triangle" style="color: red;"></i>',
            iconSize: [25, 25],
            className: 'custom-div-icon'
        });

        var allowedConnectionIcon = L.divIcon({
            html: '<i class="fa fa-check-circle" style="color: green;"></i>',
            iconSize: [25, 25],
            className: 'custom-div-icon'
        });

        var allowedIPIcon = L.divIcon({
            html: '<i class="fa fa-user" style="color: blue;"></i>',
            iconSize: [25, 25],
            className: 'custom-div-icon'
        });

        /**
         * Generates a color based on the provided name.
         * @param {string} name - The name to generate a color for.
         * @returns {string} - A hex color code.
         */
        var REGION_BLUE = '#3b82f6';
        var REGION_FILL = 0.1;
        function getColorForName(name) {
            var colors = ['#FF5733', '#33FF57', '#3357FF', '#FF33F1', '#33FFF1', '#F1FF33', '#FF8C33', '#8C33FF', '#33FFAF', '#FF3367'];
            var hash = 0;
            for (var i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        var connectionMarkers = {};
        var activeConnectionIPs = {}; // Set of active connection IPs

        // Initialize MarkerCluster group with customized iconCreateFunction
        var markerClusters = L.markerClusterGroup({
            iconCreateFunction: function(cluster) {
                var markers = cluster.getAllChildMarkers();
                var allowed = 0;
                var blocked = 0;
                var allowedIPs = 0;

                markers.forEach(function(marker) {
                    if (marker.options.icon === allowedConnectionIcon) {
                        allowed += 1;
                    } else if (marker.options.icon === blockedDivIcon) {
                        blocked += 1;
                    } else if (marker.options.icon === allowedIPIcon) {
                        allowedIPs += 1;
                    }
                });

                var size = markers.length;
                var className = '';
                var html = '';

                if (allowed > 0 && blocked === 0 && allowedIPs === 0) {
                    className = 'marker-cluster marker-cluster-allowed';
                    html = size;
                } else if (blocked > 0 && allowed === 0 && allowedIPs === 0) {
                    className = 'marker-cluster marker-cluster-blocked';
                    html = size;
                } else if (allowedIPs > 0 && allowed === 0 && blocked === 0) {
                    className = 'marker-cluster marker-cluster-allowed-ip'; // Use the new class for Allowed IP Clusters
                    html = size;
                } else {
                    className = 'marker-cluster marker-cluster-mixed';
                    html = size;
                }

                return new L.DivIcon({
                    html: '<div>' + html + '</div>',
                    className: className,
                    iconSize: L.point(40, 40) // Adjusted size to 40x40
                });
            }
        });

        // Optional: Initialize OverlappingMarkerSpiderfier
        // var oms = new OverlappingMarkerSpiderfier(map, { keepSpiderfied: true });

        /**
         * Updates the map with the latest connection data.
         * @param {Array} connections - An array of connection objects.
         */
        var lastConnSig = null, lastAllowedSig = null;   // what the markers on the map were last built from
        var lastConnections = null;
        function updateConnections(connections) {
            lastConnections = connections;
            recordIpHistory(connections);
            // A server the router has not located yet is shown where the page's own lookup puts it, until the router knows
            connections = (connections || []).map(function(c) {
                if (!c || (c.geo && typeof c.geo.lat === 'number')) return c;
                var g = geoChecks[c.dst];
                if (!g || g.fail || typeof g.lat !== 'number') return c;
                var copy = Object.assign({}, c);
                copy.geo = { lat: g.lat, lon: g.lon };
                copy.provisional = g.src || 'a second lookup';
                return copy;
            });

            // The router sends the full list every couple of seconds. Only rebuild the markers when something in it changed
            // (rebuilding re-clusters everything and closes any open popup).
            var sig = (connections || []).map(function(c) {
                return (c && c.geo) ? [c.dst, c.allowed ? 1 : 0, c.is_allowed_ip ? 1 : 0, c.filter_name || '', c.geo.lat, c.geo.lon, c.pending ? 1 : 0, c.denied ? 1 : 0].join('|') : 'x';
            }).join(';');
            if (sig === lastConnSig) return;
            lastConnSig = sig;
            lastAllowedSig = null;   // the allowed-IP markers share the cluster group, so they are drawn again too

            // Remove old connection markers from the cluster group
            markerClusters.clearLayers();
            connectionMarkers = {};
            activeConnectionIPs = {};

            connections.forEach(function(conn) {
                if (!conn || !conn.geo) {
                    console.warn('Connection is null or geo is missing:', conn);
                    return;
                }

                var geo = conn.geo;
                var ip = conn.dst;
                var allowed = conn.allowed;
                var filterName = conn.filter_name;
                var isAllowedIP = conn.is_allowed_ip;

                if (geo.lat && geo.lon && !Array.isArray(geo.lat) && !Array.isArray(geo.lon)) {
                    activeConnectionIPs[ip] = true;

                    var marker;
                    if (isAllowedIP) {
                        marker = L.marker([geo.lat, geo.lon], { icon: allowedIPIcon });
                        var popupContent = 'Allowed IP: ' + ip + '<br>' +
                                        'Filter: ' + filterName;
                        marker._geomatePopupBase = popupContent; marker._geomateConn = conn;
                        marker.bindPopup(popupContent + markerActions(conn));
                        allowedIPMarkers[ip] = marker;
                    } else if (allowed) {
                        marker = L.marker([geo.lat, geo.lon], { icon: allowedConnectionIcon, opacity: conn.pending ? 0.6 : 1 });
                        var popupContent = 'IP: ' + ip + '<br>' +
                                        'Status: Allowed' + (conn.pending ? ' (not sorted by the router yet)' : '') + '<br>' +
                                        'Filter: ' + filterName + pendingNote(conn);
                        marker._geomatePopupBase = popupContent; marker._geomateConn = conn;
                        marker.bindPopup(popupContent + markerActions(conn));
                    } else {
                        marker = L.marker([geo.lat, geo.lon], { icon: blockedDivIcon, opacity: conn.pending ? 0.6 : 1 });
                        var popupContent = 'IP: ' + ip + '<br>' +
                                        'Status: ' + (conn.denied ? 'Blocked by you' : conn.pending ? 'Blocked by Strict Mode (not located by the router yet)' : 'Blocked') + '<br>' +
                                        'Filter: ' + filterName + pendingNote(conn);
                        marker._geomatePopupBase = popupContent; marker._geomateConn = conn;
                        marker.bindPopup(popupContent + markerActions(conn));
                    }

                    markerClusters.addLayer(marker);
                    connectionMarkers[ip] = marker;
                }
            });

        }

        // Buttons in a server's popup on the map: allow / block / remove / unblock it right there
        function markerActions(conn) {
            var ip = String(conn.dst || ''), q = escHtml(ip);
            var h = ipHistory[ip] || {};
            var st = h.status || (conn.denied ? 'denied' : conn.is_allowed_ip ? 'whitelist' : conn.allowed ? 'allowed' : 'blocked');
            var busy = ipPending[ip] ? ' disabled' : '';

            function run() {
                var key = input.value.trim();
                if (!key) { refreshGoogleKeyUI('Paste a key first.', 'bad'); input.focus(); return; }
                check.disabled = true;
                refreshGoogleKeyUI('Checking the key with Google\u2026', '');
                validateGoogleKeyAny(key).then(function(mode) {
                    try { localStorage.setItem(GOOGLE_KEY_STORE, key); localStorage.setItem(GOOGLE_MODE_STORE, mode); } catch (e) {}
                    input.value = '';
                    if (mode === 'js') {
                        // Google's JavaScript map can only be started once per page, with one key: reload the map to start it
                        refreshGoogleKeyUI('\u2714 Key works (Maps JavaScript API). Reloading the map\u2026', 'good');
                        setTimeout(function() { location.reload(); }, 700);
                        return;
                    }
                    GOOGLE_MAPS_KEY = key;
                    GOOGLE_MODE = mode;
                    googleFailed = false; googleError = ''; googleSessions = {};
                    googleKeyUI.manual = false;
                    addBaseLayer(currentTheme);
                    refreshGoogleKeyUI('\u2714 Key works. The map now uses Google tiles (saved in this browser).', 'good');
                }).catch(function(err) {
                    refreshGoogleKeyUI('\u2716 ' + ((err && err.message) || String(err)), 'bad');
                }).then(function() { check.disabled = false; });
            }
            L.DomEvent.on(check, 'click', function(ev) { L.DomEvent.stop(ev); run(); });
            L.DomEvent.on(remove, 'click', function(ev) {
                L.DomEvent.stop(ev);
                try { localStorage.removeItem(GOOGLE_KEY_STORE); localStorage.removeItem(GOOGLE_MODE_STORE); } catch (e) {}
                if (googleJsPromise) { refreshGoogleKeyUI('Key removed. Reloading the map\u2026', ''); setTimeout(function() { location.reload(); }, 500); return; }
                GOOGLE_MAPS_KEY = '';
                googleFailed = false; googleError = ''; googleSessions = {};
                googleKeyUI.manual = false;
                addBaseLayer(currentTheme);
                refreshGoogleKeyUI('Key removed. Using Esri map tiles.', '');
            });
            L.DomEvent.on(input, 'keydown', function(ev) {
                L.DomEvent.stopPropagation(ev);              // typing here must not move the map or delete a region
                if (ev.key === 'Enter') { ev.preventDefault(); run(); }
            });
            L.DomEvent.on(input, 'input', function() { if (googleKeyUI.manual) { googleKeyUI.manual = false; refreshGoogleKeyUI(); } });
            refreshGoogleKeyUI();
        }

        /**
         * Switches colour theme and remembers the choice.
         */
        function setMapTheme(key) {
            if (!MAP_THEMES[key]) key = 'dark';
            currentTheme = key;
            try { localStorage.setItem('mapTheme', key); } catch (e) {}
            addBaseLayer(key);
            if (themePanel) {
                themePanel.getContainer().querySelectorAll('.hz-result[data-theme]').forEach(function(b) {
                    b.classList.toggle('active', b.getAttribute('data-theme') === key);
                });
            }
        }

        /**
         * Initializes the map and its components.
         */
        function initMap() {
            // Load the saved home position, if available
            var savedPosition = localStorage.getItem('homePosition');
            if (savedPosition) {
                homePosition = JSON.parse(savedPosition);
            }

            map = L.map('map', {
                center: homePosition,
                zoom: 4,
                minZoom: 2,
                maxZoom: 20,
                maxBounds: [[-90, -180], [90, 180]],
                maxBoundsViscosity: 1.0,
                attributionControl: false   // added below with our own wording (map credits)
            });
            // Map credits in the bottom-right corner: the map source in use (Esri or Google) plus Leaflet
            var creditControl = L.control.attribution({ position: 'bottomright',
                prefix: '<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>' }).addTo(map);
            creditControl.getContainer().classList.add('geomate-credit');

            // Keep the world filling the whole view: no empty bands at the sides when zoomed out
            map.on('resize', updateMinZoom);
            updateMinZoom();
            if (window.ResizeObserver) {
                new ResizeObserver(function() {
                    map.invalidateSize();
                    updateMinZoom();
                }).observe(document.getElementById('map'));
            }
            window.addEventListener('load', function() { map.invalidateSize(); updateMinZoom(); });
            setTimeout(function() { map.invalidateSize(); updateMinZoom(); }, 500);

            map.on('zoom zoomend zoomlevelschange resize moveend', updateLabelVisibility);
            window.addEventListener('resize', updateLabelVisibility);
            if (window.ResizeObserver) { try { new ResizeObserver(function() { updateLabelVisibility(); }).observe(map.getContainer()); } catch (e) {} }

            // Basemap: Google Map Tiles API (English labels, dark style); falls back to Esri if unavailable
            try { currentTheme = localStorage.getItem('mapTheme') || 'dark'; } catch (e) {}
            if (!MAP_THEMES[currentTheme]) currentTheme = 'dark';
            addBaseLayer(currentTheme);

            // Add the MarkerCluster group to the map
            map.addLayer(markerClusters);

            // "Antarctica" text label, shown at the same zoom levels as the other place labels
            antarcticaLabel = L.marker([-79, 15], {
                icon: L.divIcon({ className: 'continent-label', html: 'ANTARCTICA', iconSize: [0, 0] }),
                interactive: false,
                keyboard: false,
                zIndexOffset: -1000
            }).addTo(map);
            function updateAntarcticaLabel() {
                updateLabelVisibility();
            }
            map.on('zoomend', updateAntarcticaLabel);
            updateAntarcticaLabel();

            homeZipPanel = new L.Control.HomeZip({ position: 'topleft' }).addTo(map);

            // Map colour theme panel (opened with the 🎨 button)
            L.Control.MapTheme = L.Control.extend({

            themePanel = new L.Control.MapTheme({ position: 'topleft' }).addTo(map);

            drawnItems = new L.FeatureGroup();
            map.addLayer(drawnItems);

            // Initialize drawing controls
            var drawControl = new L.Control.Draw({
                edit: { featureGroup: drawnItems },
                draw: {
                    polygon: {
                        allowIntersection: false,
                        showArea: false,
                        drawError: { color: '#ff5d5d', message: 'Polygon edges cannot cross' },
                        shapeOptions: { color: REGION_BLUE, weight: 3, fillOpacity: 0.12 }
                    },
                    polyline: false,
                    rectangle: false,
                    circle: { shapeOptions: { color: REGION_BLUE, weight: 3, fillOpacity: 0.12 } },
                    marker: false,
                    circlemarker: false
                }
            });
            map.addControl(drawControl);

            // Event listeners for drawing actions
            // While placing polygon points, hide the white vertex squares. A blue dot marks the point you just placed,
            // and a blue ring marks the first point (click it to close the shape).
            map.on('draw:drawstart', function(e) {
                if (e.layerType === 'polygon') map.getContainer().classList.add('drawing-shape');
            });
            map.on('draw:drawstop', function() {
                map.getContainer().classList.remove('drawing-shape');

            map.on('draw:drawvertex', function(e) {
                var markers = e.layers && e.layers.getLayers ? e.layers.getLayers() : [];
                markers.forEach(function(m, i) {
                    if (!m._icon) return;
                    m._icon.classList.toggle('draw-first-dot', i === 0);                 // ring: click it to close the shape
                    m._icon.classList.toggle('draw-last-dot', i === markers.length - 1); // dot: the point you just placed

            // Double-click a saved region to edit it right away (no need for the toolbar's Edit button)
            drawnItems.on('dblclick', function(e) {
                if (e.originalEvent) {
                    L.DomEvent.stopPropagation(e.originalEvent); // keep the map from zooming
                    L.DomEvent.preventDefault(e.originalEvent);

                startRegionEdit(e.layer);

            // Toolbar "Edit layers": make sure every polygon's editor uses its current points
            map.on('draw:editstart', function() { drawnItems.eachLayer(refreshEditing); });
            map.on(L.Draw.Event.CREATED, onDrawCreated);
            map.on(L.Draw.Event.EDITED, onDrawEdited);
            map.on(L.Draw.Event.DELETED, onDrawDeleted);
            initRegionInteractions();

            // Add legend control
            legendControl = L.control({ position: 'bottomright' });
            legendControl.onAdd = function (map) {
                var div = L.DomUtil.create('div', 'legend-control');
                var content = `
                    <div class="legend-header">
                        <strong>Legend</strong>
                        <span class="toggle-legend" style="cursor:pointer;">▼</span>
                    </div>
                    <div class="legend-content">
                        <div class="legend-item">
                            <div class="legend-icon"><i class="fa fa-check-circle" style="color: green;"></i></div>
                            <span>Allowed Connection (within region)</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-icon"><i class="fa fa-exclamation-triangle" style="color: red;"></i></div>
                            <span>Blocked Connection (outside region)</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-icon"><i class="fa fa-user" style="color: blue;"></i></div>
                            <span>Whitelisted IP</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-circle" style="background-color: rgba(0, 128, 0, 0.6);"></div>
                            <span>Multiple Allowed Connections</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-circle" style="background-color: rgba(255, 0, 0, 0.6);"></div>
                            <span>Multiple Blocked Connections</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-circle" style="background-color: rgba(0, 0, 255, 0.6);"></div>
                            <span>Multiple Whitelisted IPs</span>

                        <div class="legend-item">

                            <span>Mixed Connection Types</span>

                            <span>Allowed region (circle or polygon)</span>

                `;
                div.innerHTML = content;

                // Add click handler for legend toggle
                setTimeout(() => {
                    var header = div.querySelector('.legend-header');
                    var content = div.querySelector('.legend-content');
                    var toggle = div.querySelector('.toggle-legend');
                    
                    header.addEventListener('click', function() {

                return div;
            };
            legendControl.addTo(map);
            applyLegendVisibility();
            addIpHistoryControl();

            // Notify parent frame that the map is ready
            window.parent.postMessage({ type: 'mapReady' }, '*');
            
            if (homePosition) {
                map.setView(homePosition, 4);

            if (localStorage.getItem('homePosition')) {
                updateHomeMarker(homePosition, localStorage.getItem('homeLabel') || '');
            }
        }

        /**
         * Zoom-out limit, chosen in the colours panel:
         *  'fill'   - the world covers the whole window (no margins); a wide window crops the top and bottom.
         *  'world'  - the entire world (pole to pole) fits; a wide window shows sea-coloured margins at the sides.
         *  'repeat' - the entire world fits and the map repeats sideways, so there are no margins either.
         */
        function updateMinZoom() {
            var size = map.getSize();
            if (!size.x || !size.y) return;
            var mode = getZoomFitMode();
            // the Mercator world is 256 * 2^zoom pixels square
            var side = mode === 'fill' ? Math.max(size.x, size.y) : Math.min(size.x, size.y);
            var z = Math.log(side / 256) / Math.LN2;
            if (isFinite(z)) map.setMinZoom(Math.max(0, z));
            map.setMaxBounds(mode === 'repeat' ? [[-90, -1000000], [90, 1000000]] : [[-90, -180], [90, 180]]);   // repeat: endless sideways
            updateLabelVisibility();
        }

        function refreshZoomFitButtons(panel) {
            var mode = getZoomFitMode();
            panel.querySelectorAll('.zoomfit-option').forEach(function(b) {
                b.classList.toggle('active', b.getAttribute('data-zoomfit') === mode);
            });
        }

        /**
         * Applies the saved legend visibility (hidden completely, or shown).
         */
        var legendShown = null;
        function applyLegendVisibility() {
            if (legendShown === null) {   // hidden unless it was switched on with the legend button
                legendShown = false;
                try { legendShown = localStorage.getItem('legendShown') === '1'; } catch (e) {}
            }
            var hidden = !legendShown;
            if (legendControl && legendControl.getContainer()) {
                legendControl.getContainer().style.display = hidden ? 'none' : '';
            }
            var btn = document.getElementById('legend-toggle-button');
            if (btn) btn.classList.toggle('legend-off', hidden);
        }

        /**
         * Shows/hides the ZIP code panel.
         */
        function showHomeZipPanel(show) {
            if (!homeZipPanel) return;
            var el = homeZipPanel.getContainer();
            el.style.display = show ? 'block' : 'none';
            if (show) {
                clearPendingHome();
                el.querySelector('.hz-status').textContent = '';
                el.querySelector('.hz-status').className = 'hz-status';
                el.querySelector('.hz-results').innerHTML = '';
                // Don't steal focus on touch devices; click-on-map is the primary action there
                if (!('ontouchstart' in window)) el.querySelector('.hz-q').focus();
            }
        }

        /**
         * Leaves "set home" mode without changing the home position.
         */
        function finishSetHome() {
            isSettingHome = false;
            map.off('click', onMapClick);
            var btn = document.querySelector('.set-home-button');
            if (btn) btn.style.backgroundColor = '';
            map.getContainer().classList.remove('set-home-cursor');
            clearPendingHome();
            showHomeZipPanel(false);
        }

        /**
         * Stores and jumps to a new home position (from a map click or a ZIP lookup).
         */
        function applyHome(position, label, fromClick) {
            // Remember what home was, so a misclick can be undone
            var prevSaved = localStorage.getItem('homePosition');
            var prevLabel = localStorage.getItem('homeLabel') || '';
            homePosition = position;
            localStorage.setItem('homePosition', JSON.stringify(homePosition));
            localStorage.setItem('homeLabel', label || '');
            map.setView(homePosition, Math.max(map.getZoom(), 4)); // stay on the spot instead of zooming away from it
            finishSetHome();
            updateHomeMarker(homePosition, label);
            window.parent.postMessage({ type: 'homePositionSet', data: homePosition }, '*');
            showUndoToast('Home position set.', function() { undoHome(prevSaved, prevLabel); });
            if (!label) {
                // No name yet (e.g. you clicked the map): look up what is actually there
                nameLocation(position, function(name) {
                    if (!name || homePosition !== position) return;
                    localStorage.setItem('homeLabel', name);
                    updateHomeMarker(position, name);
                    if (fromClick) showHomePopup(position, name);
                });
            }
        }

        /**
         * Puts the previous home position back (or clears home if there was none).
         */
        function undoHome(prevSaved, prevLabel) {
            map.closePopup();
            if (prevSaved) {
                localStorage.setItem('homePosition', prevSaved);
                localStorage.setItem('homeLabel', prevLabel);
                homePosition = JSON.parse(prevSaved);
                updateHomeMarker(homePosition, prevLabel);
                map.setView(homePosition, Math.max(map.getZoom(), 4));
                window.parent.postMessage({ type: 'homePositionSet', data: homePosition }, '*');
            } else {
                localStorage.removeItem('homePosition');
                localStorage.removeItem('homeLabel');
                homePosition = [51.505, -0.09]; // built-in default
                if (homeMarker) { map.removeLayer(homeMarker); homeMarker = null; }
            }
        }

        /**
         * Shows (or moves) the home marker, with the place name on hover.
         */
        function updateHomeMarker(position, label) {
            if (homeMarker) { map.removeLayer(homeMarker); homeMarker = null; }
            var img = document.querySelector('.go-home-button img');
            var html = img ? '<img alt="Home" src="' + img.src + '">' : '🏠';
            homeMarker = L.marker(position, {
                icon: L.divIcon({ className: '', html: '<div class="home-marker">' + html + '</div>', iconSize: [34, 34], iconAnchor: [17, 17] }),
                keyboard: false,
                zIndexOffset: 900
            }).addTo(map);
            homeMarker.bindTooltip(label ? 'Home: ' + label : 'Home', { direction: 'top', offset: [0, -18], className: 'preview-label' });
        }

        function showHomePopup(position, label) {
            var box = document.createElement('div');
            box.textContent = 'Home set: ' + label;
            L.popup({ maxWidth: 240, offset: [0, -14] }).setLatLng(position).setContent(box).openOn(map);
        }

        /**
         * Asks OpenStreetMap what is at a point (city / area name), in English.
         */
        function nameLocation(position, done) {
            fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=en&zoom=10&lat=' +
                  position[0] + '&lon=' + position[1], { headers: { 'Accept': 'application/json' } })
                .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(function(d) { done(d && d.display_name ? d.display_name : ''); })
                .catch(function() { done(''); });
        }

        /**
         * Handles the map click event when setting a new home position.
         * @param {Object} e - The event object containing latlng.
         */
        function onMapClick(e) {
            var wrapped = e.latlng.wrap();
            applyHome([wrapped.lat, wrapped.lng], '', true);
        }

        /**
         * Switches the search panel between ZIP code and place name.
         */
        function setHomeSearchMode(mode) {
            homeSearchMode = mode;
            var el = homeZipPanel.getContainer();
            el.querySelectorAll('.hz-tab').forEach(function(t) {
                t.classList.toggle('active', t.getAttribute('data-mode') === mode);
            });
            var q = el.querySelector('.hz-q');
            q.placeholder = mode === 'zip' ? 'ZIP / postal code' : 'City, address or landmark';
            el.querySelector('.hz-go').textContent = mode === 'zip' ? 'Search ZIP' : 'Search place';
            clearTimeout(suggestTimer); suggestToken++;
            clearPendingHome();
            el.querySelector('.hz-status').textContent = '';
            el.querySelector('.hz-results').innerHTML = '';
            q.focus();
        }

        /**
         * Forgets a previewed (searched but not applied) location.
         */
        function clearPendingHome() {
            if (pendingMarker) { map.removeLayer(pendingMarker); pendingMarker = null; }
            pendingHome = null;
            pendingLabel = '';
            if (homeZipPanel) homeZipPanel.getContainer().querySelector('.hz-apply').classList.remove('show');
        }

        /**
         * Search result: just move the map there and mark it. Home is NOT changed until "Apply as home".
         */
        function previewLocation(hit, fallbackLabel) {
            var lat = parseFloat(hit.lat), lon = parseFloat(hit.lon);
            if (pendingMarker) { map.removeLayer(pendingMarker); pendingMarker = null; }
            pendingHome = [lat, lon];
            pendingLabel = hit.display_name || fallbackLabel;
            pendingMarker = L.marker(pendingHome, {
                icon: L.divIcon({ className: 'preview-pin', html: '<span></span>', iconSize: [22, 22], iconAnchor: [11, 11] }),
                interactive: false, keyboard: false, zIndexOffset: 800
            }).addTo(map);
            pendingMarker.bindTooltip(pendingLabel, { permanent: true, direction: 'top', offset: [0, -14], className: 'preview-label' });
            map.setView(pendingHome, 8);

            var el = homeZipPanel.getContainer();
            var status = el.querySelector('.hz-status');
            status.className = 'hz-status';
            status.textContent = 'Showing: ' + pendingLabel;
            el.querySelector('.hz-apply').classList.add('show');
        }

        /**
         * Sets the previewed location as the home position.
         */
        function applyPendingHome() {
            if (!pendingHome) return;
            var pos = pendingHome, label = pendingLabel;
            applyHome(pos, label);
            showHomePopup(pos, label);
        }

        /**
         * Called on every keystroke in the search box: after a short pause, suggests places for what's typed so far.
         */
        function onSearchInput() {
            clearTimeout(suggestTimer);
            var el = homeZipPanel.getContainer();
            var text = el.querySelector('.hz-q').value.trim();
            if (homeSearchMode !== 'name' || text.length < 3) {
                suggestToken++;
                if (homeSearchMode === 'name') {
                    el.querySelector('.hz-results').innerHTML = '';
                    el.querySelector('.hz-status').textContent = '';
                }
                return;
            }
            suggestTimer = setTimeout(function() { suggestPlaces(text); }, 300);
        }

        /**
         * Builds a readable label like "Springfield, Illinois, United States" from a Photon result.
         */
        function photonLabel(props) {
            var parts = [props.name, props.street && (props.housenumber ? props.housenumber + ' ' : '') + props.street,
                         props.district, props.city, props.state, props.country];
            var seen = {};
            return parts.filter(function(x) {
                if (!x || seen[x]) return false;
                seen[x] = true;
                return true;
            }).join(', ');
        }

        /**
         * Search-as-you-type suggestions from Photon (an OpenStreetMap-based search that supports partial text).
         * Picking one only previews it; use "Apply as home" to save.
         */
        function suggestPlaces(text) {
            var el = homeZipPanel.getContainer();
            var list = el.querySelector('.hz-results');
            var status = el.querySelector('.hz-status');
            var cc = el.querySelector('.hz-cc').value.trim().toUpperCase();
            var token = ++suggestToken;

            fetch('https://photon.komoot.io/api/?lang=en&limit=10&q=' + encodeURIComponent(text))
                .then(function(r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function(data) {
                    if (token !== suggestToken) return; // a newer keystroke or search took over
                    var hits = (data.features || []).filter(function(f) {
                        return f.geometry && f.geometry.coordinates &&
                               (!cc || (f.properties.countrycode || '').toUpperCase() === cc);
                    }).slice(0, 5);

                    list.innerHTML = '';
                    status.className = 'hz-status';
                    if (!hits.length) {
                        status.textContent = 'No suggestions yet. Keep typing, or press Enter to search.';
                        return;
                    }
                    status.textContent = 'Suggestions:';
                    hits.forEach(function(f) {
                        var label = photonLabel(f.properties);
                        var btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'hz-result';
                        btn.textContent = label;
                        L.DomEvent.on(btn, 'click', function(ev) {
                            L.DomEvent.stop(ev);
                            previewLocation({ lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0], display_name: label }, text);
                        });
                        list.appendChild(btn);
                    });
                })
                .catch(function(err) {
                    if (token !== suggestToken) return;
                    status.className = 'hz-status';
                    status.textContent = 'Suggestions unavailable. Press Enter to search.';
                    console.warn('Place suggestions failed:', err);
                });
        }

        /**
         * Looks up a ZIP code or place name via OpenStreetMap Nominatim.
         * ZIP: uses the top match. Name: lists up to 5 matches to pick from.
         */
        function lookupHome() {
            var el = homeZipPanel.getContainer();
            var text = el.querySelector('.hz-q').value.trim();
            var cc = el.querySelector('.hz-cc').value.trim().toLowerCase();
            var status = el.querySelector('.hz-status');
            var go = el.querySelector('.hz-go');
            var list = el.querySelector('.hz-results');
            var isZip = homeSearchMode === 'zip';
            clearTimeout(suggestTimer); suggestToken++;
            list.innerHTML = '';
            clearPendingHome();

            if (!text) {
                status.className = 'hz-status error';
                status.textContent = isZip ? 'Enter a ZIP / postal code.' : 'Enter a place name.';
                return;
            }
            if (cc && !/^[a-z]{2}$/.test(cc)) {
                status.className = 'hz-status error';
                status.textContent = 'Country code must be 2 letters (e.g. US, DE).';
                return;
            }

            var url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&accept-language=en&limit=' + (isZip ? 1 : 5) +
                      (isZip ? '&postalcode=' : '&q=') + encodeURIComponent(text) +
                      (cc ? '&countrycodes=' + cc : '');
            status.className = 'hz-status';
            status.textContent = 'Searching...';
            go.disabled = true;

            fetch(url, { headers: { 'Accept': 'application/json' } })
                .then(function(r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function(results) {
                    go.disabled = false;
                    results = (results || []).filter(function(h) {
                        return isFinite(parseFloat(h.lat)) && isFinite(parseFloat(h.lon));
                    });
                    if (!results.length) {
                        status.className = 'hz-status error';
                        status.textContent = isZip ? 'No match. Try adding a country code.' : 'No match. Try a different spelling or add a country code.';
                        return;
                    }
                    try { localStorage.setItem('homeZipCountry', cc); } catch (e) {}
                    if (results.length === 1) {
                        previewLocation(results[0], text);
                        return;
                    }
                    status.textContent = 'Pick the right match:';
                    results.forEach(function(hit) {
                        var btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'hz-result';
                        btn.textContent = hit.display_name || text;
                        L.DomEvent.on(btn, 'click', function(ev) {
                            L.DomEvent.stop(ev);
                            previewLocation(hit, text);
                        });
                        list.appendChild(btn);
                    });
                })
                .catch(function(err) {
                    go.disabled = false;
                    status.className = 'hz-status error';
                    status.textContent = 'Lookup failed: ' + err.message;
                });
        }


        // ===================================================================================
        // Naming a new filter, with optional presets (the list comes from the LuCI page)
        // ===================================================================================
        var presets = [];
        var nameDialogOpen = false;

        function askRegionName(done) {
            if (nameDialogOpen) { done(null); return; }
            nameDialogOpen = true;
            var back = document.createElement('div');
            back.className = 'name-dialog-backdrop';
            var box = document.createElement('div');
            box.className = 'name-dialog';
            box.innerHTML = '<h3>New filter</h3>' +
                (presets.length ? '<label for="nd-preset">Preset</label><select id="nd-preset"></select>' : '') +
                '<label for="nd-name">Name</label><input id="nd-name" type="text" autocomplete="off" maxlength="40" placeholder="Name for this filter">' +
                '<div class="nd-name-err" style="display:none;color:#ef4444;font-size:12px;margin-top:4px">Use only letters, numbers, spaces and _ . - (the router can\u2019t use other characters in a filter name).</div>' +
                '<div class="nd-info" style="display:none"></div>' +
                '<div class="nd-actions"><button type="button" class="nd-cancel">Cancel</button><button type="button" class="nd-ok">Create</button></div>';
            back.appendChild(box);
            document.body.appendChild(back);

            var sel = box.querySelector('#nd-preset');
            var nameIn = box.querySelector('#nd-name');
            var info = box.querySelector('.nd-info');
            var autoName = '';   // the name filled in by a preset, so changing the preset can replace it
            if (sel) {
                var none = document.createElement('option'); none.value = ''; none.textContent = 'Custom (no preset)'; sel.appendChild(none);
                presets.forEach(function(p) {
                    var o = document.createElement('option'); o.value = p.id; o.textContent = p.label + (p.allPlatforms ? ' (all platforms)' : ''); sel.appendChild(o);
                });
                sel.addEventListener('change', function() {
                    var p = presets.filter(function(x) { return x.id === sel.value; })[0];
                    if (p) {
                        if (!nameIn.value.trim() || nameIn.value === autoName) { nameIn.value = p.label; autoName = p.label; }
                        info.className = 'nd-info' + (p.allPlatforms ? '' : ' warn');
                        info.textContent = '';
                        var line = document.createElement('div'); line.textContent = (p.allPlatforms ? '✔ ' : '') + p.platformText; info.appendChild(line);
                        var sm = document.createElement('small'); sm.textContent = p.detail + (p.note ? ' — ' + p.note : ''); info.appendChild(sm);
                        if (p.warning) { var wn = document.createElement('div'); wn.className = 'nd-warning'; wn.textContent = '⚠ ' + p.warning; info.appendChild(wn); }
                        info.style.display = '';
                    } else {
                        if (nameIn.value === autoName) nameIn.value = '';
                        autoName = '';
                        info.style.display = 'none';
                    }
                });
            }

            function close(result) {
                document.removeEventListener('keydown', onKey, true);
                back.remove();
                nameDialogOpen = false;
                done(result);
            }
            function ok() {
                var name = nameIn.value.trim().replace(/\s+/g, ' ');
                if (!name) { nameIn.focus(); nameIn.style.borderColor = '#ef4444'; return; }
                // The name becomes part of the router's firewall set names, which allow only these characters
                if (!/^[A-Za-z0-9_ .-]+$/.test(name)) {
                    nameIn.focus(); nameIn.style.borderColor = '#ef4444';
                    var ne = box.querySelector('.nd-name-err'); if (ne) ne.style.display = '';
                    return;
                }
                close({ name: name, preset: sel ? sel.value : '' });
            }
            function onKey(ev) {
                ev.stopPropagation();   // keys here belong to the dialog, not to the map behind it
                if (ev.key === 'Escape') { ev.preventDefault(); close(null); }
                else if (ev.key === 'Enter') { ev.preventDefault(); ok(); }
            }
            document.addEventListener('keydown', onKey, true);
            box.querySelector('.nd-ok').addEventListener('click', ok);
            box.querySelector('.nd-cancel').addEventListener('click', function() { close(null); });
            back.addEventListener('mousedown', function(ev) { if (ev.target === back) close(null); });
            setTimeout(function() { (sel || nameIn).focus(); }, 0);
        }

        /**
         * Handles the creation of new shapes on the map.
         * @param {Object} event - The draw event object.
         */
        function onDrawCreated(event) {
            var layer = event.layer;
            // Polygons get an adjust step first, so a mis-clicked point can be fixed before saving
            if (layer instanceof L.Polygon && !layer.getRadius) {
                startPolygonAdjust(layer);
                return;
            }
            finishCreate(layer);
        }

        /**
         * Asks for a name and saves a newly drawn (and, for polygons, adjusted) shape as a region.
         */
        function finishCreate(layer) {
            var regionData = getRegionData(layer);
            if (!regionData) return;
            if (!map.hasLayer(layer)) layer.addTo(map);   // keep the shape visible while it is being named
            askRegionName(function(res) {
                if (!res) {
                    // Remove the layer if no name was provided
                    map.removeLayer(layer);
                    drawnItems.removeLayer(layer);
                    console.log('Region creation canceled by user.');
                    return;
                }
                var name = res.name;
                // Initialize the region if it doesn't exist
                if (!regions[name]) {
                    regions[name] = [];
                }
                setRegionColor(layer, name);
                layer.options.name = name;
                layer.options.regionData = regionData;
                layer.bindTooltip(name);
                refreshEditing(layer);
                drawnItems.addLayer(layer);
                regions[name].push(layer);
                window.parent.postMessage({ type: 'regionCreated', data: { name: name, region: regionData, preset: res.preset || '' } }, '*');
            });
        }

        /**
         * Straightens the edges of a drawn shape so they run exactly horizontal or vertical.
         * Corners joined by such an edge share one x (or y), taken as their average, so a crooked rectangle becomes a clean one.
         * How crooked an edge may be and still count is not fixed: the gentlest setting that makes EVERY edge straight is used
         * (12, 20, 28, 36, then 44 degrees off the axis). A shape with a real diagonal side (a triangle, say) cannot become
         * all straight, so there only the edges within 20 degrees are straightened. A setting that would squash the shape
         * (corners landing on top of each other, most of the area lost) is never used.
         * Returns a new array of LatLngs.
         */
        function alignLatLngs(latlngs) {
            var zoom = map.getZoom();
            var P = latlngs.map(function(ll) { return map.project(ll, zoom); });
            var n = P.length;
            if (n < 3) return latlngs.slice();
            function area(Q) {
                var s = 0;
                for (var i = 0; i < Q.length; i++) { var j = (i + 1) % Q.length; s += Q[i].x * Q[j].y - Q[j].x * Q[i].y; }
                return Math.abs(s) / 2;
            }
            var area0 = area(P);
            function attempt(tolDeg) {
                var TOL = tolDeg * Math.PI / 180;
                var gx = P.map(function(_, i) { return i; });
                var gy = P.map(function(_, i) { return i; });
                function find(g, i) { while (g[i] !== i) { g[i] = g[g[i]]; i = g[i]; } return i; }
                function union(g, a, b) { g[find(g, a)] = find(g, b); }
                for (var i = 0; i < n; i++) {
                    var j = (i + 1) % n;
                    var dx = Math.abs(P[j].x - P[i].x), dy = Math.abs(P[j].y - P[i].y);
                    if (dx === 0 && dy === 0) continue;
                    var ang = Math.atan2(Math.min(dx, dy), Math.max(dx, dy)); // angle off the nearest axis
                    if (ang > TOL) continue;
                    if (dy >= dx) union(gx, i, j); // mostly vertical: share x
                    else union(gy, i, j);          // mostly horizontal: share y
                }
                var sumX = {}, cntX = {}, sumY = {}, cntY = {};
                P.forEach(function(p, i) {
                    var a = find(gx, i), b = find(gy, i);
                    sumX[a] = (sumX[a] || 0) + p.x; cntX[a] = (cntX[a] || 0) + 1;
                    sumY[b] = (sumY[b] || 0) + p.y; cntY[b] = (cntY[b] || 0) + 1;
                });
                var Q = P.map(function(p, i) {
                    var a = find(gx, i), b = find(gy, i);
                    return L.point(sumX[a] / cntX[a], sumY[b] / cntY[b]);
                });
                var allStraight = true, squashed = false;
                for (var k = 0; k < n; k++) {
                    var m = (k + 1) % n;
                    var ddx = Math.abs(Q[m].x - Q[k].x), ddy = Math.abs(Q[m].y - Q[k].y);
                    if (ddx < 0.5 && ddy < 0.5) squashed = true;                 // two corners on top of each other
                    else if (ddx > 0.5 && ddy > 0.5) allStraight = false;        // this edge is still slanted
                }
                if (!squashed && area0 > 0 && area(Q) < area0 * 0.25) squashed = true;
                return { pts: Q, allStraight: allStraight, squashed: squashed };
            }
            var chosen = null, tols = [12, 20, 28, 36, 44];
            for (var t = 0; t < tols.length && !chosen; t++) {
                var r = attempt(tols[t]);
                if (!r.squashed && r.allStraight) chosen = r;
            }
            if (!chosen) { var g = attempt(20); chosen = g.squashed ? attempt(12) : g; }
            if (chosen.squashed) return latlngs.slice();
            return chosen.pts.map(function(q) { return map.unproject(q, zoom); });
        }

        /**
         * Leaflet.draw's polygon editor remembers the polygon's point list from when the polygon was created.
         * After setLatLngs() replaced that list, dragging handles changed the old list and the polygon never moved.
         * Giving the polygon a fresh editor makes it use the current points.
         */
        function refreshEditing(layer) {
            if (!layer || !layer.editing || typeof layer.getRadius === 'function') return; // circles are fine
            if (!(L.Edit && L.Edit.Poly) || typeof layer.getLatLngs !== 'function') return;
            var wasEnabled = layer.editing.enabled && layer.editing.enabled();
            if (wasEnabled) layer.editing.disable();
            layer.editing = new L.Edit.Poly(layer);
            if (wasEnabled) layer.editing.enable();
        }

        function barHost() {
            var h = document.getElementById('bottom-bars');
            if (!h) { h = document.createElement('div'); h.id = 'bottom-bars'; document.body.appendChild(h); }
            return h;
        }

        var undoToast = null;
        var undoToastTimer = null;

        /**
         * Small bar at the bottom with an Undo button, used after a region is deleted.
         */
        function showUndoToast(text, undoFn) {
            hideUndoToast();
            undoToast = document.createElement('div');
            undoToast.className = 'poly-adjust-bar';
            var label = document.createElement('span');
            label.textContent = text;
            var undoBtn = document.createElement('button');
            undoBtn.type = 'button'; undoBtn.className = 'pa-ok'; undoBtn.textContent = 'Undo';
            undoBtn.onclick = function() { hideUndoToast(); undoFn(); };
            var closeBtn = document.createElement('button');
            closeBtn.type = 'button'; closeBtn.className = 'pa-cancel'; closeBtn.textContent = 'Dismiss';
            closeBtn.onclick = hideUndoToast;
            undoToast.appendChild(label); undoToast.appendChild(undoBtn); undoToast.appendChild(closeBtn);
            L.DomEvent.disableClickPropagation(undoToast);
            barHost().appendChild(undoToast);
            undoToastTimer = setTimeout(hideUndoToast, 30000);
        }
        function hideUndoToast() {
            clearTimeout(undoToastTimer);
            if (undoToast) { undoToast.remove(); undoToast = null; }
        }

        /**
         * Puts a deleted region back and tells the page to save it again.
         */
        function restoreRegion(layer, name, data) {
            if (!regions[name]) regions[name] = [];
            regions[name].push(layer);
            drawnItems.addLayer(layer);
            window.parent.postMessage({ type: 'regionCreated', data: { name: name, region: data } }, '*');
        }

        /**
         * Deletes one saved region, with an Undo for a few seconds.
         */
        function deleteRegionLayer(layer) {
            var name = layer.options.name;
            var data = layer.options.regionData || getRegionData(layer);
            removeTwins(layer, data);
            drawnItems.removeLayer(layer);
            if (name && regions[name]) {
                var i = regions[name].indexOf(layer);
                if (i > -1) regions[name].splice(i, 1);
                if (regions[name].length === 0) delete regions[name];
            }
            window.parent.postMessage({ type: 'regionDeleted', data: { name: name, region: data } }, '*');
            showUndoToast('Deleted "' + name + '".', function() { restoreRegion(layer, name, data); });
        }

        /**
         * Removes other copies of a region (same name, same shape) so a moved or edited region never leaves its old
         * position behind. Returns how many were removed.
         */
        function removeTwins(layer, data) {
            var name = layer && layer.options && layer.options.name;
            if (!name || !data || !regions[name]) return 0;
            var twins = regions[name].filter(function(l) {
                return l !== layer && (l.options.regionData || getRegionData(l)) === data;
            });
            twins.forEach(function(l) {
                drawnItems.removeLayer(l);
                var i = regions[name].indexOf(l);
                if (i > -1) regions[name].splice(i, 1);
            });
            return twins.length;
        }

        var regionEditBar = null;
        var regionEditKeyHandler = null;

        /**
         * Edits a saved region in place. Polygons: drag the blue corner dots (Align straightens them).
         * Circles: drag the dots to move or resize. Save keeps the change, Cancel puts it back.
         */
        function startRegionEdit(layer) {
            if (regionEditBar || polyAdjustBar || !layer || !layer.editing) return;
            clearSelection();
            if (map.getContainer().classList.contains('drawing-shape')) return;

            var isCircle = typeof layer.getRadius === 'function';
            var name = layer.options.name || 'region';
            var oldRegionData = layer.options.regionData || getRegionData(layer);

            function ringOf() {
                var r = layer.getLatLngs();
                if (r.length && Array.isArray(r[0])) r = r[0];
                return r.map(function(p) { return L.latLng(p.lat, p.lng); });
            }
            var backup = isCircle ? { center: layer.getLatLng(), radius: layer.getRadius() } : { ring: ringOf() };
            var beforeAlign = null;

            map.getContainer().classList.add('editing-shape');
            refreshEditing(layer);
            layer.editing.enable();

            function setRing(ring) {
                layer.editing.disable();
                layer.setLatLngs(ring);
                refreshEditing(layer);
                layer.editing.enable();
            }
            function close() {
                layer.editing.disable();
                map.getContainer().classList.remove('editing-shape');
                if (regionEditBar) { regionEditBar.remove(); regionEditBar = null; }
                if (regionEditKeyHandler) { document.removeEventListener('keydown', regionEditKeyHandler); regionEditKeyHandler = null; }
            }
            function save() {
                close();
                var newRegionData = getRegionData(layer);
                if (newRegionData && newRegionData !== oldRegionData) {
                    layer.options.regionData = newRegionData;
                    removeTwins(layer, oldRegionData);
                    window.parent.postMessage({
                        type: 'regionEdited',
                        data: { name: layer.options.name, oldRegion: oldRegionData, region: newRegionData }
                    }, '*');
                }
            }
            function cancel() {
                close();
                if (isCircle) { layer.setLatLng(backup.center); layer.setRadius(backup.radius); }
                else { layer.setLatLngs(backup.ring); refreshEditing(layer); }
            }
            function toggleAlign() {
                var btn = regionEditBar.querySelector('.pa-align');
                if (beforeAlign) { setRing(beforeAlign); beforeAlign = null; btn.textContent = 'Align'; }
                else { beforeAlign = ringOf(); setRing(alignLatLngs(beforeAlign)); btn.textContent = 'Undo align'; }
            }

            regionEditBar = document.createElement('div');
            regionEditBar.className = 'poly-adjust-bar';
            var label = document.createElement('span');
            label.textContent = 'Editing "' + name + '": drag the blue dots to reshape. (Delete key removes it, Esc cancels)';
            regionEditBar.appendChild(label);
            if (!isCircle) {
                var alignBtn = document.createElement('button');
                alignBtn.type = 'button'; alignBtn.className = 'pa-align pa-cancel'; alignBtn.textContent = 'Align';
                alignBtn.title = 'Straighten nearly horizontal / vertical edges';
                alignBtn.onclick = toggleAlign;
                regionEditBar.appendChild(alignBtn);
            }
            var saveBtn = document.createElement('button');
            saveBtn.type = 'button'; saveBtn.className = 'pa-ok'; saveBtn.textContent = 'Save'; saveBtn.onclick = save;
            var cancelBtn = document.createElement('button');
            cancelBtn.type = 'button'; cancelBtn.className = 'pa-cancel pa-x'; cancelBtn.textContent = 'Cancel'; cancelBtn.onclick = cancel;
            var deleteBtn = document.createElement('button');
            deleteBtn.type = 'button'; deleteBtn.className = 'pa-delete'; deleteBtn.textContent = 'Delete';
            deleteBtn.title = 'Delete this region (you can undo)';
            deleteBtn.onclick = function() { cancel(); deleteRegionLayer(layer); };
            regionEditBar.appendChild(saveBtn);
            regionEditBar.appendChild(cancelBtn);
            regionEditBar.appendChild(deleteBtn);
            L.DomEvent.disableClickPropagation(regionEditBar);
            barHost().appendChild(regionEditBar);

            regionEditKeyHandler = function(ev) {
                if (ev.key === 'Escape') cancel();
                else if (ev.key === 'Enter') save();
                else if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); cancel(); deleteRegionLayer(layer); }
            };
            document.addEventListener('keydown', regionEditKeyHandler);
        }

        var polyAdjustBar = null;
        var polyAdjustKeyHandler = null;

        /**
         * Adjust step for a just-drawn polygon, continuing from the point where drawing stopped:
         * click the map to add more points after the last one, drag the single blue dot to move the last point,
         * or Undo to step back. Confirm continues to the name prompt; Cancel discards the shape.
         */
        function startPolygonAdjust(layer) {
            var ring = layer.getLatLngs();
            if (ring.length && Array.isArray(ring[0])) ring = ring[0];
            var pts = ring.map(function(p) { return L.latLng(p.lat, p.lng); });

            layer.setStyle({ color: '#3b82f6', fillColor: '#3b82f6', fillOpacity: 0.12, weight: 3, dashArray: '6 4' });
            layer.setLatLngs(pts);
            layer.addTo(map);

            // The only handle: a blue dot on the last point
            var endMarker = L.marker(pts[pts.length - 1], {
                draggable: true,
                keyboard: false,
                zIndexOffset: 1000,
                icon: L.divIcon({ className: 'poly-end-dot', iconSize: [16, 16] })
            }).addTo(map);

            function forgetAlign() {
                beforeAlign = null;
                if (polyAdjustBar) polyAdjustBar.querySelector('.pa-align').textContent = 'Align';
            }
            endMarker.on('dragstart', function() { forgetAlign(); });
            endMarker.on('drag', function(e) {
                var ll = e.target.getLatLng();
                pts[pts.length - 1] = L.latLng(ll.lat, ll.lng);
                layer.setLatLngs(pts);
            });

            function addPoint(e) {
                forgetAlign();
                pts.push(e.latlng);
                layer.setLatLngs(pts);
                endMarker.setLatLng(e.latlng);
            }
            function undoPoint() {
                if (pts.length <= 3) return; // a polygon needs at least 3 points
                pts.pop();
                layer.setLatLngs(pts);
                endMarker.setLatLng(pts[pts.length - 1]);
            }
            map.on('click', addPoint);

            function close() {
                map.off('click', addPoint);
                map.removeLayer(endMarker);
                map.removeLayer(layer);
                if (polyAdjustBar) { polyAdjustBar.remove(); polyAdjustBar = null; }
                if (polyAdjustKeyHandler) { document.removeEventListener('keydown', polyAdjustKeyHandler); polyAdjustKeyHandler = null; }
            }
            var beforeAlign = null;
            function alignPoints() { return alignLatLngs(pts); }
            function toggleAlign() {
                var btn = polyAdjustBar.querySelector('.pa-align');
                if (beforeAlign) { // second press: put the points back
                    pts = beforeAlign; beforeAlign = null; btn.textContent = 'Align';
                } else {
                    beforeAlign = pts.slice();
                    pts = alignPoints();
                    btn.textContent = 'Undo align';
                }
                layer.setLatLngs(pts);
                endMarker.setLatLng(pts[pts.length - 1]);
            }
            function confirmShape() {
                close();
                layer.setStyle({ dashArray: null });
                finishCreate(layer);
            }
            function cancelShape() {
                close();
            }

            polyAdjustBar = document.createElement('div');
            polyAdjustBar.className = 'poly-adjust-bar';
            polyAdjustBar.innerHTML = '<span>Click the map to add points, or drag the blue dot to move the last point.</span>' +
                '<button type="button" class="pa-align pa-cancel" title="Straighten nearly horizontal / vertical edges">Align</button>' +
                '<button type="button" class="pa-undo pa-cancel">Undo last point</button>' +
                '<button type="button" class="pa-ok">Confirm</button>' +
                '<button type="button" class="pa-cancel pa-x">Cancel</button>';
            polyAdjustBar.querySelector('.pa-undo').onclick = function() { beforeAlign = null; polyAdjustBar.querySelector('.pa-align').textContent = 'Align'; undoPoint(); };
            polyAdjustBar.querySelector('.pa-align').onclick = toggleAlign;
            polyAdjustBar.querySelector('.pa-ok').onclick = confirmShape;
            polyAdjustBar.querySelector('.pa-x').onclick = cancelShape;
            L.DomEvent.disableClickPropagation(polyAdjustBar);
            barHost().appendChild(polyAdjustBar);

            polyAdjustKeyHandler = function(ev) {
                if (ev.key === 'Escape') cancelShape();
                else if (ev.key === 'Enter') confirmShape();
                else if (ev.key === 'Backspace') { ev.preventDefault(); forgetAlign(); undoPoint(); }
                else if (ev.key === 'a' || ev.key === 'A') toggleAlign();
                else if (ev.key === 'Delete') { // discard the whole shape (with an Undo)
                    var discarded = layer;
                    cancelShape();
                    showUndoToast('Shape discarded.', function() { startPolygonAdjust(discarded); });
                }
            };
            document.addEventListener('keydown', polyAdjustKeyHandler);
        }

        /**
         * Handles the editing of existing shapes on the map.
         * @param {Object} event - The edit event object.
         */
         function onDrawEdited(event) {
            var layers = event.layers;
            layers.eachLayer(function(layer) {
                var name = layer.options.name;
                if (name && regions[name]) {
                    var oldRegionData = layer.options.regionData;
                    var newRegionData = getRegionData(layer);
                    if (newRegionData && newRegionData !== oldRegionData) {
                        layer.options.regionData = newRegionData;
                        removeTwins(layer, oldRegionData);
                        window.parent.postMessage({
                            type: 'regionEdited',
                            data: {
                                name: name,
                                oldRegion: oldRegionData,
                                region: newRegionData
                            }
                        }, '*');
                    }
                }
            });
        }

        /**
         * Handles the deletion of shapes from the map.
         * @param {Object} event - The delete event object.
         */
        function onDrawDeleted(event) {
            var layers = event.layers;
            var removed = [];
            layers.eachLayer(function(layer) {
                var name = layer.options.name;
                if (name && regions[name]) {
                    var index = regions[name].indexOf(layer);
                    if (index > -1) {
                        regions[name].splice(index, 1);

        /**
         * Retrieves the region data from a given layer.
         * @param {Object} layer - The map layer.
         * @returns {string|null} - The region data string or null.
         */
        function getRegionData(layer) {
            if (layer.getRadius) {
                var center = layer.getLatLng().wrap();
                var radius = layer.getRadius();
                return 'circle:' + center.lat.toFixed(8) + ':' + center.lng.toFixed(8) + ':' + Math.round(radius);
            }
            if (layer instanceof L.Polygon) {
                var ring = layer.getLatLngs();
                if (ring.length && Array.isArray(ring[0])) ring = ring[0]; // outer ring only
                if (ring.length < 3) return null;
                // Format: polygon:lat,lng;lat,lng;lat,lng  (ring is stored open, not repeated)
                return 'polygon:' + ring.map(function(p) {

            }
            return null;
        }

        /**

            // The page may send the same region more than once (e.g. after a reload of the filters): show each shape once
            if (regions[name] && regions[name].some(function(l) { return l.options.regionData === data && drawnItems.hasLayer(l); })) return;
            var parts = data.split(':');
            if (parts[0] === 'circle' && parts.length === 4) {
                var lat = parseFloat(parts[1]);
                var lng = parseFloat(parts[2]);
                var radius = parseFloat(parts[3]);
                var circle = L.circle([lat, lng], {
                    radius: radius,
                    name: name
                });
                setRegionColor(circle, name);
                circle.bindTooltip(name);
                drawnItems.addLayer(circle);
                
                if (!regions[name]) {
                    regions[name] = [];
                }
                regions[name].push(circle);
                circle.options.regionData = data; // Save the original region
            } else if (parts[0] === 'polygon' && parts.length === 2) {
                var pts = parts[1].split(';').map(function(pair) {
                    var ll = pair.split(',');
                    return [parseFloat(ll[0]), parseFloat(ll[1])];

                if (pts.length < 3) {

                var poly = L.polygon(pts, { name: name });
                setRegionColor(poly, name);
                poly.bindTooltip(name);
                drawnItems.addLayer(poly);

                if (!regions[name]) {
                    regions[name] = [];
                }
                regions[name].push(poly);
                poly.options.regionData = data; // Save the original region
            }
        }

        // ----- press and drag a region to move it -----
        function initRegionInteractions() {
            var container = map.getContainer();

            map.on('draw:drawstop', function() { drawActive = false; container.classList.remove('drawing-any'); });

            map.on('draw:editstop draw:deletestop', function() { toolbarBusy = false; });

            });

            drawnItems.on('mousedown', function(e) {
                var oe = e.originalEvent;
                if (!oe || oe.button !== 0 || oe.ctrlKey || oe.metaKey || oe.shiftKey) return;
                if (regionsBusy()) return;
                var layer = e.layer;
                if (!isRegionLayer(layer)) return;

                var isCircle = typeof layer.getRadius === 'function';
                var startPt = e.containerPoint.clone();
                var startProj = crs.project(e.latlng);
                var orig = isCircle ? layer.getLatLng() : (function() {
                    var r = layer.getLatLngs();
                    if (r.length && Array.isArray(r[0])) r = r[0];
                    return r.map(function(p) { return L.latLng(p.lat, p.lng); });
                })();
                var oldData = layer.options.regionData || getRegionData(layer);
                var dragEnabled = map.dragging.enabled();
                var moving = false;

                // Keep the map itself from panning while the shape is being dragged
