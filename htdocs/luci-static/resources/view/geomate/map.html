<!DOCTYPE html>
<html>
<head>
    <title>Geomate Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Leaflet.markercluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <style>
        html, body { margin: 0; }
        #map { height: 100vh; width: 100%; }

        /* Colors of the map's own controls; the theme handover (phase 3) overrides them */
        :root {
            --gm-bg: #ffffff;
            --gm-fg: #1f2328;
            --gm-hover: #eef1f4;
            --gm-disabled-bg: #f4f4f4;
            --gm-disabled-fg: #a0a6ad;
            --gm-accent: #1a6fd1;
            --gm-accent-fg: #ffffff;
            --gm-muted: #57606a;
            --gm-border: #8c959f;
            --gm-danger: #cf222e;
            --gm-danger-fg: #ffffff;
            --gm-chip-bg: #f0b429;
            --gm-chip-fg: #1f2328;
            --gm-pill-bg: rgba(31, 35, 40, 0.9);
            --gm-pill-fg: #ffffff;
            --gm-font: 600 13px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }

        /* Map toolbar: labelled buttons in two groups (drawing, view) */
        .gm-toolbar { display: flex; flex-direction: column; gap: 10px; }
        .leaflet-bar.gm-toolbar-group { background: var(--gm-bg); }
        .leaflet-bar a.gm-btn,
        .leaflet-touch .leaflet-bar a.gm-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            box-sizing: border-box;
            width: auto;
            min-width: 36px;
            height: 36px;
            padding: 0 12px 0 10px;
            line-height: 1.2;
            font: var(--gm-font);
            text-align: left;
            white-space: nowrap;
            color: var(--gm-fg);
            background: var(--gm-bg);
        }
        .gm-btn i { width: 16px; font-size: 15px; text-align: center; }
        .gm-btn--draw i { color: var(--gm-target, var(--gm-accent)); }
        .leaflet-bar a.gm-btn:hover { background: var(--gm-hover); color: var(--gm-fg); }
        .leaflet-bar a.gm-btn:focus { outline: none; }
        .leaflet-bar a.gm-btn:focus-visible { outline: 2px solid var(--gm-accent); outline-offset: -3px; }
        .leaflet-bar a.gm-btn.gm-btn--active,
        .leaflet-bar a.gm-btn.gm-btn--active:hover { background: var(--gm-accent); color: var(--gm-accent-fg); }
        .leaflet-bar a.gm-btn.gm-btn--active i { color: inherit; }
        .leaflet-bar a.gm-btn.leaflet-disabled,
        .leaflet-bar a.gm-btn.leaflet-disabled:hover { background: var(--gm-disabled-bg); color: var(--gm-disabled-fg); cursor: not-allowed; }
        .leaflet-bar a.gm-btn.leaflet-disabled i { color: inherit; }
        @media (pointer: coarse) {
            .leaflet-bar a.gm-btn,
            .leaflet-touch .leaflet-bar a.gm-btn { min-width: 44px; height: 44px; font-size: 14px; }
        }
        /* Narrow maps: icons only, the title attribute keeps the label */
        @media (max-width: 639px) {
            .gm-btn-label { display: none; }
            .leaflet-bar a.gm-btn,
            .leaflet-touch .leaflet-bar a.gm-btn { width: 36px; padding: 0; justify-content: center; }
        }
        @media (max-width: 639px) and (pointer: coarse) {
            .leaflet-bar a.gm-btn,
            .leaflet-touch .leaflet-bar a.gm-btn { width: 44px; }
        }

        /* Mode bar: a fixed strip on top of the map while drawing, setting home or editing */
        .gm-mode-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1001;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 6px 12px;
            box-sizing: border-box;
            min-height: 40px;
            padding: 6px 12px;
            font: var(--gm-font);
            color: var(--gm-accent-fg);
            background: var(--gm-accent);
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
            cursor: default;
        }
        .gm-mode-bar[hidden] { display: none; }
        .gm-mode-swatch { flex: none; width: 12px; height: 12px; margin-right: -6px; border: 2px solid var(--gm-accent-fg); border-radius: 50%; }
        .gm-mode-extra:empty { display: none; }
        .gm-mode-extra { font-variant-numeric: tabular-nums; }
        .gm-mode-bar button {
            min-height: 28px;
            padding: 3px 14px;
            font: inherit;
            color: inherit;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 4px;
            cursor: pointer;
        }
        .gm-mode-bar button:hover { background: rgba(255, 255, 255, 0.18); }
        .gm-mode-bar button:focus-visible { outline: 2px solid var(--gm-accent-fg); outline-offset: 2px; }
        @media (pointer: coarse) {
            .gm-mode-bar button { min-height: 40px; }
        }

        /* Region circles: applyState() sets these classes next to the stroke and fill attributes */
        path.gm-circle { transition: fill-opacity 0.15s, stroke-width 0.15s; }
        path.gm-circle--disabled { filter: saturate(0.3); }
        path.gm-circle--selected { filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.55)); }
        .gm-readonly path.gm-circle { cursor: grab; }
        /* A mouse click shows no focus rectangle, the keyboard focus a ring in the accent color */
        .leaflet-container path.leaflet-interactive:focus:not(:focus-visible) { outline: none; }
        .leaflet-container path.leaflet-interactive:focus-visible { outline: 2px solid var(--gm-accent); outline-offset: 2px; }

        /* Edit handles of the selected circle (L.Edit.Circle icons): white, round, a ring in the
           filter color (--gm-handle-color on the map container), a 44 px hit area. Leaflet sets the
           marker z-index inline from the screen position; the resize handle always wins */
        .leaflet-marker-icon.gm-handle { opacity: 1 !important; }
        .leaflet-marker-icon.gm-handle::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; }
        .leaflet-marker-icon.gm-handle--move { z-index: 100000 !important; cursor: move; }
        .leaflet-marker-icon.gm-handle--resize,
        .leaflet-dragging .leaflet-marker-icon.gm-handle--resize { z-index: 100001 !important; cursor: nesw-resize; }
        .gm-handle-dot {
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            font-size: 12px;
            color: var(--gm-handle-color, var(--gm-accent));
            background: #ffffff;
            border: 3px solid var(--gm-handle-color, var(--gm-accent));
            border-radius: 50%;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
            transition: transform 0.1s;
        }
        .leaflet-marker-icon.gm-handle:hover .gm-handle-dot,
        .leaflet-marker-icon.gm-handle:active .gm-handle-dot { transform: scale(1.1); }
        .leaflet-marker-icon.gm-handle:focus { outline: none; }
        .leaflet-marker-icon.gm-handle:focus-visible .gm-handle-dot { outline: 2px solid var(--gm-accent); outline-offset: 2px; }

        /* Radius next to the resize handle while editing and next to the cursor while drawing */
        .leaflet-tooltip.gm-radius-label {
            padding: 3px 9px;
            font: 700 13px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            font-variant-numeric: tabular-nums;
            color: var(--gm-pill-fg);
            background: var(--gm-pill-bg);
            border: 0;
            border-radius: 999px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        }
        .leaflet-tooltip-right.gm-radius-label::before { border-right-color: var(--gm-pill-bg); }

        /* Permanent circle labels "BF6 · 683 km"; the tooltip box itself stays invisible */
        .leaflet-tooltip.gm-label { padding: 0; background: none; border: 0; box-shadow: none; }
        .gm-label-box {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 7px;
            font: 600 12px/1.25 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            color: #1f2328;
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.88);
            border-left: 3px solid;
            border-radius: 3px;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.3);
        }
        .gm-chip {
            padding: 0 6px;
            font: 700 10px/16px system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: var(--gm-chip-fg);
            background: var(--gm-chip-bg);
            border-radius: 999px;
        }
        .gm-label-box[hidden], .gm-chip[hidden] { display: none; }

        /* Selection bar: a fixed strip below the map while a circle is selected */
        .gm-sel-bar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1001;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 14px;
            box-sizing: border-box;
            min-height: 48px;
            padding: 7px 12px;
            font: var(--gm-font);
            color: var(--gm-fg);
            background: var(--gm-bg);
            box-shadow: 0 -1px 5px rgba(0, 0, 0, 0.3);
            cursor: default;
        }
        .gm-sel-bar[hidden] { display: none; }
        .gm-sel-dot { flex: none; width: 12px; height: 12px; margin-right: -8px; border-radius: 50%; background: var(--gm-handle-color, var(--gm-accent)); }
        .gm-sel-radius { display: inline-flex; align-items: center; gap: 6px; }
        .gm-sel-radius input {
            box-sizing: border-box;
            width: 7.5em;
            min-height: 30px;
            padding: 3px 6px;
            font: inherit;
            font-variant-numeric: tabular-nums;
            color: var(--gm-fg);
            background: var(--gm-bg);
            border: 1px solid var(--gm-border);
            border-radius: 4px;
        }
        .gm-sel-radius input:focus-visible { outline: 2px solid var(--gm-accent); outline-offset: 1px; }
        .gm-sel-radius input[aria-invalid="true"] { border-color: var(--gm-danger); outline-color: var(--gm-danger); }
        .gm-sel-center { font-weight: 400; font-variant-numeric: tabular-nums; color: var(--gm-muted); }
        .gm-sel-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: auto; }
        .gm-sel-delete { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
        .gm-bar-btn {
            min-height: 30px;
            padding: 3px 14px;
            font: inherit;
            color: var(--gm-fg);
            background: var(--gm-bg);
            border: 1px solid var(--gm-border);
            border-radius: 4px;
            cursor: pointer;
        }
        .gm-bar-btn:hover { background: var(--gm-hover); }
        .gm-bar-btn:focus-visible { outline: 2px solid var(--gm-accent); outline-offset: 2px; }
        .gm-bar-btn--primary, .gm-bar-btn--primary:hover { color: var(--gm-accent-fg); background: var(--gm-accent); border-color: var(--gm-accent); }
        .gm-bar-btn--danger { color: var(--gm-danger); border-color: var(--gm-danger); }
        .gm-bar-btn--danger-solid, .gm-bar-btn--danger-solid:hover { color: var(--gm-danger-fg); background: var(--gm-danger); border-color: var(--gm-danger); }
        @media (pointer: coarse) {
            .gm-bar-btn, .gm-sel-radius input { min-height: 40px; }
        }

        .custom-div-icon i {
            font-size: 20px;
        }

        /* Custom Cluster Icons */
        .marker-cluster {
            background-color: rgba(0, 0, 0, 0.3); /* Transparency */
            border-radius: 50%;
            color: white;
            display: flex; /* Flexbox for centering */
            align-items: center; /* Vertical centering */
            justify-content: center; /* Horizontal centering */
            font-weight: bold;
            font-size: 14px;
            line-height: 1;
            width: 40px; /* Width */
            height: 40px; /* Height */
        }
        .marker-cluster-allowed {
            background-color: rgba(0, 128, 0, 0.6); /* Green with higher transparency */
        }
        .marker-cluster-blocked {
            background-color: rgba(255, 0, 0, 0.6); /* Red with higher transparency */
        }
        .marker-cluster-mixed {
            background-color: rgba(255, 165, 0, 0.6); /* Orange with higher transparency */
        }
        .marker-cluster-allowed-ip {
            background-color: rgba(0, 0, 255, 0.6); /* Blue with higher transparency */
        }        

        /* Remove the icons within the clusters */
        .marker-cluster i {
            display: none;
        }

        /* Ensure that no additional margins or paddings are present */
        .marker-cluster div {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* Legend: a toggle button, above it the filter list, circle states and markers */
        .gm-legend {
            display: flex;
            flex-direction: column;
            max-width: 290px;
            font: 400 12px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--gm-fg);
            background: var(--gm-bg);
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
        }
        .gm-legend-body { max-height: min(60vh, 440px); overflow-y: auto; padding: 4px 10px 8px; }
        .gm-legend-body[hidden] { display: none; }
        .gm-legend-body h3 { margin: 8px 0 4px; font: var(--gm-font); }
        .gm-legend-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 36px;
            padding: 0 12px 0 10px;
            font: var(--gm-font);
            color: var(--gm-fg);
            background: var(--gm-bg);
            border: 0;
            border-radius: 4px;
            cursor: pointer;
        }
        .gm-legend-toggle:hover { background: var(--gm-hover); }
        .gm-legend-toggle:focus-visible { outline: 2px solid var(--gm-accent); outline-offset: -3px; }
        .gm-legend-toggle i { width: 16px; font-size: 15px; text-align: center; color: var(--gm-accent); }
        .gm-legend-toggle .gm-legend-chevron { margin-left: auto; font-size: 11px; color: var(--gm-muted); }
        .gm-legend-body:not([hidden]) + .gm-legend-toggle { border-top: 1px solid var(--gm-hover); border-radius: 0 0 4px 4px; }
        .gm-legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
        .gm-legend-swatch { flex: none; display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; }
        .gm-legend-swatch i { font-size: 16px; }
        .gm-legend-cluster { width: 16px; height: 16px; border-radius: 50%; }
        .gm-legend-ring {
            box-sizing: border-box;
            width: 16px;
            height: 16px;
            border: 3px solid var(--gm-muted);
            border-radius: 50%;
            background: rgba(87, 96, 106, 0.22);
        }
        .gm-legend-ring--disabled { border-width: 2px; border-style: dashed; background: rgba(87, 96, 106, 0.06); opacity: 0.8; }
        .gm-legend-ring--pending { border-style: dashed; }
        .gm-legend-ring--selected { border-width: 4px; background: rgba(87, 96, 106, 0.15); box-shadow: 0 0 4px rgba(0, 0, 0, 0.55); }
        .gm-legend-filters { margin: 0; padding: 0; list-style: none; }
        .gm-legend-filter { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
        .gm-legend-filter--hidden .gm-legend-fname { opacity: 0.5; }
        .gm-legend-dot { box-sizing: border-box; flex: none; width: 14px; height: 14px; border: 2px solid; border-radius: 50%; }
        .gm-legend-dot--disabled { border-style: dashed; background: transparent !important; }
        .gm-legend-fname { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; }
        .gm-legend-name { overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
        .gm-legend-meta { display: flex; align-items: center; gap: 5px; color: var(--gm-muted); }
        .gm-legend-empty { color: var(--gm-muted); }
        .gm-icon-btn {
            flex: none;
            width: 30px;
            height: 30px;
            padding: 0;
            font-size: 13px;
            color: var(--gm-fg);
            background: transparent;
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: pointer;
        }
        .gm-icon-btn:hover { background: var(--gm-hover); border-color: var(--gm-border); }
        .gm-icon-btn:focus-visible { outline: 2px solid var(--gm-accent); outline-offset: 0; }
        .gm-icon-btn[disabled] { color: var(--gm-disabled-fg); background: transparent; border-color: transparent; cursor: not-allowed; }
        @media (pointer: coarse) {
            .gm-legend-toggle { min-height: 44px; }
            .gm-icon-btn { width: 40px; height: 40px; }
        }

        /* Short messages from the parent, e.g. why a change was not staged */
        #gm-toast {
            display: none;
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1002;
            max-width: 80%;
            padding: 6px 12px;
            background: white;
            color: #333;
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
            font: 13px/1.4 sans-serif;
            pointer-events: none;   /* text only: clicks and drags reach the map and its controls */
        }
        #gm-toast .gm-toast-action {
            pointer-events: auto;   /* except its action button */
            margin-left: 8px;
            min-height: 28px;
            padding: 3px 12px;
            font: var(--gm-font);
            color: var(--gm-accent-fg);
            background: var(--gm-accent);
            border: 0;
            border-radius: 4px;
            cursor: pointer;
        }
        #gm-toast .gm-toast-action:focus-visible { outline: 2px solid var(--gm-fg); outline-offset: 2px; }
        @media (pointer: coarse) {
            #gm-toast .gm-toast-action { min-height: 40px; }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="gm-toast" role="status"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script>
        'use strict';

        var map, drawnItems;
        var readonly = true;    // until the parent says otherwise (setReadonly)
        var HOME_KEY = 'geomate-map-home';
        var LEGEND_KEY = 'geomate-map-legend';
        var DEFAULT_COLOR = '#666666';  // circles of a message without a filter color
        var home = { center: [51.505, -0.09], zoom: 4 };
        var toolbar = null;     // buttons of the map toolbar
        var modeBar = null;     // strip on top of the map that explains the current mode
        var selBar = null;      // nodes of the strip below the map while a circle is selected
        var legend = null;      // nodes of the legend that change
        var mode = null;        // null, 'draw', 'home' or 'edit'
        var drawTarget = null;  // filter Draw circle draws for (selectFilter); null disables Draw
        var drawHandler = null; // the running L.Draw.Circle
        var drawingFor = null;  // drawTarget when the running drawing started
        var drawEndedAt = 0;    // a click right after a drawing ends selects no circle
        var viewFitted = false; // the start view has been fitted to the regions
        var refitUntil = 0;     // until then a resize fits the start view again; user input ends it
        var radiusPill = null;  // radius at the resize handle (edit) or at the cursor (draw)

        /*
         * The selected circle, edited on its own: { layer, region, backup: { latlng, radius },
         * ghost, spoke, armed, deleteTimer }. region is its string at selection time, the ghost
         * shows the size it had then, the spoke runs from the centre to the resize handle.
         */
        var selection = null;

        // Filters of the last setFilters in config order: { sid, name, color, enabled, staged };
        // null until the parent has sent them
        var filters = null;
        var hiddenSids = {};    // filters whose circles the legend hides

        /*
         * Region identity lives in layer.gm, never in layer.options: Leaflet.draw's edit toolbar
         * saved and restored layer.options around every edit session.
         * gm = { token, sid, name, color, enabled, region, stored, inflight, staged, pending,
         *        selected, hover, deleting, label }
         * stored is the string the parent last confirmed for UCI; region is the newest string the
         * map reported, which the next action names. The parent matches regions on the string
         * alone and answers the actions in the order they were sent; inflight counts the open ones.
         * staged: the filter has staged changes (stagedSids, or an answer of the parent); pending:
         * a new circle waits for the parent; deleting: its delete waits for the parent.
         */
        var circles = {}; // token -> layer, kept until the parent has answered for it
        // Tokens differ between iframe loads, so a late answer never hits a circle of a new map
        var tokenPrefix = Math.random().toString(36).slice(2, 10) + '-';
        var toastTimer = null;

        /*
         * Edit handles of the selected circle: round, 28 px, a ring in the filter color, the
         * resize handle always above the move handle (CSS). Leaflet 1.9.4 reports L.Browser.touch
         * on desktop browsers too, and L.Edit.SimpleShape then takes the touch icons: set all four
         * before the first circle exists.
         */
        function handleIcon(kind, glyph, title) {
            return L.divIcon({
                className: 'gm-handle gm-handle--' + kind,
                iconSize: [28, 28],
                html: '<span class="gm-handle-dot" title="' + title + '"><i class="fa-solid ' + glyph + '" aria-hidden="true"></i></span>'
            });
        }
        var moveHandleIcon = handleIcon('move', 'fa-arrows-up-down-left-right', 'Drag to move the circle');
        var resizeHandleIcon = handleIcon('resize', 'fa-up-right-and-down-left-from-center', 'Drag to change the radius');
        L.Edit.Circle.mergeOptions({
            moveIcon: moveHandleIcon,
            resizeIcon: resizeHandleIcon,
            touchMoveIcon: moveHandleIcon,
            touchResizeIcon: resizeHandleIcon
        });

        // Define specialized icons for different marker types
        var blockedDivIcon = L.divIcon({
            html: '<i class="fa fa-exclamation-triangle" style="color: red;"></i>',
            iconSize: [25, 25],
            className: 'custom-div-icon'
        });

        var allowedConnectionIcon = L.divIcon({
            html: '<i class="fa fa-check-circle" style="color: green;"></i>',
            iconSize: [25, 25],
            className: 'custom-div-icon'
        });

        var allowedIPIcon = L.divIcon({
            html: '<i class="fa fa-user" style="color: blue;"></i>',
            iconSize: [25, 25],
            className: 'custom-div-icon'
        });

        var connectionMarkers = {};

        // Initialize MarkerCluster group with customized iconCreateFunction
        var markerClusters = L.markerClusterGroup({
            iconCreateFunction: function(cluster) {
                var markers = cluster.getAllChildMarkers();
                var allowed = 0;
                var blocked = 0;
                var allowedIPs = 0;

                markers.forEach(function(marker) {
                    if (marker.options.icon === allowedConnectionIcon) {
                        allowed += 1;
                    } else if (marker.options.icon === blockedDivIcon) {
                        blocked += 1;
                    } else if (marker.options.icon === allowedIPIcon) {
                        allowedIPs += 1;
                    }
                });

                var className = '';
                var html = '';

                if (allowed > 0 && blocked === 0 && allowedIPs === 0) {
                    className = 'marker-cluster marker-cluster-allowed';
                    html = size;
                } else if (blocked > 0 && allowed === 0 && allowedIPs === 0) {
                    className = 'marker-cluster marker-cluster-blocked';
                    html = size;
                } else if (allowedIPs > 0 && allowed === 0 && blocked === 0) {
                    className = 'marker-cluster marker-cluster-allowed-ip'; // Use the new class for Allowed IP Clusters

            window.parent.postMessage({ type: type, data: data }, location.origin);
        }

        /**
         * Shows a short message on top of the map.
         * @param {string} text - The message, shown as text.
         * @param {Object} [action] - { label, name, sid }: a button that sends toastAction { name, sid }.
         */
        function showToast(text, action) {

                div.appendChild(document.createTextNode(line));

        }

        /**
         * Updates the map with the latest connection data.
         * @param {Array} connections - An array of connection objects.
         */
        function updateConnections(connections) {
            // Remove old connection markers from the cluster group
            markerClusters.clearLayers();
            connectionMarkers = {};

            connections.forEach(function(conn) {
                if (!conn || !conn.geo) {
                    return;
                }

                var geo = conn.geo;
                var ip = conn.dst;
                var allowed = conn.allowed;
                var filterName = conn.filter_name;
                var isAllowedIP = conn.is_allowed_ip;

                if (geo.lat && geo.lon && !Array.isArray(geo.lat) && !Array.isArray(geo.lon)) {
                    var marker;
                    // Whitelisted IPs (allowed_ip) arrive here with is_allowed_ip
                    if (isAllowedIP) {
                        marker = L.marker([geo.lat, geo.lon], { icon: allowedIPIcon });
                        marker.bindPopup(popupContent(['Allowed IP: ' + ip, 'Filter: ' + filterName]));
                    } else if (allowed) {
                        marker = L.marker([geo.lat, geo.lon], { icon: allowedConnectionIcon });
                        marker.bindPopup(popupContent(['IP: ' + ip, 'Status: Allowed', 'Filter: ' + filterName]));
                    } else {
                        marker = L.marker([geo.lat, geo.lon], { icon: blockedDivIcon });
                        marker.bindPopup(popupContent(['IP: ' + ip, 'Status: Blocked', 'Filter: ' + filterName]));
                    }

                    connectionMarkers[ip] = marker;

            if (readonly) {

            }
            updateToolbar();

        // Home view: { center: [lat, lng], zoom }; the older map stored only [lat, lng] (zoom 4)

            var isLatLng = function(v) {
                return Array.isArray(v) && v.length === 2 && Number.isFinite(v[0]) && Number.isFinite(v[1]) &&
                    Math.abs(v[0]) <= 90 && Math.abs(v[1]) <= 180;
            };
            try {
                var v = JSON.parse(localStorage.getItem(HOME_KEY) || 'null');
                if (v && isLatLng(v.center) && Number.isFinite(v.zoom)) return { center: v.center, zoom: v.zoom };
                v = JSON.parse(localStorage.getItem('homePosition') || 'null');
                if (isLatLng(v)) return { center: v, zoom: 4 };
            } catch (e) {}
            return home;

            } else {

                if (!quiet) showToast('No regions yet: showing the home view.');
            }

         * maxBounds keeps the map on one world copy, so a smaller world leaves grey bands beside
         * it. The world is a square of 256 px at zoom 0 and doubles with every level (1024 px at
         * zoom 2, 2048 px at zoom 3). The height counts too: a map higher than wide (fullscreen
         * on an upright phone, a portrait monitor) would show bands above and below the world.
         * fitBounds stops at the lowest zoom; a map at least as wide as high still shows more
         * than half of the world's longitude there.

         * first added and keeps them; below that level it shows its empty top cluster as a "0"

        /**
         * Formats a radius for the mode bar, the pill and the labels: meters below 1 km,
         * one decimal below 10 km, whole km above.
         * @param {number} m - Radius in meters.

                return false;
            }
            showToast('Finish editing the selected circle first: Done or Cancel below the map.');
            return true;
        }

        /**

            a.setAttribute('role', 'button');
            a.setAttribute('aria-label', label);

            L.DomUtil.create('span', 'gm-btn-label', a).textContent = label;
            onTap(a, function() {

            }
            showPill(handle, formatDistance(layer.getRadius()));
            updateSelectionBar();
        }

        function barButton(parent, label, className, fn, title) {
            var b = L.DomUtil.create('button', 'gm-bar-btn' + (className ? ' ' + className : ''), parent);
            b.type = 'button';
            b.textContent = label;
            if (title) b.title = title;
            onTap(b, fn);
            return b;
        }

        // Radius for the km field: meter precision below 10 km, 100 m below 100 km, whole km above
        function kmValue(m) {
            return String(+(m / 1000).toFixed(m < 10000 ? 3 : m < 100000 ? 1 : 0));
        }

        // The strip below the map: filter, radius field, centre, Done, Cancel, Delete
        function createSelectionBar() {
            var box = L.DomUtil.create('div', 'gm-sel-bar', map.getContainer()), field, actions;

            box.hidden = true;
            box.setAttribute('role', 'group');
            box.setAttribute('aria-label', 'Selected circle');
            selBar = { box: box };
            L.DomUtil.create('span', 'gm-sel-dot', box);
            selBar.name = L.DomUtil.create('span', 'gm-sel-name', box);

            field = L.DomUtil.create('label', 'gm-sel-radius', box);
            L.DomUtil.create('span', '', field).textContent = 'Radius';
            selBar.radius = L.DomUtil.create('input', '', field);
            selBar.radius.type = 'number';
            selBar.radius.min = '0.001';
            selBar.radius.max = '20000';
            selBar.radius.step = 'any';
            selBar.radius.setAttribute('inputmode', 'decimal');
            selBar.radius.title = 'Radius in km; the circle follows at once';
            L.DomUtil.create('span', '', field).textContent = 'km';
            L.DomEvent.on(selBar.radius, 'input', onRadiusInput);
            L.DomEvent.on(selBar.radius, 'keydown', function(e) {
                if (e.key === 'Enter') {
                    L.DomEvent.preventDefault(e);
                    endSelection(true);
                }
            });

            selBar.center = L.DomUtil.create('span', 'gm-sel-center', box);
            selBar.center.title = 'Centre: latitude, longitude';

            actions = L.DomUtil.create('span', 'gm-sel-actions', box);
            barButton(actions, 'Done', 'gm-bar-btn--primary', function() { endSelection(true); },
                'Keep the change; it is staged like every region change');
            barButton(actions, 'Cancel', '', function() { endSelection(false); }, 'Undo the changes of this edit (Esc)');
            selBar.del = L.DomUtil.create('span', 'gm-sel-delete', actions);

            L.DomEvent.disableClickPropagation(box);
            L.DomEvent.disableScrollPropagation(box);
        }

        function showSelectionBar() {
            selBar.name.textContent = filterLabel(selection.layer.gm);
            renderDeleteButton(false);
            selBar.box.hidden = false;
            layoutBars();
        }

        function hideSelectionBar() {
            selBar.box.hidden = true;
            layoutBars();
        }

        // Radius and centre in the bar; the field keeps what the user is typing
        function updateSelectionBar() {
            var layer = selection.layer, c = layer.getLatLng().wrap();
            if (document.activeElement !== selBar.radius) {
                selBar.radius.value = kmValue(layer.getRadius());
                selBar.radius.removeAttribute('aria-invalid');
            }
            selBar.center.textContent = c.lat.toFixed(4) + ', ' + c.lng.toFixed(4);
        }

        // The radius field applies at once; values outside 1 m .. 20000 km are marked, not applied
        function onRadiusInput() {
            var s = selection, m = Math.round(selBar.radius.valueAsNumber * 1000);
            if (!s) return;
            if (!(m >= 1 && m <= 20000000)) {
                selBar.radius.setAttribute('aria-invalid', 'true');
                return;
            }
            selBar.radius.removeAttribute('aria-invalid');
            s.layer.setRadius(m);
            // New handles at the new edge; their color comes from the container
            if (s.layer.editing.enabled()) s.layer.editing.updateMarkers();
            updateEditVisuals(s.layer);
        }

        /**
         * Delete in two steps: the first click asks "Delete 'BF6 · 683 km'? Yes / No",
         * which falls back to Delete after 5 s.
         * @param {boolean} armed - Show the question instead of the Delete button.
         */
        function renderDeleteButton(armed) {
            var s = selection, box = selBar.del, hadFocus = box.contains(document.activeElement), gm, no;
            if (!s) return;
            clearTimeout(s.deleteTimer);
            s.armed = armed;
            box.textContent = '';
            if (!armed) {
                no = barButton(box, 'Delete', 'gm-bar-btn--danger', function() { renderDeleteButton(true); },
                    'Delete this circle; asks once more');
            } else {
                gm = s.layer.gm;
                L.DomUtil.create('span', '', box).textContent =
                    "Delete '" + (gm.name || gm.sid) + ' · ' + formatDistance(s.backup.radius) + "'?";
                barButton(box, 'Yes', 'gm-bar-btn--danger-solid', requestDelete);
                no = barButton(box, 'No', '', function() { renderDeleteButton(false); });
                s.deleteTimer = setTimeout(function() {
                    if (selection === s) renderDeleteButton(false);
                }, 5000);
            }
            // Keyboard users stay in the bar, on the harmless button
            if (hadFocus) no.focus();
        }

        /**
         * Yes in the bar. The circle keeps the geometry UCI has and stays on the map, faded,
         * until the parent removes it (regionRemoved) or keeps it (regionRejected); for the
         * last circle of a filter the parent first asks what happens to the filter.
         */
        function requestDelete() {
            var layer = selection && selection.layer;
            if (!layer) return;
            endSelection(false);
            layer.gm.deleting = true;
            applyState(layer);
            reportDelete(layer);
        }

        // Click on the map: the selected circle keeps its changes, like Done. A handle pressed
        // without dragging also reaches the map as a click; it keeps the selection.
        function onMapClick(e) {
            var t = e.originalEvent && e.originalEvent.target;
            if (t && t.closest && t.closest('.gm-handle')) return;
            if (mode === 'edit') endSelection(true);
        }

        // Circles of a filter that the parent has confirmed, also hidden ones
        function eachCircle(sid, fn) {
            Object.keys(circles).forEach(function(token) {
                var layer = circles[token];
                if (layer.gm.sid === sid && !layer.gm.pending) fn(layer);
            });
        }

        function filterBySid(sid) {
            return (filters || []).filter(function(f) { return f.sid === sid; })[0] || null;
        }

        /**
         * Shows or hides the circles of a filter (eye in the legend). Hidden circles leave
         * drawnItems, so Fit all skips them; a selected one keeps its changes first.
         * @param {string} sid - The UCI section of the filter.
         * @param {boolean} visible - Show the circles.
         */
        function setFilterVisible(sid, visible) {
            if (visible) delete hiddenSids[sid]; else hiddenSids[sid] = true;
            eachCircle(sid, function(layer) {
                if (visible) {
                    drawnItems.addLayer(layer);
                } else {
                    if (selection && selection.layer === layer) endSelection(true);
                    drawnItems.removeLayer(layer);
                }
            });
            renderLegendFilters();
        }

        // Zooms to the circles of a filter (magnifier in the legend); hidden ones show again
        function fitFilter(sid) {
            var bounds = null;
            if (hiddenSids[sid]) setFilterVisible(sid, true);
            eachCircle(sid, function(layer) {
                var b = layer.getLatLng().toBounds(layer.getRadius() * 2);
                bounds = bounds ? bounds.extend(b) : b;
            });
            if (bounds) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });
        }

        function iconButton(parent, icon, label, key, fn) {
            var b = L.DomUtil.create('button', 'gm-icon-btn', parent);
            b.type = 'button';
            b.title = label;
            b.setAttribute('aria-label', label);
            b.setAttribute('data-key', key);
            L.DomUtil.create('i', 'fa-solid ' + icon, b).setAttribute('aria-hidden', 'true');
            onTap(b, fn);
            return b;
        }

        // Filter list of the legend: color, name, circle count, state, eye and magnifier
        function renderLegendFilters() {
            var ul, counts = {}, focused = null;
            if (!legend || !filters) return;
            ul = legend.filters;
            if (ul.contains(document.activeElement)) focused = document.activeElement.getAttribute('data-key');

            Object.keys(circles).forEach(function(token) {
                var gm = circles[token].gm;
                if (gm.sid && !gm.pending) counts[gm.sid] = (counts[gm.sid] || 0) + 1;
            });

            ul.textContent = '';
            if (!filters.length)
                L.DomUtil.create('li', 'gm-legend-empty', ul).textContent = 'No filters yet.';

            filters.forEach(function(f) {
                var li = L.DomUtil.create('li', 'gm-legend-filter', ul),
                    n = counts[f.sid] || 0, hidden = !!hiddenSids[f.sid], name = f.name || f.sid,
                    color = f.color || DEFAULT_COLOR, dot, text, meta, chip, eye, fit;

                if (hidden) L.DomUtil.addClass(li, 'gm-legend-filter--hidden');
                dot = L.DomUtil.create('span', 'gm-legend-dot' + (f.enabled ? '' : ' gm-legend-dot--disabled'), li);
                dot.style.borderColor = color;
                dot.style.background = color;
                text = L.DomUtil.create('span', 'gm-legend-fname', li);
                L.DomUtil.create('span', 'gm-legend-name', text).textContent = name;
                meta = L.DomUtil.create('span', 'gm-legend-meta', text);
                L.DomUtil.create('span', '', meta).textContent =
                    (n === 1 ? '1 circle' : n + ' circles') + (f.enabled ? '' : ' (disabled)');
                if (f.staged) {
                    chip = L.DomUtil.create('span', 'gm-chip', meta);
                    chip.textContent = 'pending';
                    chip.title = 'Staged: active after Save & Apply, lost on logout or session expiry';
                }
                eye = iconButton(li, hidden ? 'fa-eye-slash' : 'fa-eye',
                    (hidden ? 'Show the circles of ' : 'Hide the circles of ') + name, f.sid + ' eye',
                    function() { setFilterVisible(f.sid, hidden); });
                eye.setAttribute('aria-pressed', hidden ? 'false' : 'true');
                fit = iconButton(li, 'fa-magnifying-glass', 'Zoom to the circles of ' + name, f.sid + ' fit',
                    function() { fitFilter(f.sid); });
                eye.disabled = fit.disabled = !n;
            });

            if (focused) {
                Array.prototype.forEach.call(ul.querySelectorAll('button'), function(b) {
                    if (b.getAttribute('data-key') === focused) b.focus();
                });
            }
        }

        // One row of the legend: a swatch and a text; returns the swatch
        function legendItem(parent, text) {
            var row = L.DomUtil.create('div', 'gm-legend-item', parent),
                swatch = L.DomUtil.create('span', 'gm-legend-swatch', row);
            L.DomUtil.create('span', '', row).textContent = text;
            return swatch;
        }

        // Open unless the visitor closed it; on narrow maps and phones closed by default
        function legendStartsOpen() {
            var v = null;
            try { v = localStorage.getItem(LEGEND_KEY); } catch (e) {}
            if (v === 'open' || v === 'closed') return v === 'open';
            return !(map.getSize().x < 900 || L.Browser.mobile);
        }

        function setLegendOpen(open, remember) {
            legend.body.hidden = !open;
            legend.toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
            legend.toggle.title = open ? 'Hide the legend' : 'Show the legend';
            legend.chevron.className = 'fa-solid gm-legend-chevron ' + (open ? 'fa-chevron-down' : 'fa-chevron-up');
            if (remember) {
                try { localStorage.setItem(LEGEND_KEY, open ? 'open' : 'closed'); } catch (e) {}
            }
        }

        /**
         * An open legend closes while a circle is drawn or selected: it covers the corner where
         * the resize handle often ends up. It opens again afterwards, unless the user toggled it
         * meanwhile; the stored preference stays as it is.
         * @param {boolean} on - Drawing or editing starts (true) or ends (false).
         */
        function holdLegend(on) {
            if (!legend) return;
            if (on && !legend.held && !legend.body.hidden) {
                legend.held = true;
                setLegendOpen(false, false);
            } else if (!on && legend.held) {
                legend.held = false;
                setLegendOpen(true, false);
            }
        }

        var GmLegend = L.Control.extend({
            options: { position: 'bottomright' },
            onAdd: function() {
                var box = L.DomUtil.create('div', 'gm-legend'),
                    body = L.DomUtil.create('div', 'gm-legend-body', box),
                    toggle = L.DomUtil.create('button', 'gm-legend-toggle', box);

                legend = { body: body, toggle: toggle };
                body.id = 'gm-legend-body';

                L.DomUtil.create('h3', '', body).textContent = 'Filters';
                legend.filters = L.DomUtil.create('ul', 'gm-legend-filters', body);

                L.DomUtil.create('h3', '', body).textContent = 'Circles';
                [
                    ['enabled', 'Enabled filter'],
                    ['disabled', 'Disabled filter: filters nothing'],
                    ['pending', 'Pending: staged, active after Save & Apply'],
                    ['selected', 'Selected for editing']
                ].forEach(function(s) {
                    L.DomUtil.create('span', 'gm-legend-ring gm-legend-ring--' + s[0], legendItem(body, s[1]));
                });

                L.DomUtil.create('h3', '', body).textContent = 'Connections';
                [
                    ['fa-check-circle', 'green', 'Allowed connection (within a region)'],
                    ['fa-exclamation-triangle', 'red', 'Blocked connection (outside the regions)'],
                    ['fa-user', 'blue', 'Allowed IP (whitelist)']
                ].forEach(function(m) {
                    var i = L.DomUtil.create('i', 'fa ' + m[0], legendItem(body, m[2]));
                    i.style.color = m[1];
                    i.setAttribute('aria-hidden', 'true');
                });
                [
                    ['rgba(0, 128, 0, 0.6)', 'Several allowed connections'],
                    ['rgba(255, 0, 0, 0.6)', 'Several blocked connections'],
                    ['rgba(0, 0, 255, 0.6)', 'Several allowed IPs'],
                    ['rgba(255, 165, 0, 0.6)', 'Mixed connection types']
                ].forEach(function(c) {
                    L.DomUtil.create('span', 'gm-legend-cluster', legendItem(body, c[1])).style.background = c[0];
                });

                toggle.type = 'button';
                toggle.setAttribute('aria-controls', body.id);
                L.DomUtil.create('i', 'fa-solid fa-circle-info', toggle).setAttribute('aria-hidden', 'true');
                L.DomUtil.create('span', '', toggle).textContent = 'Legend';
                legend.chevron = L.DomUtil.create('i', '', toggle);
                legend.chevron.setAttribute('aria-hidden', 'true');
                onTap(toggle, function() {
                    legend.held = false;
                    setLegendOpen(body.hidden, true);
                });

                L.DomEvent.disableClickPropagation(box);
                L.DomEvent.disableScrollPropagation(box);
                return box;
            }
        });

        /**
         * Initializes the map and its components.
         */
        function initMap() {
            home = loadHome();

            map = L.map('map', {
                center: home.center,
                zoom: home.zoom,
                drawControlTooltips: false,
                minZoom: 2,
                maxBounds: [[-90, -180], [90, 180]],
                maxBoundsViscosity: 1.0
            });

            // Add OpenStreetMap tiles to the map
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors',
                noWrap: true,
                bounds: [[-90, -180], [90, 180]]
            }).addTo(map);

            // The lowest zoom first: the MarkerCluster group takes it when it is added
            updateMinZoom();
            map.addLayer(markerClusters);

            // Map toolbar: Draw circle, Fit all, Home, Set home
            new GmToolbar().addTo(map);
            updateToolbar();

            modeBar = L.DomUtil.create('div', 'gm-mode-bar', map.getContainer());
            modeBar.hidden = true;
            modeBar.setAttribute('role', 'status');
            L.DomEvent.disableClickPropagation(modeBar);
            L.DomEvent.disableScrollPropagation(modeBar);
            // The bar wraps on narrow maps
            map.on('resize', layoutBars);
            map.on('resize', onMapResize);
            // Any input on the map keeps its view from now on: no more start view fitting
            ['pointerdown', 'mousedown', 'touchstart', 'wheel', 'keydown'].forEach(function(type) {
                map.getContainer().addEventListener(type, function() { refitUntil = 0; }, { capture: true, passive: true });
            });

            createSelectionBar();

            // Escape ends drawing, Set home, the delete question and the editing of a circle; registered once
            L.DomEvent.on(document, 'keydown', function(e) {
                if (e.key !== 'Escape') return;
                if (mode === 'draw') cancelDraw();
                else if (mode === 'home') stopSetHome();
                else if (selection && selection.armed) renderDeleteButton(false);
                else if (mode === 'edit') endSelection(false);
            });

            drawnItems = new L.FeatureGroup();
            map.addLayer(drawnItems);

            // Drawing through the map toolbar; editing and deleting per circle (selectCircle)
            map.on(L.Draw.Event.CREATED, onDrawCreated);
            map.on('draw:drawstart', onDrawStart);
            map.on('draw:drawstop', onDrawStop);
            map.on('gm:drawradius', function(e) {
                setModeExtra('r = ' + formatDistance(e.radius));
                showPill(e.latlng, formatDistance(e.radius));
            });
            map.on('draw:editmove draw:editresize', function(e) { updateEditVisuals(e.layer); });
            map.on('click', onMapClick);
            // Labels of circles that are small on screen hide
            map.on('zoomend', function() {
                Object.keys(circles).forEach(function(token) { showLabel(circles[token]); });
            });

            // Legend: filters with eye and magnifier, circle states, markers
            new GmLegend().addTo(map);
            setLegendOpen(legendStartsOpen(), false);
            renderLegendFilters();

            // Notify parent frame that the map is ready
            post('mapReady');
        }

        /**
         * Builds the region string of a circle as UCI stores it.
         * @param {Object} layer - The circle layer.
         * @returns {string} - circle:<lat>:<lon>:<radius in meters>
         */
        function regionString(layer) {
            var center = layer.getLatLng().wrap();
            return 'circle:' + center.lat.toFixed(8) + ':' + center.lng.toFixed(8) + ':' + Math.round(layer.getRadius());
        }

        /**
         * Moves a circle drawn or dragged past the antimeridian back into -180..180,
         * where its region string puts it on the next load.
         * @param {Object} layer - The circle layer.
         */
        function wrapCenter(layer) {
            var center = layer.getLatLng(), wrapped = center.wrap();
            if (wrapped.lng !== center.lng) layer.setLatLng(wrapped);
        }

        /**
         * Parses a region string.
         * @param {string} region - The region string from UCI.
         * @returns {Object|null} - { lat, lng, radius } or null if it is not a valid circle.
         */
        function parseRegion(region) {
            var p = String(region).split(':');
            if (p.length !== 4 || p[0] !== 'circle' || p.slice(1).some(function(x) { return !x.trim(); }))
                return null;
            var lat = Number(p[1]), lng = Number(p[2]), radius = Number(p[3]);
            if (!Number.isFinite(lat) || !Number.isFinite(lng) || !Number.isFinite(radius) ||
                Math.abs(lat) > 90 || Math.abs(lng) > 180 || radius <= 0)
                return null;
            return { lat: lat, lng: lng, radius: radius };
        }

        /**
         * Sets style, classes and label of a circle from its layer.gm state: enabled, disabled
         * (dashed, pale, desaturated), pending (staged; dashed with a chip), new (waits for the
         * parent), deleting, selected (thicker, shadow) and hover (one pixel thicker).
         * @param {Object} layer - The circle layer.
         */
        function applyState(layer) {
            var gm = layer.gm, color = gm.color || DEFAULT_COLOR, style;

            // weight and opacity also reset what the draw handler's shapeOptions set
            if (gm.pending) {
                style = { weight: 3, opacity: 1, fillOpacity: 0.1, dashArray: '6,6' };
            } else if (gm.deleting) {
                style = { weight: 2, opacity: 0.5, fillOpacity: 0.04, dashArray: '2,6' };
            } else if (!gm.enabled) {
                style = { weight: 2, opacity: 0.8, fillOpacity: 0.06, dashArray: '4,8' };
            } else {
                style = { weight: 3, opacity: 1, fillOpacity: 0.22, dashArray: gm.staged ? '10,6' : null };
            }
            if (gm.selected) L.extend(style, { weight: 4, opacity: 1, fillOpacity: 0.15, dashArray: '8,6' });
            else if (gm.hover) style.weight += 1;
            style.color = style.fillColor = color;

            layer.setStyle(style);
            applyClasses(layer);
            updateLabel(layer);
        }

        /**
         * State classes on the circle's SVG path. setStyle() cannot set them: Leaflet reads
         * options.className only when it creates the path, and it creates a new path every time
         * the circle is added to the map again ('add' calls this again).
         * @param {Object} layer - The circle layer.
         */
        function applyClasses(layer) {
            var el = layer.getElement(), gm = layer.gm;
            var set = function(name, on) { L.DomUtil[on ? 'addClass' : 'removeClass'](el, name); };
            if (!el) return;
            set('gm-circle', true);
            set('gm-circle--new', !!gm.pending);
            set('gm-circle--disabled', !gm.pending && !gm.enabled);
            set('gm-circle--pending', !gm.pending && !!gm.staged);
            set('gm-circle--deleting', !!gm.deleting);
            set('gm-circle--selected', !!gm.selected);
        }

        /**
         * Permanent label in the centre: "BF6 · 683 km", "(disabled)", a chip for pending,
         * new and deleting circles. The label element is built once and changed in place.
         * @param {Object} layer - The circle layer.
         */
        function updateLabel(layer) {
            var gm = layer.gm, lb = gm.label, text, chip, changed;

            if (!lb) {
                lb = gm.label = { box: document.createElement('span') };
                lb.box.className = 'gm-label-box';
                lb.text = L.DomUtil.create('span', '', lb.box);
                lb.chip = L.DomUtil.create('span', 'gm-chip', lb.box);
                layer.bindTooltip(lb.box, { permanent: true, direction: 'center', className: 'gm-label', opacity: 1 });
            }

            text = (gm.pending ? (gm.name || 'New circle') : (gm.name || gm.sid)) + ' · ' + formatDistance(layer.getRadius()) +
                (!gm.pending && !gm.enabled ? ' (disabled)' : '');
            chip = gm.deleting ? 'deleting' : gm.pending ? 'new' : gm.staged ? 'pending' : '';
            changed = lb.text.textContent !== text || lb.chip.textContent !== chip;

            lb.box.style.borderLeftColor = gm.color || DEFAULT_COLOR;
            lb.text.textContent = text;
            lb.chip.textContent = chip;
            lb.chip.hidden = !chip;
            showLabel(layer, changed);
        }

        /**
         * Hides the label of a circle that is small on screen (radius below 30 px), selected
         * (its centre holds the move handle) or not on the map.
         * @param {Object} layer - The circle layer.
         * @param {boolean} [changed] - The text changed: center the label again.
         */
        function showLabel(layer, changed) {
            var lb = layer.gm.label, tooltip = layer.getTooltip(), hide;
            if (!lb) return;
            hide = !!layer.gm.selected || !layer._map || screenRadius(layer) < 30;
            if (lb.box.hidden === hide && !changed) return;
            lb.box.hidden = hide;
            // The tooltip centers itself by its size, which the text and hiding change
            if (!hide && tooltip && tooltip.isOpen()) tooltip.update();
        }

        function onCircleHover(e) {
            this.gm.hover = (e.type === 'mouseover');
            applyState(this);
        }

        function onCircleAdd() {
            applyClasses(this);
            showLabel(this, true);
        }

        /**
         * Gives a circle its identity and its event handlers, and shows its state.
         * @param {Object} layer - The circle layer.
         * @param {Object} gm - layer.gm without the token.
         */
        function trackCircle(layer, gm) {
            gm.token = tokenPrefix + L.stamp(layer);
            layer.gm = gm;
            circles[gm.token] = layer;
            // Before bindTooltip: the label is sized before the tooltip opens on 'add'
            layer.on({ click: onCircleClick, mouseover: onCircleHover, mouseout: onCircleHover, add: onCircleAdd });
            applyState(layer);
        }

        /**
         * Adds a region of a filter to the map, unless the legend hides the filter.
         * @param {Object} filter - { sid, name, color, enabled } from the parent.
         * @param {string} region - The region string from UCI.
         * @param {boolean} staged - The filter has staged changes.
         */
        function addRegion(filter, region, staged) {
            var c = parseRegion(region), layer;
            if (!c) {
                post('regionInvalid', { sid: filter.sid, region: region });
                return;
            }

            layer = L.circle([c.lat, c.lng], { radius: c.radius });
            trackCircle(layer, {
                sid: filter.sid,
                name: filter.name,
                color: filter.color,
                enabled: !!filter.enabled,
                region: region,
                stored: region,
                inflight: 0,
                staged: staged
            });
            if (!hiddenSids[filter.sid]) drawnItems.addLayer(layer);
        }

        /**
         * Replaces all filters and regions with the ones the parent sent.
         * @param {Object} data - { filters: [{ sid, name, color, enabled, regions }], stagedSids }
         */
        function setFilters(data) {
            var staged = {};
            (data.stagedSids || []).forEach(function(sid) { staged[sid] = true; });

            endSelection(false);
            drawnItems.clearLayers();
            circles = {};
            filters = [];
            (data.filters || []).forEach(function(filter) {
                if (!filter || !filter.sid) return;
                filters.push({ sid: filter.sid, name: filter.name, color: filter.color, enabled: !!filter.enabled, staged: !!staged[filter.sid] });
                (filter.regions || []).forEach(function(region) {
                    addRegion(filter, region, !!staged[filter.sid]);
                });
            });
            renderLegendFilters();

            // Start view: all regions, or the home view without any. The iframe may have changed
            // its size since the map measured it, and may still do so while the page settles
            if (!viewFitted) {
                viewFitted = true;
                map.invalidateSize();
                fitAll(true);
                refitUntil = Date.now() + 5000;
            }
        }

        /**
         * Updates a filter and the state of every circle of it.
         * @param {string} sid - The UCI section of the filter.
         * @param {Object} changes - Fields to merge into the filter and into layer.gm.
         */
        function updateFilter(sid, changes) {
            var f = filterBySid(sid);
            // A filter the modal has just created
            if (!f && filters && changes.name !== undefined) {
                f = { sid: sid, name: '', color: undefined, enabled: false, staged: false };
                filters.push(f);
            }
            if (f) L.extend(f, changes);

            Object.keys(circles).forEach(function(token) {
                var layer = circles[token];
                if (layer.gm.sid === sid) {
                    L.extend(layer.gm, changes);
                    applyState(layer);
                }
            });

            if (selection && selection.layer.gm.sid === sid) {
                map.getContainer().style.setProperty('--gm-handle-color', selection.layer.gm.color || DEFAULT_COLOR);
                selBar.name.textContent = filterLabel(selection.layer.gm);
            }
            renderLegendFilters();
        }

        function forget(token) {
            var layer = circles[token];
            delete circles[token];
            if (layer) {
                if (selection && selection.layer === layer) endSelection(false);
                if (drawnItems.hasLayer(layer)) drawnItems.removeLayer(layer);
            }
            renderLegendFilters();
        }

        /**
         * A new circle stays pending until the parent answers with regionSaved,
         * regionDiscarded or regionRejected. It shows the color of the filter it was drawn for.
         * @param {Object} event - The draw event object.
         */
        function onDrawCreated(event) {
            var layer = event.layer, target = drawingFor || {};
            // A click without a drag gives a circle that UCI cannot store (radius 0 m)
            if (Math.round(layer.getRadius()) < 1) {
                showToast('Drag to draw a circle.');
                return;
            }
            wrapCenter(layer);
            trackCircle(layer, {
                sid: null,
                name: target.isNew ? '' : (target.name || ''),
                color: target.color,
                region: regionString(layer),
                pending: true
            });
            drawnItems.addLayer(layer);
            // sid null: a new filter, the parent asks for its name
            post('regionDrawn', { token: layer.gm.token, region: layer.gm.region, sid: target.isNew ? null : (target.sid || null) });
        }

        /**
         * Reports a moved or resized circle with the string the parent knows it by.
         * Optimistic: a second edit before the answer names the new string.
         * @param {Object} layer - The circle layer.
         */
        function reportEdit(layer) {
            var gm = layer.gm, oldRegion = gm.region, region;
            wrapCenter(layer);
            region = regionString(layer);
            if (region === oldRegion) return;

            gm.region = region;
            gm.inflight++;
            post('regionEdited', { token: gm.token, sid: gm.sid, oldRegion: oldRegion, region: region });
        }

        /**
         * Reports a deleted circle. It stays on the map until the parent answers.
         * @param {Object} layer - The circle layer.
         */
        function reportDelete(layer) {
            var gm = layer.gm;
            gm.inflight++;
            post('regionDeleted', { token: gm.token, sid: gm.sid, oldRegion: gm.region });
        }

        /**
         * Answers of the parent to regionDrawn, regionEdited and regionDeleted.
         * @param {string} type - The message type.
         * @param {Object} d - The message data, always with a token.
         */
        function onRegionAnswer(type, d) {
            var layer = circles[d.token], gm = layer && layer.gm, c;
            if (!gm) return;

            if (gm.pending) {
                if (type !== 'regionSaved') {
                    forget(d.token);
                } else {
                    // A new circle cannot be selected before this answer, so it is unchanged
                    L.extend(gm, { sid: d.sid, region: d.region, stored: d.region, inflight: 0, pending: false });
                    updateFilter(d.sid, { name: d.name, color: d.color, enabled: !!d.enabled, staged: true });
                    // The user has just drawn for this filter: show its circles
                    if (hiddenSids[d.sid]) setFilterVisible(d.sid, true);
                }
            } else {
                gm.inflight--;
                if (type === 'regionRemoved') {
                    forget(d.token);
                    updateFilter(gm.sid, { staged: true });
                } else if (type === 'regionSaved') {
                    gm.stored = d.region;
                    updateFilter(d.sid, { name: d.name, color: d.color, enabled: !!d.enabled, staged: true });
                } else if (gm.deleting) {
                    // regionRejected after a delete: the circle stays
                    gm.deleting = false;
                    applyState(layer);
                }

                // With every answer in, the circle shows what UCI holds
                if (!gm.inflight && circles[d.token] && gm.region !== gm.stored) {
                    if (selection && selection.layer === layer) endSelection(false);
                    gm.region = gm.stored;
                    c = parseRegion(gm.stored);
                    if (c) {
                        layer.setLatLng([c.lat, c.lng]);
                        layer.setRadius(c.radius);
                        applyState(layer);
                    }
                }
            }

            if (type === 'regionRejected' && d.reason) showToast(d.reason);
        }

        /*
         * Messages between view.js (parent) and this map, { type, data }, same origin only.
         * map -> parent:
         *   mapReady          -
         *   drawState         { drawing }                      a drawing started or ended
         *   regionDrawn       { token, region, sid }           sid null: for a new filter
         *   regionEdited      { token, sid, oldRegion, region }
         *   regionDeleted     { token, sid, oldRegion }
         *   regionInvalid     { sid, region }
         *   toastAction       { name, sid }                    button in a toast, e.g. enableFilter
         * parent -> map:
         *   setReadonly       { readonly }                     no drawing or editing tools when true
         *   setFilters        { filters: [{ sid, name, color, enabled, regions }], stagedSids }
         *   selectFilter      { sid, name, color, enabled, isNew } or null: what Draw circle draws for
         *   startDraw         like selectFilter, then draw     ("Draw circle" above the map)
         *   cancelDraw        -
         *   filterChanged     { sid, name, color, enabled }    e.g. after "Enable filter"
         *   regionSaved       { token, sid, name, color, enabled, region }
         *   regionRemoved, regionDiscarded { token }; regionRejected { token, reason }
         *   toast             { text, action: { label, name, sid } }
         *   updateConnections [connection]
         */
        window.addEventListener('message', function(event) {
            if (event.origin !== location.origin || event.source !== window.parent || !event.data) return;

            var type = event.data.type, data = event.data.data;
            if (type === 'setFilters') {
                setFilters(data || {});
            } else if (type === 'updateConnections') {
                updateConnections(data || []);
            } else if (type === 'setReadonly') {
                setReadonly(!data || data.readonly !== false);
            } else if (type === 'selectFilter') {
                selectFilter(data || null);
            } else if (type === 'startDraw') {
                startDraw(data || null);
            } else if (type === 'cancelDraw') {
                cancelDraw();
            } else if (type === 'filterChanged' && data && data.sid) {
                updateFilter(data.sid, { name: data.name, color: data.color, enabled: !!data.enabled, staged: true });
            } else if (type === 'toast' && data && data.text) {
                var action = data.action;
                showToast(String(data.text), (action && action.name && action.label)
                    ? { label: String(action.label), name: String(action.name), sid: action.sid } : null);
            } else if (/^region(Saved|Removed|Discarded|Rejected)$/.test(type) && data) {
                onRegionAnswer(type, data);
            }
        }, false);

        // Initialize the map on page load
        initMap();
    </script>
</body>
</html>
