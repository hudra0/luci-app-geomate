<!DOCTYPE html>
<html>
<head>
    <title>Geomate Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Leaflet.markercluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <script>
        // Until the view sends the LuCI theme, the browser's color scheme picks the color set,
        // so the first paint is not white in a dark theme
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
            document.documentElement.setAttribute('data-theme', 'dark');
    </script>

    <style>
        html, body { margin: 0; }
        #map { height: 100vh; width: 100%; }

        /*
         * Colors of the map's own controls. The view sends the LuCI theme (message 'theme'):
         * data-theme on <html> picks the light or dark set below, inline values on <html>
         * replace bg, fg, border, accent, danger and success with the theme's own colors.
         */
        :root {
            color-scheme: light;
            --gm-bg: #ffffff;
            --gm-fg: #1f2328;
            --gm-hover: #eef1f4;
            --gm-disabled-bg: #f4f4f4;
            --gm-disabled-fg: #a0a6ad;
            --gm-accent: #1a6fd1;
            --gm-accent-fg: #ffffff;
            --gm-muted: #57606a;
            --gm-border: #8c959f;
            --gm-danger: #cf222e;
            --gm-danger-fg: #ffffff;
            --gm-success: #1a7f37;
            --gm-pill-bg: rgba(31, 35, 40, 0.9);
            --gm-pill-fg: #ffffff;
            --gm-label-bg: rgba(255, 255, 255, 0.88);
            --gm-label-fg: #1f2328;
            --gm-attribution-bg: rgba(255, 255, 255, 0.8);
            --gm-map-bg: #dddddd;
            --gm-font: 600 13px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --gm-bg: #1e1e1e;
            --gm-fg: #e6e6e6;
            --gm-hover: #333436;
            --gm-disabled-bg: #262626;
            --gm-disabled-fg: #6e7681;
            --gm-accent: #4c8eda;
            --gm-muted: #a0a6ad;
            --gm-border: #5c636a;
            --gm-danger: #f85149;
            --gm-success: #3fb950;
            --gm-pill-bg: rgba(240, 240, 240, 0.92);
            --gm-pill-fg: #1f2328;
            --gm-label-bg: rgba(30, 30, 30, 0.85);
            --gm-label-fg: #e6e6e6;
            --gm-attribution-bg: rgba(30, 30, 30, 0.8);
            --gm-map-bg: #2b2b2b;
        }

        /* Leaflet's own parts in the theme colors: zoom buttons, tooltips with their four
           arrows, popups, attribution, the area without tiles */
        .leaflet-container { background: var(--gm-map-bg); }
        .leaflet-bar a { color: var(--gm-fg); background-color: var(--gm-bg); border-bottom-color: var(--gm-border); }
        .leaflet-bar a:hover, .leaflet-bar a:focus { color: var(--gm-fg); background-color: var(--gm-hover); }
        .leaflet-bar a.leaflet-disabled { color: var(--gm-disabled-fg); background-color: var(--gm-disabled-bg); }
        .leaflet-tooltip { color: var(--gm-fg); background-color: var(--gm-bg); border-color: var(--gm-bg); }
        .leaflet-tooltip-top:before { border-top-color: var(--gm-bg); }
        .leaflet-tooltip-bottom:before { border-bottom-color: var(--gm-bg); }
        .leaflet-tooltip-left:before { border-left-color: var(--gm-bg); }
        .leaflet-tooltip-right:before { border-right-color: var(--gm-bg); }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { color: var(--gm-fg); background: var(--gm-bg); }
        .leaflet-container a.leaflet-popup-close-button { color: var(--gm-muted); }
        .leaflet-container a.leaflet-popup-close-button:hover,
        .leaflet-container a.leaflet-popup-close-button:focus { color: var(--gm-fg); }
        .leaflet-container .leaflet-control-attribution { color: var(--gm-muted); background: var(--gm-attribution-bg); }
        .leaflet-container .leaflet-control-attribution a { color: var(--gm-accent); }

        /* Dimmed dark tiles: a switch in the legend, off by default */
        html.gm-dark-tiles .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.9) saturate(0.6); }

        /* Connection marker popups: IP, status, filter, country, city, ISP */
        .gm-popup { min-width: 160px; font: 400 13px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
        .gm-popup-ip { font-weight: 700; font-variant-numeric: tabular-nums; }
        .gm-popup-status { margin: 2px 0 6px; font-weight: 600; }
        .gm-popup-status--allowed { color: var(--gm-success); }
        .gm-popup-status--blocked { color: var(--gm-danger); }
        .gm-popup-status--ip { color: var(--gm-accent); }
        .gm-popup-fields { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 0; }
        .gm-popup-fields dt { color: var(--gm-muted); }
        .gm-popup-fields dd { margin: 0; overflow-wrap: anywhere; }

        /* Map toolbar: labelled buttons in two groups (drawing, view) */
        .gm-toolbar { display: flex; flex-direction: column; gap: 10px; }
        .leaflet-bar.gm-toolbar-group { background: var(--gm-bg); }
        .leaflet-bar a.gm-btn,
        .leaflet-touch .leaflet-bar a.gm-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            box-sizing: border-box;
            width: auto;
            min-width: 36px;
            height: 36px;
            padding: 0 12px 0 10px;
            line-height: 1.2;
            font: var(--gm-font);
            text-align: left;
            white-space: nowrap;
            color: var(--gm-fg);
            background: var(--gm-bg);
        }
        .gm-btn i { width: 16px; font-size: 15px; text-align: center; }
        .gm-btn--draw i { color: var(--gm-accent); }
        .gm-btn i.gm-btn-caret { width: auto; margin-left: -2px; font-size: 11px; color: inherit; }
        .leaflet-bar a.gm-btn:hover { background: var(--gm-hover); color: var(--gm-fg); }
        .leaflet-bar a.gm-btn:focus { outline: none; }
        .leaflet-bar a.gm-btn:focus-visible { outline: 2px solid var(--gm-accent); outline-offset: -3px; }
        .leaflet-bar a.gm-btn.gm-btn--active,
        .leaflet-bar a.gm-btn.gm-btn--active:hover { background: var(--gm-accent); color: var(--gm-accent-fg); }
        .leaflet-bar a.gm-btn.gm-btn--active i { color: inherit; }
        .leaflet-bar a.gm-btn.leaflet-disabled,
        .leaflet-bar a.gm-btn.leaflet-disabled:hover { background: var(--gm-disabled-bg); color: var(--gm-disabled-fg); cursor: not-allowed; }
        .leaflet-bar a.gm-btn.leaflet-disabled i { color: inherit; }
        @media (pointer: coarse) {
            .leaflet-bar a.gm-btn,
            .leaflet-touch .leaflet-bar a.gm-btn { min-width: 44px; height: 44px; font-size: 14px; }
        }
        /* Narrow maps: icons only, the title attribute keeps the label */
        @media (max-width: 639px) {
            .gm-btn-label { display: none; }
            .leaflet-bar a.gm-btn,
            .leaflet-touch .leaflet-bar a.gm-btn { width: 36px; padding: 0; justify-content: center; }
        }
        @media (max-width: 639px) and (pointer: coarse) {
            .leaflet-bar a.gm-btn,
            .leaflet-touch .leaflet-bar a.gm-btn { width: 44px; }
        }

        /* Narrow maps: no caret either, the Draw circle button stays square */
        @media (max-width: 639px) {
            .gm-btn i.gm-btn-caret { display: none; }
        }

        /* Menu of the Draw circle button: the filters to draw for, then New filter. Next to the
           button, or below it on narrow maps; above the controls and the legend */
        .gm-draw-menu {
            position: absolute;
            z-index: 1002;
            box-sizing: border-box;
            min-width: 180px;
            max-width: calc(100% - 16px);
            overflow-y: auto;
            padding: 4px 0;
            font: var(--gm-font);
            color: var(--gm-fg);
            background: var(--gm-bg);
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
        }
        .gm-draw-menu[hidden] { display: none; }
        .gm-menu-title { padding: 6px 12px 4px; font-weight: 400; color: var(--gm-muted); }
        .gm-menu-item {
            display: flex;
            align-items: center;
            gap: 8px;
            box-sizing: border-box;
            width: 100%;
            min-height: 34px;
            padding: 4px 12px;
            font: inherit;
            text-align: left;
            color: inherit;
            background: transparent;
            border: 0;
            cursor: pointer;
        }
        .gm-menu-item:hover, .gm-menu-item:focus { background: var(--gm-hover); outline: none; }
        .gm-menu-item:focus-visible { outline: 2px solid var(--gm-accent); outline-offset: -2px; }
        .gm-menu-dot { flex: none; width: 12px; height: 12px; border-radius: 50%; }
        i.gm-menu-dot { font-size: 12px; line-height: 12px; text-align: center; color: var(--gm-accent); }
        .gm-menu-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .gm-menu-item--disabled .gm-menu-dot, .gm-menu-item--disabled .gm-menu-name { opacity: 0.5; }
        .gm-menu-note { flex: none; margin-left: auto; font-weight: 400; color: var(--gm-muted); }
        .gm-menu-sep { height: 1px; margin: 4px 0; background: var(--gm-border); opacity: 0.4; }
        @media (pointer: coarse) {
            .gm-menu-item { min-height: 44px; }
        }

        /* Mode bar: a fixed strip on top of the map while drawing or editing */
        .gm-mode-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1001;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 6px 12px;
            box-sizing: border-box;
            min-height: 40px;
            padding: 6px 12px;
            font: var(--gm-font);
            color: var(--gm-accent-fg);
            background: var(--gm-accent);
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
            cursor: default;
        }
        .gm-mode-bar[hidden] { display: none; }
        .gm-mode-swatch { flex: none; width: 12px; height: 12px; margin-right: -6px; border: 2px solid var(--gm-accent-fg); border-radius: 50%; }
        .gm-mode-extra:empty { display: none; }
        .gm-mode-extra { font-variant-numeric: tabular-nums; }
        .gm-mode-bar button {
            min-height: 28px;
            padding: 3px 14px;
            font: inherit;
            color: inherit;
            background: transparent;
            border: 1px solid currentColor;
            border-radius: 4px;
            cursor: pointer;
        }
        .gm-mode-bar button:hover { background: rgba(127, 127, 127, 0.25); }
        .gm-mode-bar button:focus-visible { outline: 2px solid var(--gm-accent-fg); outline-offset: 2px; }
        @media (pointer: coarse) {
            .gm-mode-bar button { min-height: 40px; }
        }

        /* Region circles: applyState() sets these classes next to the stroke and fill attributes */
        path.gm-circle { transition: fill-opacity 0.15s, stroke-width 0.15s; }
        path.gm-circle--disabled { filter: saturate(0.3); }
        path.gm-circle--selected { filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.55)); }
        .gm-readonly path.gm-circle { cursor: grab; }
        /* A mouse click shows no focus rectangle, the keyboard focus a ring in the accent color */
        .leaflet-container path.leaflet-interactive:focus:not(:focus-visible) { outline: none; }
        .leaflet-container path.leaflet-interactive:focus-visible { outline: 2px solid var(--gm-accent); outline-offset: 2px; }

        /* Edit handles of the selected circle (L.Edit.Circle icons): white, round, a ring in the
           filter color (--gm-handle-color on the map container), a hit area 8 px wider on every
           side (44 px around a 28 px handle). Leaflet sets the
           marker z-index inline from the screen position; the resize handle always wins */
        .leaflet-marker-icon.gm-handle { opacity: 1 !important; }
        .leaflet-marker-icon.gm-handle::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; }
        .leaflet-marker-icon.gm-handle--move { z-index: 100000 !important; cursor: move; }
        .leaflet-marker-icon.gm-handle--resize,
        .leaflet-dragging .leaflet-marker-icon.gm-handle--resize { z-index: 100001 !important; cursor: nesw-resize; }
        .gm-handle-dot {
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            font-size: 12px;
            color: var(--gm-handle-color, var(--gm-accent));
            background: #ffffff;
            border: 3px solid var(--gm-handle-color, var(--gm-accent));
            border-radius: 50%;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
            transition: transform 0.1s;
        }
        .leaflet-marker-icon.gm-handle:hover .gm-handle-dot,
        .leaflet-marker-icon.gm-handle:active .gm-handle-dot { transform: scale(1.1); }
        .leaflet-marker-icon.gm-handle:focus { outline: none; }
        .leaflet-marker-icon.gm-handle:focus-visible .gm-handle-dot { outline: 2px solid var(--gm-accent); outline-offset: 2px; }
        /* Touch screens: 36 px handles (HANDLE_SIZE) with a bigger glyph and ring */
        @media (pointer: coarse) {
            .gm-handle-dot { font-size: 15px; border-width: 4px; }
        }

        /* Radius next to the resize handle while editing and next to the cursor while drawing */
        .leaflet-tooltip.gm-radius-label {
            padding: 3px 9px;
            font: 700 13px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            font-variant-numeric: tabular-nums;
            color: var(--gm-pill-fg);
            background: var(--gm-pill-bg);
            border: 0;
            border-radius: 999px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
        }
        .leaflet-tooltip-right.gm-radius-label::before { border-right-color: var(--gm-pill-bg); }
        @media (pointer: coarse) {
            .leaflet-tooltip.gm-radius-label { padding: 5px 11px; font-size: 15px; }
        }

        /* Permanent circle labels with the filter name; the tooltip box itself stays invisible */
        .leaflet-tooltip.gm-label { padding: 0; background: none; border: 0; box-shadow: none; }
        .gm-label-box {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 2px 7px;
            font: 600 12px/1.25 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--gm-label-fg);
            white-space: nowrap;
            background: var(--gm-label-bg);
            border-left: 3px solid;
            border-radius: 3px;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.3);
        }
        .gm-label-box--disabled { opacity: 0.6; }
        .gm-label-box[hidden] { display: none; }

        /* Selection bar: a fixed strip below the map while a circle is selected */
        .gm-sel-bar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1001;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 14px;
            box-sizing: border-box;
            min-height: 48px;
            padding: 7px 12px;
            font: var(--gm-font);
            color: var(--gm-fg);
            background: var(--gm-bg);
            box-shadow: 0 -1px 5px rgba(0, 0, 0, 0.3);
            cursor: default;
        }
        .gm-sel-bar[hidden] { display: none; }
        .gm-sel-dot { flex: none; width: 12px; height: 12px; margin-right: -8px; border-radius: 50%; background: var(--gm-handle-color, var(--gm-accent)); }
        .gm-sel-radius { display: inline-flex; align-items: center; gap: 6px; }
        .gm-sel-radius input {
            box-sizing: border-box;
            width: 7.5em;
            min-height: 30px;
            padding: 3px 6px;
            font: inherit;
            font-variant-numeric: tabular-nums;
            color: var(--gm-fg);
            background: var(--gm-bg);
            border: 1px solid var(--gm-border);
            border-radius: 4px;
        }
        .gm-sel-radius input:focus-visible { outline: 2px solid var(--gm-accent); outline-offset: 1px; }
        .gm-sel-radius input[aria-invalid="true"] { border-color: var(--gm-danger); outline-color: var(--gm-danger); }
        .gm-sel-center { font-weight: 400; font-variant-numeric: tabular-nums; color: var(--gm-muted); }
        .gm-sel-count { font-weight: 400; font-variant-numeric: tabular-nums; }
        .gm-sel-count:empty { display: none; }
        .gm-sel-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-left: auto; }
        .gm-sel-delete { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
        .gm-bar-btn {
            min-height: 30px;
            padding: 3px 14px;
            font: inherit;
            color: var(--gm-fg);
            background: var(--gm-bg);
            border: 1px solid var(--gm-border);
            border-radius: 4px;
            cursor: pointer;
        }
        .gm-bar-btn:hover { background: var(--gm-hover); }
        .gm-bar-btn:focus-visible { outline: 2px solid var(--gm-accent); outline-offset: 2px; }
        .gm-bar-btn--primary, .gm-bar-btn--primary:hover { color: var(--gm-accent-fg); background: var(--gm-accent); border-color: var(--gm-accent); }
        .gm-bar-btn--danger { color: var(--gm-danger); border-color: var(--gm-danger); }
        .gm-bar-btn--danger-solid, .gm-bar-btn--danger-solid:hover { color: var(--gm-danger-fg); background: var(--gm-danger); border-color: var(--gm-danger); }
        @media (pointer: coarse) {
            .gm-bar-btn, .gm-sel-radius input { min-height: 40px; }
        }
        /* Phones: the server counter and the buttons each get a row of their own below filter,
           radius and centre */
        @media (max-width: 479px) {
            .gm-sel-bar { gap: 6px 10px; padding: 6px 8px; }
            .gm-sel-count { flex-basis: 100%; font-size: 12px; }
            .gm-sel-actions { flex-basis: 100%; margin-left: 0; }
            .gm-sel-actions > .gm-bar-btn { flex: 1 1 auto; }
            .gm-sel-center { font-size: 12px; }
        }

        .custom-div-icon i {
            font-size: 20px;
        }

        /* Custom Cluster Icons */
        .marker-cluster {
            background-color: rgba(0, 0, 0, 0.3); /* Transparency */
            border-radius: 50%;
            color: white;
            display: flex; /* Flexbox for centering */
            align-items: center; /* Vertical centering */
            justify-content: center; /* Horizontal centering */
            font-weight: bold;
            font-size: 14px;
            line-height: 1;
            width: 40px; /* Width */
            height: 40px; /* Height */
        }
        .marker-cluster-allowed {
            background-color: rgba(0, 128, 0, 0.6); /* Green with higher transparency */
        }
        .marker-cluster-blocked {
            background-color: rgba(255, 0, 0, 0.6); /* Red with higher transparency */
        }
        .marker-cluster-mixed {
            background-color: rgba(255, 165, 0, 0.6); /* Orange with higher transparency */
        }
        .marker-cluster-allowed-ip {
            background-color: rgba(0, 0, 255, 0.6); /* Blue with higher transparency */
        }        

        /* Remove the icons within the clusters */
        .marker-cluster i {
            display: none;
        }

        /* Ensure that no additional margins or paddings are present */
        .marker-cluster div {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        /* Legend: a toggle button, above it the filter list, circle states and markers */
        .gm-legend {
            display: flex;
            flex-direction: column;
            max-width: 290px;
            font: 400 12px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--gm-fg);
            background: var(--gm-bg);
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
        }
        .gm-legend-body { max-height: min(60vh, 440px); overflow-y: auto; padding: 4px 10px 8px; }
        .gm-legend-body[hidden] { display: none; }
        .gm-legend-body h3 { margin: 8px 0 4px; font: var(--gm-font); }
        .gm-legend-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 36px;
            padding: 0 12px 0 10px;
            font: var(--gm-font);
            color: var(--gm-fg);
            background: var(--gm-bg);
            border: 0;
            border-radius: 4px;
            cursor: pointer;
        }
        .gm-legend-toggle:hover { background: var(--gm-hover); }
        .gm-legend-toggle:focus-visible { outline: 2px solid var(--gm-accent); outline-offset: -3px; }
        .gm-legend-toggle i { width: 16px; font-size: 15px; text-align: center; color: var(--gm-accent); }
        .gm-legend-toggle .gm-legend-chevron { margin-left: auto; font-size: 11px; color: var(--gm-muted); }
        .gm-legend-body:not([hidden]) + .gm-legend-toggle { border-top: 1px solid var(--gm-hover); border-radius: 0 0 4px 4px; }
        .gm-legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
        .gm-legend-swatch { flex: none; display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; }
        .gm-legend-swatch i { font-size: 16px; }
        .gm-legend-cluster { width: 16px; height: 16px; border-radius: 50%; }
        .gm-legend-ring {
            box-sizing: border-box;
            width: 16px;
            height: 16px;
            border: 3px solid var(--gm-muted);
            border-radius: 50%;
            background: rgba(87, 96, 106, 0.22);
        }
        .gm-legend-ring--disabled { border-width: 2px; background: rgba(87, 96, 106, 0.05); opacity: 0.5; }
        .gm-legend-ring--selected { border-width: 4px; background: rgba(87, 96, 106, 0.15); box-shadow: 0 0 4px rgba(0, 0, 0, 0.55); }
        .gm-legend-filters { margin: 0; padding: 0; list-style: none; }
        .gm-legend-filter { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
        .gm-legend-filter--hidden .gm-legend-fname { opacity: 0.5; }
        .gm-legend-dot { box-sizing: border-box; flex: none; width: 14px; height: 14px; border: 2px solid; border-radius: 50%; }
        .gm-legend-dot--disabled { opacity: 0.45; }
        .gm-legend-fname { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; }
        .gm-legend-name { overflow: hidden; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
        .gm-legend-meta { display: flex; align-items: center; gap: 5px; color: var(--gm-muted); }
        .gm-legend-empty { color: var(--gm-muted); }
        .gm-icon-btn {
            flex: none;
            width: 30px;
            height: 30px;
            padding: 0;
            font-size: 13px;
            color: var(--gm-fg);
            background: transparent;
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: pointer;
        }
        .gm-icon-btn:hover { background: var(--gm-hover); border-color: var(--gm-border); }
        .gm-icon-btn:focus-visible { outline: 2px solid var(--gm-accent); outline-offset: 0; }
        .gm-icon-btn[disabled] { color: var(--gm-disabled-fg); background: transparent; border-color: transparent; cursor: not-allowed; }
        .gm-icon-btn.gm-icon-btn--on, .gm-icon-btn.gm-icon-btn--on:hover { color: var(--gm-accent-fg); background: var(--gm-accent); border-color: var(--gm-accent); }
        .gm-legend-server { box-sizing: border-box; width: 11px; height: 11px; border: 1px solid #ffffff; border-radius: 50%; background: var(--gm-muted); box-shadow: 0 0 0 1px var(--gm-muted); }
        .gm-legend-switch { display: flex; align-items: center; gap: 8px; margin: 4px 0; cursor: pointer; }
        .gm-legend-switch input { width: 16px; height: 16px; margin: 0; accent-color: var(--gm-accent); }
        @media (pointer: coarse) {
            .gm-legend-toggle { min-height: 44px; }
            .gm-icon-btn { width: 40px; height: 40px; }
        }

        /* Short messages from the parent, e.g. Applied with Undo, or why a change was not applied */
        #gm-toast {
            display: none;
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1002;
            max-width: 80%;
            padding: 6px 12px;
            background: var(--gm-bg);
            color: var(--gm-fg);
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.4);
            font: 13px/1.4 sans-serif;
            pointer-events: none;   /* text only: clicks and drags reach the map and its controls */
        }
        #gm-toast .gm-toast-action {
            pointer-events: auto;   /* except its action button */
            margin-left: 8px;
            min-height: 28px;
            padding: 3px 12px;
            font: var(--gm-font);
            color: var(--gm-accent-fg);
            background: var(--gm-accent);
            border: 0;
            border-radius: 4px;
            cursor: pointer;
        }
        #gm-toast .gm-toast-action:focus-visible { outline: 2px solid var(--gm-fg); outline-offset: 2px; }
        @media (pointer: coarse) {
            #gm-toast .gm-toast-action { min-height: 40px; }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="gm-toast" role="status"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script>
        'use strict';

        var map, drawnItems;
        var readonly = true;    // until the parent says otherwise (setReadonly)
        var HOME_KEY = 'geomate-map-home';
        var LEGEND_KEY = 'geomate-map-legend';
        var DARK_TILES_KEY = 'geomate-map-dark-tiles';
        var DEFAULT_COLOR = '#666666';  // circles of a message without a filter color
        // Space kept free around fitted circles, in pixels. Pixels and the same on every side: a
        // padding in degrees (LatLngBounds.pad) moves the Mercator centre of the bounds north,
        // and at the lowest zoom the view stays centred on the padded bounds and cuts the south
        var FIT_PADDING = [40, 40];
        var fullscreen = false; // the view shows the map in the whole window
        var DEFAULT_VIEW = { center: [51.505, -0.09], zoom: 4 };   // without home view and circles
        var home = null;        // home view saved in this browser: { center, zoom }, or null
        var toolbar = null;     // buttons of the map toolbar
        var modeBar = null;     // strip on top of the map that explains the current mode
        var selBar = null;      // nodes of the strip below the map while a circle is selected
        var legend = null;      // nodes of the legend that change
        var mode = null;        // null, 'draw' or 'edit'
        var drawMenu = null;    // menu of the Draw circle button (createDrawMenu)
        var drawHandler = null; // the running L.Draw.Circle
        var drawingFor = null;  // filter of the running drawing: { sid, name, color, enabled } or { isNew, color }
        var drawEndedAt = 0;    // a click right after a drawing ends selects no circle
        var viewFitted = false; // the start view has been fitted to the regions
        var refitUntil = 0;     // until then a resize fits the start view again; user input ends it
        var focusSid = null;    // filter whose circles the start view fits (fitFilter message)
        var radiusPill = null;  // radius at the resize handle (edit) or at the cursor (draw)

        /*
         * The selected circle, edited on its own: { layer, region, backup: { latlng, radius },
         * ghost, spoke, armed, deleteTimer }. region is its string at selection time, the ghost
         * shows the size it had then, the spoke runs from the centre to the resize handle.
         */
        var selection = null;

        // Filters of the last setFilters in config order: { sid, name, color, enabled };
        // null until the parent has sent them
        var filters = null;
        var hiddenSids = {};    // filters whose circles the legend hides

        /*
         * Known servers per filter: sid -> { data, error, loading, at, shown, layer, timer }.
         * data = { total, approx, missing, points: [[lat, lon, n]], latlngs } from the parent's
         * knownServers answer; error: the parent could not load them (shown as unknown, never as
         * 0 servers); shown: the legend button shows them as dots (layer). The selection bar
         * counts them for the selected circle's filter, so selecting a circle loads them too.
         */
        var servers = {};
        var serverRenderer = null;          // one canvas in the pane gmServers, below the circles
        var SERVERS_MAX_AGE = 5 * 60000;    // loaded data older than this is asked for again
        var SERVERS_TIMEOUT = 60000;        // no answer by then (an older view.js): unknown
        var countFrame = 0;                 // requestAnimationFrame of the next counter update

        /*
         * Region identity lives in layer.gm, never in layer.options: Leaflet.draw's edit toolbar
         * saved and restored layer.options around every edit session.
         * gm = { token, sid, name, color, enabled, region, stored, inflight, pending,
         *        selected, hover, deleting, label }
         * stored is the string the parent last confirmed for UCI; region is the newest string the
         * map reported, which the next action names. The parent matches regions on the string
         * alone and answers the actions in the order they were sent, each once it has applied it
         * (committed); inflight counts the open ones. pending: a new circle waits for the parent;
         * deleting: its delete waits for the parent.
         */
        var circles = {}; // token -> layer, kept until the parent has answered for it
        var lastPick = null;    // { point, time, layer } of the last click that selected a circle
        // Tokens differ between iframe loads, so a late answer never hits a circle of a new map
        var tokenPrefix = Math.random().toString(36).slice(2, 10) + '-';
        var toastTimer = null;

        /*
         * Edit handles of the selected circle: round, HANDLE_SIZE (28 px, 36 px on touch screens),
         * a ring in the filter color, the resize handle always above the move handle (CSS).
         * Leaflet 1.9.4 reports L.Browser.touch on desktop browsers too, and L.Edit.SimpleShape
         * then takes the touch icons: set all four before the first circle exists.
         */
        // The size is set here, not in CSS: Leaflet positions the icon by iconSize. The touch
        // size is not tested on a touch device yet
        var HANDLE_SIZE = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ? 36 : 28;

        function handleIcon(kind, glyph, title) {
            return L.divIcon({
                className: 'gm-handle gm-handle--' + kind,
                iconSize: [HANDLE_SIZE, HANDLE_SIZE],
                html: '<span class="gm-handle-dot" title="' + title + '"><i class="fa-solid ' + glyph + '" aria-hidden="true"></i></span>'
            });
        }
        var moveHandleIcon = handleIcon('move', 'fa-arrows-up-down-left-right', 'Drag to move');
        var resizeHandleIcon = handleIcon('resize', 'fa-up-right-and-down-left-from-center', 'Drag to resize');
        L.Edit.Circle.mergeOptions({
            moveIcon: moveHandleIcon,
            resizeIcon: resizeHandleIcon,
            touchMoveIcon: moveHandleIcon,
            touchResizeIcon: resizeHandleIcon
        });

        // Define specialized icons for different marker types
        var blockedDivIcon = L.divIcon({
            html: '<i class="fa fa-exclamation-triangle" style="color: red;"></i>',
            iconSize: [25, 25],
            className: 'custom-div-icon'
        });

        var allowedConnectionIcon = L.divIcon({
            html: '<i class="fa fa-check-circle" style="color: green;"></i>',
            iconSize: [25, 25],
            className: 'custom-div-icon'
        });

        var allowedIPIcon = L.divIcon({
            html: '<i class="fa fa-user" style="color: blue;"></i>',
            iconSize: [25, 25],
            className: 'custom-div-icon'
        });

        // Marker icon and popup status per kind of connection (connectionKind)
        var CONNECTION_KINDS = {
            ip: { icon: allowedIPIcon, status: 'Whitelisted' },
            allowed: { icon: allowedConnectionIcon, status: 'Allowed' },
            blocked: { icon: blockedDivIcon, status: 'Blocked' }
        };

        // dst -> marker of a connection shown on the map; marker.gm = { kind, key }
        var connectionMarkers = {};

        // Initialize MarkerCluster group with customized iconCreateFunction
        var markerClusters = L.markerClusterGroup({
            iconCreateFunction: function(cluster) {
                var markers = cluster.getAllChildMarkers();
                var allowed = 0;
                var blocked = 0;
                var allowedIPs = 0;

                markers.forEach(function(marker) {
                    if (marker.options.icon === allowedConnectionIcon) {
                        allowed += 1;
                    } else if (marker.options.icon === blockedDivIcon) {
                        blocked += 1;
                    } else if (marker.options.icon === allowedIPIcon) {
                        allowedIPs += 1;
                    }
                });

                var size = markers.length;
                var className = '';
                var html = '';

                if (allowed > 0 && blocked === 0 && allowedIPs === 0) {
                    className = 'marker-cluster marker-cluster-allowed';
                    html = size;
                } else if (blocked > 0 && allowed === 0 && allowedIPs === 0) {
                    className = 'marker-cluster marker-cluster-blocked';
                    html = size;
                } else if (allowedIPs > 0 && allowed === 0 && blocked === 0) {
                    className = 'marker-cluster marker-cluster-allowed-ip'; // Use the new class for Allowed IP Clusters
                    html = size;
                } else {
                    className = 'marker-cluster marker-cluster-mixed';
                    html = size;
                }

                return new L.DivIcon({
                    html: '<div>' + html + '</div>',
                    className: className,
                    iconSize: L.point(40, 40) // Adjusted size to 40x40
                });
            }
        });

        function post(type, data) {
            window.parent.postMessage({ type: type, data: data }, location.origin);
        }

        /**
         * Shows a short message on top of the map, 6 s, or 10 s with buttons.
         * @param {string} text - The message, shown as text.
         * @param {Array} [actions] - [{ label, name, sid, id }]: buttons that send
         *   toastAction { name, sid, id }, e.g. Undo after a change was applied.
         */
        function showToast(text, actions) {
            var el = document.getElementById('gm-toast');
            var hide = function() { el.style.display = 'none'; };

            el.textContent = text;
            (actions || []).forEach(function(action) {
                var button = L.DomUtil.create('button', 'gm-toast-action', el);
                button.type = 'button';
                button.textContent = action.label;
                onTap(button, function() {
                    hide();
                    post('toastAction', { name: action.name, sid: action.sid, id: action.id });
                });
            });
            el.style.display = 'block';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(hide, (actions && actions.length) ? 10000 : 6000);
        }

        /**
         * Runs fn on a click (mouse, touch or keyboard) on el, which then goes no further.
         * While Leaflet.draw draws, it cancels every touchstart of the page, so a touch gives
         * no click event; touchend acts then. Not tested on touch devices yet.
         */
        function onTap(el, fn) {
            L.DomEvent.on(el, 'click', function(e) {
                L.DomEvent.stop(e);
                fn();
            });
            L.DomEvent.on(el, 'touchend', function(e) {
                if (drawHandler) {
                    L.DomEvent.stop(e);
                    fn();
                }
            });
        }

        // Whitelisted IPs (allowed_ip) arrive with is_allowed_ip
        function connectionKind(conn) {
            return conn.is_allowed_ip ? 'ip' : conn.allowed ? 'allowed' : 'blocked';
        }

        // A text field of the geo lookup, or '' when luci.geomate sent none (older backend or cache)
        function geoText(geo, key) {
            return (typeof geo[key] == 'string') ? geo[key] : '';
        }

        /**
         * Popup of a connection marker, built from elements and text nodes: filter names and
         * provider strings never run as markup. Country, city and ISP only when known.
         * @param {Object} conn - The connection.
         * @param {string} kind - connectionKind(conn).
         */
        function connectionPopup(conn, kind) {
            var geo = conn.geo, box = L.DomUtil.create('div', 'gm-popup'), fields,
                country = geoText(geo, 'country'), code = geoText(geo, 'countryCode'),
                isp = geoText(geo, 'isp'), org = geoText(geo, 'org');

            L.DomUtil.create('div', 'gm-popup-ip', box).textContent = conn.dst;
            L.DomUtil.create('div', 'gm-popup-status gm-popup-status--' + kind, box).textContent = CONNECTION_KINDS[kind].status;
            fields = L.DomUtil.create('dl', 'gm-popup-fields', box);
            [
                ['Filter', String(conn.filter_name || '')],
                ['Country', country && code ? country + ' (' + code + ')' : country || code],
                ['City', geoText(geo, 'city')],
                ['ISP', isp],
                ['Org', org !== isp ? org : '']
            ].forEach(function(f) {
                if (!f[1]) return;
                L.DomUtil.create('dt', '', fields).textContent = f[0];
                L.DomUtil.create('dd', '', fields).textContent = f[1];
            });
            return box;
        }

        /**
         * Updates the connection markers: new connections get a marker, gone ones lose it, a
         * changed status changes the icon. Markers are kept between polls, so an open popup
         * stays open.
         * @param {Array} connections - An array of connection objects.
         */
        function updateConnections(connections) {
            var seen = {}, added = [], removed = [], restyled = [];

            connections.forEach(function(conn) {
                var geo = conn && conn.geo, ip = conn && conn.dst, kind, key, marker, lat, lon;
                // A failed lookup arrives as an empty array: no position, no marker
                if (!geo || typeof ip != 'string' || seen[ip]) return;
                lat = Number(geo.lat);
                lon = Number(geo.lon);
                if (!lat || !lon || !Number.isFinite(lat) || !Number.isFinite(lon) || Array.isArray(geo.lat) || Array.isArray(geo.lon))
                    return;

                seen[ip] = true;
                kind = connectionKind(conn);
                key = JSON.stringify([kind, conn.filter_name, geo.country, geo.countryCode, geo.city, geo.isp, geo.org]);
                marker = connectionMarkers[ip];

                if (!marker) {
                    marker = L.marker([lat, lon], { icon: CONNECTION_KINDS[kind].icon });
                    marker.gm = { kind: kind, key: key };
                    marker.bindPopup(connectionPopup(conn, kind));
                    connectionMarkers[ip] = marker;
                    added.push(marker);
                    return;
                }
                if (!marker.getLatLng().equals([lat, lon])) marker.setLatLng([lat, lon]);
                if (marker.gm.kind !== kind) {
                    marker.gm.kind = kind;
                    marker.setIcon(CONNECTION_KINDS[kind].icon);
                    restyled.push(marker);
                }
                // An open popup takes the new content in place
                if (marker.gm.key !== key) {
                    marker.gm.key = key;
                    marker.setPopupContent(connectionPopup(conn, kind));
                }
            });

            Object.keys(connectionMarkers).forEach(function(ip) {
                if (!seen[ip]) {
                    removed.push(connectionMarkers[ip]);
                    delete connectionMarkers[ip];
                }
            });

            if (removed.length) markerClusters.removeLayers(removed);
            if (added.length) markerClusters.addLayers(added);
            // Cluster colors count the icons of their markers
            if (restyled.length) markerClusters.refreshClusters(restyled);
        }

        /**
         * Shows or hides the drawing tools and circle selection. Without write access the
         * parent applies nothing, so the map offers no tools.
         * @param {boolean} value - True when the user may not change regions.
         */
        function setReadonly(value) {
            readonly = value;
            L.DomUtil[readonly ? 'addClass' : 'removeClass'](map.getContainer(), 'gm-readonly');
            if (readonly) {
                closeDrawMenu(false);
                cancelDraw();
                endSelection(false);
            }
            updateToolbar();
        }

        // Theme colors from the view; each must be a valid CSS color, else the default stays
        var THEME_PROPS = {
            bg: '--gm-bg', fg: '--gm-fg', border: '--gm-border', accent: '--gm-accent', accentFg: '--gm-accent-fg',
            danger: '--gm-danger', dangerFg: '--gm-danger-fg', success: '--gm-success'
        };

        /**
         * Follows the LuCI theme: the light or dark defaults, then the theme's own colors.
         * @param {Object} theme - { dark, bg, fg, border, accent, accentFg, danger, dangerFg, success }
         */
        function setTheme(theme) {
            var root = document.documentElement;
            root.setAttribute('data-theme', theme.dark ? 'dark' : 'light');
            Object.keys(THEME_PROPS).forEach(function(key) {
                var v = theme[key];
                if (typeof v == 'string' && window.CSS && CSS.supports('color', v))
                    root.style.setProperty(THEME_PROPS[key], v);
                else
                    root.style.removeProperty(THEME_PROPS[key]);
            });
        }

        /**
         * Dimmed dark tiles (switch in the legend), in every theme.
         * @param {boolean} on - Dark tiles on.
         * @param {boolean} [remember] - Store the choice in this browser.
         */
        function setDarkTiles(on, remember) {
            L.DomUtil[on ? 'addClass' : 'removeClass'](document.documentElement, 'gm-dark-tiles');
            if (legend && legend.darkTiles) legend.darkTiles.checked = on;
            if (remember) {
                try { localStorage.setItem(DARK_TILES_KEY, on ? '1' : '0'); } catch (e) {}
            }
        }

        function storedDarkTiles() {
            try { return localStorage.getItem(DARK_TILES_KEY) === '1'; } catch (e) { return false; }
        }

        // Fullscreen belongs to the view, which sizes the iframe: the button and Escape ask for it
        function toggleFullscreen() {
            post('fullscreen', { on: !fullscreen });
        }

        /**
         * The view changed the fullscreen state: button state, and the map takes its new size.
         * @param {boolean} on - The map covers the window.
         */
        function setFullscreenState(on) {
            var a = toolbar.fullscreen;
            fullscreen = on;
            a.querySelector('i').className = 'fa-solid ' + (on ? 'fa-minimize' : 'fa-maximize');
            a.querySelector('.gm-btn-label').textContent = on ? 'Exit fullscreen' : 'Fullscreen';
            a.setAttribute('aria-label', on ? 'Exit fullscreen' : 'Fullscreen');
            a.title = on ? 'Exit fullscreen (Esc)' : 'Fullscreen';
            setPressed(a, on);
            // The iframe resizes with the view's CSS; Leaflet would notice on its own resize event
            requestAnimationFrame(function() { map.invalidateSize(); });
        }

        // Saved home view: { center: [lat, lng], zoom }, or null; the older map stored only
        // [lat, lng] (zoom 4)
        function loadHome() {
            var isLatLng = function(v) {
                return Array.isArray(v) && v.length === 2 && Number.isFinite(v[0]) && Number.isFinite(v[1]) &&
                    Math.abs(v[0]) <= 90 && Math.abs(v[1]) <= 180;
            };
            try {
                var v = JSON.parse(localStorage.getItem(HOME_KEY) || 'null');
                if (v && isLatLng(v.center) && Number.isFinite(v.zoom)) return { center: v.center, zoom: v.zoom };
                v = JSON.parse(localStorage.getItem('homePosition') || 'null');
                if (isLatLng(v)) return { center: v, zoom: 4 };
            } catch (e) {}
            return null;
        }

        // Home: the saved home view, else all circles. setView keeps the zoom at the lowest
        // zoom or above
        function goHome() {
            if (home) map.setView(home.center, home.zoom);
            else fitAll(false);
        }

        // Set home: the current view becomes the home view, the map stays where it is
        function setHome() {
            var center = map.getCenter().wrap();
            home = { center: [center.lat, center.lng], zoom: map.getZoom() };
            try {
                localStorage.setItem(HOME_KEY, JSON.stringify(home));
                showToast('Home view saved.');
            } catch (err) {
                showToast('Could not save the home view in this browser.');
            }
        }

        /**
         * Zooms to all regions, or to the home view when there are none.
         * @param {boolean} [quiet] - No note when there is no region (start view).
         */
        function fitAll(quiet) {
            var bounds = drawnItems.getBounds(), view = home || DEFAULT_VIEW;
            if (bounds.isValid()) {
                map.fitBounds(bounds, { padding: FIT_PADDING, maxZoom: 10 });
            } else {
                map.setView(view.center, view.zoom);
                if (!quiet) showToast('No circles yet.');
            }
        }

        /**
         * Lowest zoom: the smallest at which the world covers the whole map, never below 1.
         * maxBounds keeps the map on one world copy, so a smaller world leaves grey bands beside
         * it. The world is a square of 256 px at zoom 0 and doubles with every level (1024 px at
         * zoom 2, 2048 px at zoom 3). The height counts too: a map higher than wide (fullscreen
         * on an upright phone, a portrait monitor) would show bands above and below the world.
         * fitBounds stops at the lowest zoom; a map at least as wide as high still shows more
         * than half of the world's longitude there.
         * The marker cluster group builds its zoom levels from the map's lowest zoom when it is
         * first added and keeps them; below that level it shows its empty top cluster as a "0"
         * icon. So the group is rebuilt with its markers whenever the lowest zoom changes.
         */
        function updateMinZoom() {
            var size = map.getSize(), onMap = map.hasLayer(markerClusters), markers,
                z = Math.max(1, Math.ceil(Math.log2(Math.max(size.x, size.y) / 256)));
            if (map.getMinZoom() === z) return;
            // During a zoom animation Leaflet ignores setZoom(), also the one in setMinZoom():
            // try again when it ends
            if (map._animatingZoom) { map.once('zoomend', updateMinZoom); return; }
            // At once, so that setMinZoom() starts no zoom animation the group would miss
            if (map.getZoom() < z) map.setZoom(z, { animate: false });
            if (onMap) {
                markers = markerClusters.getLayers();
                map.removeLayer(markerClusters);
                // Off the map, clearLayers() drops the zoom levels; onAdd builds new ones
                markerClusters.clearLayers();
            }
            map.setMinZoom(z);
            if (onMap) {
                map.addLayer(markerClusters);
                markerClusters.addLayers(markers);
            }
        }

        // The start view: the circles of the focus filter if it has any, else the saved home
        // view, else all regions
        function fitStartView() {
            if (focusSid && fitFilter(focusSid)) return;
            if (home) map.setView(home.center, home.zoom);
            else fitAll(true);
        }

        // A resize shortly after the start view was fitted (the page still settles, a phone
        // turns) fits it again, until the user has touched the map
        function onMapResize() {
            updateMinZoom();
            if (refitUntil && Date.now() < refitUntil) fitStartView();
            else refitUntil = 0;
        }

        /**
         * Shows the mode bar with a text and buttons, and moves the top controls below it.
         * @param {string} text - What the user can do now.
         * @param {Array} buttons - [[label, fn], ...]
         * @param {string} [color] - Filter color, shown as a dot before the text.
         */
        function showModeBar(text, buttons, color) {
            modeBar.textContent = '';
            if (color) L.DomUtil.create('span', 'gm-mode-swatch', modeBar).style.background = color;
            L.DomUtil.create('span', 'gm-mode-text', modeBar).textContent = text;
            // The bar is a live region: the radius changes on every drag move, screen readers skip it
            L.DomUtil.create('span', 'gm-mode-extra', modeBar).setAttribute('aria-hidden', 'true');
            buttons.forEach(function(b) {
                var el = L.DomUtil.create('button', '', modeBar);
                el.type = 'button';
                el.textContent = b[0];
                onTap(el, b[1]);
            });
            modeBar.hidden = false;
            layoutBars();
        }

        function hideModeBar() {
            modeBar.hidden = true;
            layoutBars();
        }

        // Extra text in the mode bar, e.g. the radius while drawing. The text can wrap the bar
